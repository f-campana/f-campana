roud, turning health benefits from a cost centre into their most valuable investment.\n\nWe're building a vertically integrated health partner that seamlessly unites insurance and smart healthcare delivery into one system.\n\nBy connecting all aspects of care - private, public, and direct to consumer - we create the most member-centric healthcare experience. Through deep engagement, we empower everyone to overcome day-to-day health obstacles and live healthier lives.\n\nWe partner with 35K+ companies of all sizes, serving more than 950+ members, and have reached 680M+ in ARR.\n\nOur team of 700+ people (still growing) operates across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦.\n\n\n🤘 HOW WE DO IT ?\n\nPeople joining Alan are always surprised and delighted by our innovative working method. We have a set of cultural values https://alan.com/about/company-culture that guide our approach to work, such as:\n\n🎯 What drives us - We're obsessed with helping members live healthier\n\n - Mission is the Boss: long-term thinking, mission above all else\n\n - Member & customer-led: obsessed with solving problems and delighting users\n\n🏆 How we build excellence - We hire the best and empower them to succeed\n\n - Champions of excellence: extremely high standards and talent density\n\n - Distributed ownership: everyone owns their decisions and results\n\n - Radically transparent: all information accessible, written-first, async decisions\n\n🤝 How we grow together - We improve through honest feedback and bold thinking\n\n - Optimistic alchemy: optimists who collaborate with genuine care\n\n - Empathetic challengers: direct, caring feedback to help each other grow\n\n - Bold contrarians: think differently, try new approaches\n\n⚡ How we move fast — We fight complexity and focus on what matters\n\n - Disciplined execution: decisive action with compounding focus\n\n - Fight for simplicity: high-impact processes, smart frugality\n\n\n⭐ THE ENGINEERING TEAM ⭐\n\nIn our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!\n\n - Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.\n\n - We move fast, with a lot of ownership, and are proud to tackle big problems!\n\n - Our process is very simple: those who make product decisions are the same ones who build them.\n\n - Our stack is Python/Flask, React, React Native, PostgreSQL.\n\nWant to know more? Read this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan if you want to discover how life as an Engineer at Alan and this article https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c on our Engineering career path.\n\n\n🌍 INTERNATIONAL EXPANSION & NEW MARKETS\n\nAt Alan, we're on a mission to bring our innovative healthcare model to new countries and scale across Europe and beyond. We're building the foundations for rapid international expansion, creating systems and platforms that can adapt to diverse healthcare markets while maintaining the exceptional experience our members love.\n\nExamples of what you'd work on:\n\n - Build global-first platforms designed for multi-country deployment from day one, creating reusable components and architecture that can be quickly adapted to new markets with different healthcare systems, regulations, and languages\n\n - Launch new countries by designing and shipping core systems for insurance operations, claims processing, member experiences, and provider networks that work across diverse regulatory environments\n\n - Scale payment and billing infrastructure to handle multiple currencies, tax systems, and payment methods while maintaining compliance with local financial regulations\n\n - Design country-agnostic data models that accommodate vast differences in healthcare systems, from network-based models to reimbursement systems, while keeping data consistent and accessible globally\n\n - Create configuration and localization systems that allow new countries to be onboarded in weeks, not months, flexible enough to handle local nuances while maintaining global product standards\n\n - Ship member experiences that feel local while leveraging shared global components, building mobile and web interfaces that adapt seamlessly to different languages, cultures, and healthcare expectations\n\n - Own critical technical decisions as a domain expert, defining how Alan's systems evolve to support 10+ countries while maintaining engineering velocity and system reliability\n\nYou'll be joining at a pivotal moment as we accelerate our expansion strategy, with ambitious plans to enter multiple new markets. The systems you build will directly enable Alan's growth from 4 countries to the leading pan-European health partner.\n\nThis is a rare opportunity to shape how a fast-growing healthtech company scales internationally. Your work will impact hundreds of thousands of members across multiple countries.\n\n\n⭐ IS IT YOU WE’RE LOOKING FOR?\n\nWe are looking for engineers with 3+ years of experience to help us scale our Engineering community from different perspectives (product, tech, and internal organization-wise):\n\n - You’ll be able to tackle high-impact & high-risk projects involving many engineers.\n\n - You’ll design efficient systems and engineering practices to align with and facilitate interactions between multiple teams/products.\n\n - You’ll have the opportunity to mentor other engineers & lead crews (more details in this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan).\n\n - You’ll be able to contribute to hiring your future coworkers and shape candidates’ hiring experience (improving our technical assessment process etc...)\n\nYou would be a good fit at Alan if most of this sounds like you:\n\n - Well-versed in Object Oriented Programming such as Python, Java, C#, and enthusiastic about web technologies such as modern Javascript.\n\n - Willing to work in Python/JavaScript (but you don’t need to have experience with those 2 languages!).\n\n - Passionate about building products.\n\n - Self-starting and entrepreneurial.\n\n - Humble and still willing to grow (no matter your seniority!).\n\n - Collaborative, enthusiastic about teamwork, learning, and teaching.\n\n - Fluent in English (no need to speak French!).\n\nFor this opportunity, we are aiming to hire within the C-F level range.\n\nBut above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.\n\n\n🙌 PERKS & BENEFITS https://alan.com/en/careers/a/salary-equity\n\nAt Alan, we believe that being in good health is a basic need, and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\nTherefore, we offer:\n\n - Fair rewards. Generous equity packages complement your base salary.\n\n - Flexible Office. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.\n\n - All the tools you need. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and noise-canceling headphones.\n\n - Flexible vacation policy and flexible working hours. Organize your time as you wish.\n\n - Delightful healthcare insurance: Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country (permanent contracts only).\n\n - Transport. Country-specific commuter benefits.\n\n - Learning & Training opportunities. A highly flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.\n\n - Personal growth through coaching: At Alan, coaching isn't just a perk - it's core to who we are. Every Alaner is paired with a dedicated coach from day one, who helps maximize their impact, nurture engagement, and navigate Alan's values to develop their full potential. Learn more about our coaching culture https://alan.com/en/blog/discover-alan/a/alan-culture-excellence-through-coaching.\n\n - Parental leave. Extended parental leave for all new parents.\n\n\nIMPORTANT NOTE: WE HIRE PEOPLE NOT ROLES.\n\nIf you're excited about this opportunity but don't check every box, we'd love to hear from you. Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.\n\nIf you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?\n\nRemember, this is just a guide, not a checklist.\n\nWe'll be thrilled to receive your application!\n\n🔖 Check out our About Alan https://alan.com/about and Career https://alan.com/careers pages, as well as our Medium https://medium.com/alan, blog https://blog.alan.com/ and Glassdoor page https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm for more info.\n\n🔄 A quick note about the process\nNote: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link."},"descriptionClosing":null},"shortDescription":null,"applicationFormDefinitionId":"a17c5ab3-fa8f-4d56-95f7-ff3cf0aa37ab","surveyFormDefinitionIds":[],"linkedData":{"@context":"https://schema.org/","@type":"JobPosting","title":"Full Software Engineer (x/f/m) - International Expansion","description":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul><h1><strong>🐼 Who we are</strong></h1><p style=\"min-height:1.5em\"><strong>You. Better. With Alan.</strong></p><p style=\"min-height:1.5em\">Alan's vision is to make prevention the new norm of care for all. <strong>Our mission is to help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</strong></p><p style=\"min-height:1.5em\">We're building a <strong>vertically integrated health partner</strong> that seamlessly unites insurance and smart healthcare delivery into one system.</p><p style=\"min-height:1.5em\">By connecting all aspects of care - private, public, and direct to consumer - <strong>we create the most member-centric healthcare experience.</strong> Through deep engagement, we empower everyone to overcome day-to-day health obstacles and live healthier lives.</p><p style=\"min-height:1.5em\">We partner with <strong>35K+ companies</strong> of all sizes, serving more than <strong>950+ members</strong>, and have reached <strong>680M+</strong> in ARR.</p><p style=\"min-height:1.5em\">Our team of <strong>700+ people</strong> (still growing) operates across <strong>France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦.</strong></p><p style=\"min-height:1.5em\"></p><h1>🤘 How we do it ?</h1><p style=\"min-height:1.5em\">People joining Alan are always surprised and delighted by our innovative working method. We have a set of <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about/company-culture\">cultural values</a> that guide our approach to work, such as:</p><p style=\"min-height:1.5em\"><strong>🎯 What drives us - We're obsessed with helping members live healthier</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong>: long-term thinking, mission above all else</p></li><li><p style=\"min-height:1.5em\"><strong>Member &amp; customer-led</strong>: obsessed with solving problems and delighting users</p></li></ul><p style=\"min-height:1.5em\"><strong>🏆 How we build excellence - We hire the best and empower them to succeed</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Champions of excellence</strong>: extremely high standards and talent density</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed ownership</strong>: everyone owns their decisions and results</p></li><li><p style=\"min-height:1.5em\"><strong>Radically transparent</strong>: all information accessible, written-first, async decisions</p></li></ul><p style=\"min-height:1.5em\"><strong>🤝 How we grow together - We improve through honest feedback and bold thinking</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Optimistic alchemy</strong>: optimists who collaborate with genuine care</p></li><li><p style=\"min-height:1.5em\"><strong>Empathetic challengers</strong>: direct, caring feedback to help each other grow</p></li><li><p style=\"min-height:1.5em\"><strong>Bold contrarians</strong>: think differently, try new approaches</p></li></ul><p style=\"min-height:1.5em\"><strong>⚡ How we move fast — We fight complexity and focus on what matters</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Disciplined execution</strong>: decisive action with compounding focus</p></li><li><p style=\"min-height:1.5em\"><strong>Fight for simplicity</strong>: high-impact processes, smart frugality</p></li></ul><p style=\"min-height:1.5em\"></p><h1>⭐ The Engineering team ⭐ </h1><p style=\"min-height:1.5em\">In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.</p></li><li><p style=\"min-height:1.5em\">We move fast, with a lot of ownership, and are proud to tackle big problems!</p></li><li><p style=\"min-height:1.5em\">Our process is very simple: those who make product decisions are the same ones who build them.</p></li><li><p style=\"min-height:1.5em\">Our stack is Python/Flask, React, React Native, PostgreSQL.</p></li></ul><p style=\"min-height:1.5em\">Want to know more? Read <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a> if you want to discover how life as an Engineer at Alan and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c\">this article</a> on our Engineering career path.</p><p style=\"min-height:1.5em\"></p><h1><strong>🌍 International Expansion &amp; New Markets</strong></h1><p style=\"min-height:1.5em\">At Alan, we're on a mission to bring our innovative healthcare model to new countries and scale across Europe and beyond. We're building the foundations for rapid international expansion, creating systems and platforms that can adapt to diverse healthcare markets while maintaining the exceptional experience our members love.</p><p style=\"min-height:1.5em\"><strong>Examples of what you'd work on:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Build global-first platforms</strong> designed for multi-country deployment from day one, creating reusable components and architecture that can be quickly adapted to new markets with different healthcare systems, regulations, and languages</p></li><li><p style=\"min-height:1.5em\"><strong>Launch new countries</strong> by designing and shipping core systems for insurance operations, claims processing, member experiences, and provider networks that work across diverse regulatory environments</p></li><li><p style=\"min-height:1.5em\"><strong>Scale payment and billing infrastructure</strong> to handle multiple currencies, tax systems, and payment methods while maintaining compliance with local financial regulations</p></li><li><p style=\"min-height:1.5em\"><strong>Design country-agnostic data models</strong> that accommodate vast differences in healthcare systems, from network-based models to reimbursement systems, while keeping data consistent and accessible globally</p></li><li><p style=\"min-height:1.5em\"><strong>Create configuration and localization systems</strong> that allow new countries to be onboarded in weeks, not months, flexible enough to handle local nuances while maintaining global product standards</p></li><li><p style=\"min-height:1.5em\"><strong>Ship member experiences that feel local</strong> while leveraging shared global components, building mobile and web interfaces that adapt seamlessly to different languages, cultures, and healthcare expectations</p></li><li><p style=\"min-height:1.5em\"><strong>Own critical technical decisions</strong> as a domain expert, defining how Alan's systems evolve to support 10+ countries while maintaining engineering velocity and system reliability</p></li></ul><p style=\"min-height:1.5em\">You'll be joining at a pivotal moment as we <strong>accelerate our expansion strategy</strong>, with ambitious plans to enter multiple new markets. The systems you build will directly enable Alan's growth from 4 countries to the leading pan-European health partner.</p><p style=\"min-height:1.5em\">This is a rare opportunity to shape how a fast-growing healthtech company scales internationally. Your work will impact hundreds of thousands of members across multiple countries.</p><p style=\"min-height:1.5em\"></p><h1> ⭐ Is it you we’re looking for?</h1><p style=\"min-height:1.5em\">We are looking for engineers with 3+ years of experience to help us scale our Engineering community from different perspectives (product, tech, and internal organization-wise):</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You’ll be able to tackle high-impact &amp; high-risk projects involving many engineers.</p></li><li><p style=\"min-height:1.5em\">You’ll design efficient systems and engineering practices to align with and facilitate interactions between multiple teams/products.</p></li><li><p style=\"min-height:1.5em\">You’ll have the opportunity to mentor other engineers &amp; lead crews (more details in <a target=\"_blank\" rel=\"noopener noreferrer\" class=\"postings-link\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a>).</p></li><li><p style=\"min-height:1.5em\">You’ll be able to contribute to hiring your future coworkers and shape candidates’ hiring experience (improving our technical assessment process etc...)</p></li></ul><p style=\"min-height:1.5em\"><strong>You would be a good fit at Alan if most of this sounds like you: </strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Well-versed in Object Oriented Programming such as Python, Java, C#, and enthusiastic about web technologies such as modern Javascript.</p></li><li><p style=\"min-height:1.5em\">Willing to work in Python/JavaScript (but you don’t need to have experience with those 2 languages!).</p></li><li><p style=\"min-height:1.5em\">Passionate about building products.</p></li><li><p style=\"min-height:1.5em\">Self-starting and entrepreneurial.</p></li><li><p style=\"min-height:1.5em\">Humble and still willing to grow (no matter your seniority!).</p></li><li><p style=\"min-height:1.5em\">Collaborative, enthusiastic about teamwork, learning, and teaching.</p></li><li><p style=\"min-height:1.5em\">Fluent in English (no need to speak French!).</p></li></ul><p style=\"min-height:1.5em\">For this opportunity, we are aiming to hire within the C-F level range.</p><p style=\"min-height:1.5em\">But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.</p><p style=\"min-height:1.5em\"></p><h1>🙌   <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/salary-equity\">Perks &amp; Benefits</a></h1><p style=\"min-height:1.5em\">At Alan, we believe that <strong>being in good health is a basic need,</strong> and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are <strong>happy, efficient and spend only high-quality time</strong> with co-workers. </p><
