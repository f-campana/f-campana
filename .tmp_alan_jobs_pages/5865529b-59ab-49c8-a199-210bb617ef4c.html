  <meta name="description" content="YOU. BETTER. WITH ALAN.

Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.

Our mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.

By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.

We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.


HOW WE WORK: OUR LEADERSHIP PRINCIPLES

 - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission&#39;s success above all else.

 - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.

 - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.

 - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.


⭐ THE ENGINEERING TEAM ⭐

In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!

Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.

We move fast, with a lot of ownership, and are proud to tackle big problems!

We do security as we do everything else — that is, not quite the traditional way, but always in line with our leadership principles.

Joining Alan as a Security Software Engineer team means you&#39;re at the forefront of protecting sensitive health data and ensuring our systems are resilient against threats.

Want to know more? Read this article https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c on our Engineering career path.


🤖 THE TECH FOUNDATIONS AREA

🎯 Mission: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.

🔭 Scope:

 1. Infrastructure enablement for product crews (e.g. hosting improvements https://www.qovery.com/case-study/alan-case-study/, CI/CD https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733, scalability, multi-cloud architecture)

 2. Security and compliance facilitation (e.g. authentication, encryption, threat protection)

 3. Developer productivity enhancements (e.g. local environment setup https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c, monorepo tooling https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc, observability, tech stack evolution)

 4. Design and development unification (e.g. design system https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d, accessibility)

 5. AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)

👀 Focus for 2026:

In 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.


⭐️ IS IT YOU WE’RE LOOKING FOR? ⭐️

We are looking for problem-solver engineers with 3+ years of experience who get excited about simplifying complex business problems related to security:

 - You’ll be able to tackle high-impact &amp; high-risk projects involving many engineers.

 - You’ll design efficient secure systems and engineering practices to align with and facilitate interactions between multiple teams/products.

 - You’ll have the opportunity to mentor other engineers &amp; lead crews (more details in this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan).

 - You’ll be able to contribute to hiring your future coworkers and shape candidates’ hiring experience (improving our technical assessment process, etc...)

You would be a good fit at Alan if most of this sounds like you:

 - Well-versed in Object Oriented Programming such as Python, Java, C#, and enthusiastic about web technologies such as modern Javascript.

 - Willing to work in Python/JavaScript (but you don’t need to have experience with those 2 languages!).

 - Passionate about building secure products.

 - Self-starting and entrepreneurial.

 - Humble and still willing to grow (no matter your seniority!).

 - Collaborative, enthusiastic about teamwork, learning, and teaching.

 - Fluent in English (no need to speak French!).

For this opportunity, we are aiming to hire within the C1 - F level range.

But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.


🙌 PERKS &amp; BENEFITS https://alan.com/about/life-at-alan/a/perks

At Alan, we believe that being in good health is a basic need, and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.

Therefore, we offer:

 - Fair rewards. Generous equity packages complement your base salary, for permanent contracts only.

 - Flexible Office. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.

 - All the tools you need. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and Bose noise-canceling headphones.

 - Flexible vacation policy and flexible working hours. Organize your time as you wish.

 - Delightful healthcare insurance: Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country (permanent contracts only).

 - Transport. Country-specific commuter benefits.

 - Learning &amp; Training opportunities. A highly flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.

 - Personal growth through coaching: At Alan, coaching isn&#39;t just a perk - it&#39;s core to who we are. Every Alaner is paired with a dedicated coach from day one, who helps maximize their impact, nurture engagement, and navigate Alan&#39;s values to develop their full potential. Learn more about our coaching culture https://alan.com/en/blog/discover-alan/a/alan-culture-excellence-through-coaching.

 - Parental leave. Extended parental leave for all new parents, for permanent contracts only.

🔄 A quick note about the process
Note: While you&#39;re applying for a specific area,, you may join a different engineering team based on where we think you&#39;ll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link." />

3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b6f2a2f2-490b-4305-84f3-0f986d70ef14.png","logoSquareImageUrl":"https://app.ashbyhq.com/api/images/org-theme-logo/16fb5c4f-12a4-4e77-a698-3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b8987509-72b3-449b-8d58-1af70771e1e8.png","applicationSubmittedSuccessMessage":"Your application was successfully submitted. We'll contact shortly. Thank you!","jobBoardTopDescriptionHtml":"<p style=\"min-height:1.5em\"><strong>You. Better. With Alan. </strong><br /><br />Alan's vision is to make <strong>prevention the new norm</strong> of care for all.<br />‭<br />Alan's mission is to <strong>help people live in good health to 100</strong> while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p>","jobBoardBottomDescriptionHtml":"<h2><strong>Important note: we hire people, not roles.</strong></h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you.</strong> Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p>","jobPostingBackUrl":null},"appConfirmationTrackingPixelHtml":null,"recruitingPrivacyPolicyUrl":"https://alan.com/candidate-privacy","timezone":"Europe/Paris","candidateScheduleCancellationReasonRequirementStatus":"Off"},"posting":{"id":"5865529b-59ab-49c8-a199-210bb617ef4c","title":"Software Engineer (Security) - Tech Foundations","updatedAt":"2026-02-11T10:18:39.545Z","departmentName":"Engineering","departmentExternalName":"Engineering","teamName":"Engineering","teamExternalName":"Engineering","teamNames":["Engineering"],"locationName":"Anywhere in France, Belgium, Spain","locationExternalName":"Anywhere in France, Belgium, Spain","isListed":true,"suppressDescriptionOpening":false,"suppressDescriptionClosing":false,"descriptionHtml":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul><h1>⭐ The Engineering team ⭐ </h1><p style=\"min-height:1.5em\">In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!</p><p style=\"min-height:1.5em\">Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.</p><p style=\"min-height:1.5em\">We move fast, with a lot of ownership, and are proud to tackle big problems!</p><p style=\"min-height:1.5em\">We do security as we do everything else — that is, not quite the traditional way, but always in line with our leadership principles.</p><p style=\"min-height:1.5em\">Joining Alan as a Security Software Engineer team means you're at the forefront of protecting sensitive health data and ensuring our systems are resilient against threats.</p><p style=\"min-height:1.5em\">Want to know more? Read <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c\">this article</a> on our Engineering career path.</p><p style=\"min-height:1.5em\"></p><h1>🤖 The Tech Foundations area</h1><p style=\"min-height:1.5em\">🎯 <strong>Mission</strong>: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.</p><p style=\"min-height:1.5em\"><strong>🔭 Scope:</strong></p><ol style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Infrastructure enablement for product crews (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.qovery.com/case-study/alan-case-study/\">hosting improvements</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733\">CI/CD</a>, scalability, multi-cloud architecture)</p></li><li><p style=\"min-height:1.5em\">Security and compliance facilitation (e.g. authentication, encryption, threat protection)</p></li><li><p style=\"min-height:1.5em\">Developer productivity enhancements (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c\">local environment setup</a>, monorepo <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc\">tooling</a>, observability, tech stack evolution)</p></li><li><p style=\"min-height:1.5em\">Design and development unification (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d\">design system</a>, accessibility)</p></li><li><p style=\"min-height:1.5em\">AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)</p></li></ol><p style=\"min-height:1.5em\"><strong>👀 Focus for 2026:</strong></p><p style=\"min-height:1.5em\">In 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.</p><p style=\"min-height:1.5em\"></p><h1>⭐️ <strong>Is it you we’re looking for?</strong> ⭐️</h1><p style=\"min-height:1.5em\">We are looking for problem-solver engineers with 3+ years of experience who get excited about simplifying complex business problems related to security:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You’ll be able to tackle high-impact &amp; high-risk projects involving many engineers.</p></li><li><p style=\"min-height:1.5em\">You’ll design efficient secure systems and engineering practices to align with and facilitate interactions between multiple teams/products.</p></li><li><p style=\"min-height:1.5em\">You’ll have the opportunity to mentor other engineers &amp; lead crews (more details in <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a>).</p></li><li><p style=\"min-height:1.5em\">You’ll be able to contribute to hiring your future coworkers and shape candidates’ hiring experience (improving our technical assessment process, etc...)</p></li></ul><p style=\"min-height:1.5em\">You would be a good fit at Alan if most of this sounds like you:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Well-versed in Object Oriented Programming such as Python, Java, C#, and enthusiastic about web technologies such as modern Javascript.</p></li><li><p style=\"min-height:1.5em\">Willing to work in Python/JavaScript (but you don’t need to have experience with those 2 languages!).</p></li><li><p style=\"min-height:1.5em\">Passionate about building secure products.</p></li><li><p style=\"min-height:1.5em\">Self-starting and entrepreneurial.</p></li><li><p style=\"min-height:1.5em\">Humble and still willing to grow (no matter your seniority!).</p></li><li><p style=\"min-height:1.5em\">Collaborative, enthusiastic about teamwork, learning, and teaching.</p></li><li><p style=\"min-height:1.5em\">Fluent in English (no need to speak French!).</p></li></ul><p style=\"min-height:1.5em\">For this opportunity, we are aiming to hire within the C1 - F level range.</p><p style=\"min-height:1.5em\">But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.</p><p style=\"min-height:1.5em\"></p><h1>🙌   <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about/life-at-alan/a/perks\">Perks &amp; Benefits</a></h1><p style=\"min-height:1.5em\">At Alan, we believe that <strong>being in good health is a basic need</strong>, and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are <strong>happy, efficient and spend only high-quality time</strong> with co-workers.</p><p style=\"min-height:1.5em\"><strong>Therefore, we offer:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Fair rewards</strong>. Generous equity packages complement your base salary, <em>for permanent contracts only.</em></p></li><li><p style=\"min-height:1.5em\"><strong>Flexible Office</strong>. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.</p></li><li><p style=\"min-height:1.5em\"><strong>All the tools you need</strong>. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and Bose noise-canceling headphones.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible vacation policy and flexible working hours</strong>. Organize your time as you wish.</p></li><li><p style=\"min-height:1.5em\"><strong>Delightful healthcare insurance:</strong> Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country<em> (permanent contracts only)</em>.</p></li><li><p style=\"min-height:1.5em\"><strong>Transport</strong>. Country-specific commuter benefits.</p></li><li><p style=\"min-height:1.5em\"><strong>Learning &amp; Training opportunities</strong>. A highly flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.</p></li><li><p style=\"min-height:1.5em\"><strong>Personal growth through coaching</strong>: At Alan, coaching isn't just a perk -<strong> </strong>it's core to who we are. Every Alaner is paired with a dedicated coach from day one, who helps maximize their impact, nurture engagement, and navigate Alan's values to develop their full potential.<strong> </strong><a target=\"_blank\" rel=\"noopener noreferrer\" class=\"notion-link-token notion-focusable-token notion-enable-hover\" href=\"https://alan.com/en/blog/discover-alan/a/alan-culture-excellence-through-coaching\"><strong>Learn more about our coaching culture</strong></a><strong>.</strong></p></li><li><p style=\"min-height:1.5em\"><strong>Parental leave</strong>. Extended parental leave for all new parents, <em>for permanent contracts only.</em></p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process</strong><br /><em>Note: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link\"><em>here</em></a><em>. </em></p>","descriptionPlainText":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.\n\n\n⭐ THE ENGINEERING TEAM ⭐\n\nIn our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!\n\nBeing an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.\n\nWe move fast, with a lot of ownership, and are proud to tackle big problems!\n\nWe do security as we do everything else — that is, not quite the traditional way, but always in line with our leadership principles.\n\nJoining Alan as a Security Software Engineer team means you're at the forefront of protecting sensitive health data and ensuring our systems are resilient against threats.\n\nWant to know more? Read this article https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c on our Engineering career path.\n\n\n🤖 THE TECH FOUNDATIONS AREA\n\n🎯 Mission: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.\n\n🔭 Scope:\n\n 1. Infrastructure enablement for product crews (e.g. hosting improvements https://www.qovery.com/case-study/alan-case-study/, CI/CD https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733, scalability, multi-cloud architecture)\n\n 2. Security and compliance facilitation (e.g. authentication, encryption, threat protection)\n\n 3. Developer productivity enhancements (e.g. local environment setup https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c, monorepo tooling https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc, observability, tech stack evolution)\n\n 4. Design and development unification (e.g. design system https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d, accessibility)\n\n 5. AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)\n\n👀 Focus for 2026:\n\nIn 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.\n\n\n⭐️ IS IT YOU WE’RE LOOKING FOR? ⭐️\n\nWe are looking for problem-solver engineers with 3+ years of experience who get excited about simplifying complex business problems related to security:\n\n - You’ll be able to tackle high-impact & high-risk projects involving many engineers.\n\n - You’ll design efficient secure systems and engineering practices to align with and facilitate interactions between multiple teams/products.\n\n - You’ll have the opportunity to mentor other engineers & lead crews (more details in this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan).\n\n - You’ll be able to contribute to hiring your future coworkers and shape candidates’ hiring experience (improving our technical assessment process, etc...)\n\nYou would be a good fit at Alan if most of this sounds like you:\n\n - Well-versed in Object Oriented Programming such as Python, Java, C#, and enthusiastic about web technologies such as modern Javascript.\n\n - Willing to work in Python/JavaScript (but you don’t need to have experience with those 2 languages!).\n\n - Passionate about building secure products.\n\n - Self-starting and entrepreneurial.\n\n - Humble and still willing to grow (no matter your seniority!).\n\n - Collaborative, enthusiastic about teamwork, learning, and teaching.\n\n - Fluent in English (no need to speak French!).\n\nFor this opportunity, we are aiming to hire within the C1 - F level range.\n\nBut above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.\n\n\n🙌 PERKS & BENEFITS https://alan.com/about/life-at-alan/a/perks\n\nAt Alan, we believe that being in good health is a basic need, and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\nTherefore, we offer:\n\n - Fair rewards. Generous equity packages complement your base salary, for permanent contracts only.\n\n - Flexible Office. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.\n\n - All the tools you need. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and Bose noise-canceling headphones.\n\n - Flexible vacation policy and flexible working hours. Organize your time as you wish.\n\n - Delightful healthcare insurance: Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country (permanent contracts only).\n\n - Transport. Country-specific commuter benefits.\n\n - Learning & Training opportunities. A highly flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.\n\n - Personal growth through coaching: At Alan, coaching isn't just a perk - it's core to who we are. Every Alaner is paired with a dedicated coach from day one, who helps maximize their impact, nurture engagement, and navigate Alan's values to develop their full potential. Learn more about our coaching culture https://alan.com/en/blog/discover-alan/a/alan-culture-excellence-through-coaching.\n\n - Parental leave. Extended parental leave for all new parents, for permanent contracts only.\n\n🔄 A quick note about the process\nNote: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link.","descriptionParts":{"descriptionOpening":{"html":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul>","plain":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership."},"descriptionBody":{"html":"<h1>⭐ The Engineering team ⭐ </h1><p style=\"min-height:1.5em\">In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!</p><p style=\"min-height:1.5em\">Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.</p><p style=\"min-height:1.5em\">We move fast, with a lot of ownership, and are proud to tackle big problems!</p><p style=\"min-height:1.5em\">We do security as we do everything else — that is, not quite the traditional way, but always in line with our leadership principles.</p><p style=\"min-height:1.5em\">Joining Alan as a Security Software Engineer team means you're at the forefront of protecting sensitive health data and ensuring our systems are resilient against threats.</p><p style=\"min-height:1.5em\">Want to know more? Read <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c\">this article</a> on our Engineering career path.</p><p style=\"min-height:1.5em\"></p><h1>🤖 The Tech Foundations area</h1><p style=\"min-height:1.5em\">🎯 <strong>Mission</strong>: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.</p><p style=\"min-height:1.5em\"><strong>🔭 Scope:</strong></p><ol style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Infrastructure enablement for product crews (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.qovery.com/case-study/alan-case-study/\">hosting improvements</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733\">CI/CD</a>, scalability, multi-cloud architecture)</p></li><li><p style=\"min-height:1.5em\">Security and compliance facilitation (e.g. authentication, encryption, threat protection)</p></li><li><p style=\"min-height:1.5em\">Developer productivity enhancements (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c\">local environment setup</a>, monorepo <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc\">tooling</a>, observability, tech stack evolution)</p></li><li><p style=\"min-height:1.5em\">Design and development unification (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d\">design system</a>, accessibility)</p></li><li><p style=\"min-height:1.5em\">AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)</p></li></ol><p style=\"min-height:1.5em\"><strong>👀 Focus for 2026:</strong></p><p style=\"min-height:1.5em\">In 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.</p><p style=\"min-height:1.5em\"></p><h1>⭐️ <strong>Is it you we’re looking for?</strong> ⭐️</h1><p style=\"min-height:1.5em\">We are looking for problem-solver engineers with 3+ years of experience who get excited about simplifying complex business problems related to security:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You’ll be able to tackle high-impact &amp; high-risk projects involving many engineers.</p></li><li><p style=\"min-height:1.5em\">You’ll design efficient secure systems and engineering practices to align with and facilitate interactions between multiple teams/products.</p></li><li><p style=\"min-height:1.5em\">You’ll have the opportunity to mentor other engineers &amp; lead crews (more details in <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a>).</p></li><li><p style=\"min-height:1.5em\">You’ll be able to contribute to hiring your future coworkers and shape candidates’ hiring experience (improving our technical assessment process, etc...)</p></li></ul><p style=\"min-height:1.5em\">You would be a good fit at Alan if most of this sounds like you:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Well-versed in Object Oriented Programming such as Python, Java, C#, and enthusiastic about web technologies such as modern Javascript.</p></li><li><p style=\"min-height:1.5em\">Willing to work in Python/JavaScript (but you don’t need to have experience with those 2 languages!).</p></li><li><p style=\"min-height:1.5em\">Passionate about building secure products.</p></li><li><p style=\"min-height:1.5em\">Self-starting and entrepreneurial.</p></li><li><p style=\"min-height:1.5em\">Humble and still willing to grow (no matter your seniority!).</p></li><li><p style=\"min-height:1.5em\">Collaborative, enthusiastic about teamwork, learning, and teaching.</p></li><li><p style=\"min-height:1.5em\">Fluent in English (no need to speak French!).</p></li></ul><p style=\"min-height:1.5em\">For this opportunity, we are aiming to hire within the C1 - F level range.</p><p style=\"min-height:1.5em\">But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.</p><p style=\"min-height:1.5em\"></p><h1>🙌   <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about/life-at-alan/a/perks\">Perks &amp; Benefits</a></h1><p style=\"min-height:1.5em\">At Alan, we believe that <strong>being in good health is a basic need</strong>, and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are <strong>happy, efficient and spend only high-quality time</strong> with co-workers.</p><p style=\"min-height:1.5em\"><strong>Therefore, we offer:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Fair rewards</strong>. Generous equity packages complement your base salary, <em>for permanent contracts only.</em></p></li><li><p style=\"min-height:1.5em\"><strong>Flexible Office</strong>. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.</p></li><li><p style=\"min-height:1.5em\"><strong>All the tools you need</strong>. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and Bose noise-canceling headphones.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible vacation policy and flexible working hours</strong>. Organize your time as you wish.</p></li><li><p style=\"min-height:1.5em\"><strong>Delightful healthcare insurance:</strong> Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country<em> (permanent contracts only)</em>.</p></li><li><p style=\"min-height:1.5em\"><strong>Transport</strong>. Country-specific commuter benefits.</p></li><li><p style=\"min-height:1.5em\"><strong>Learning &amp; Training opportunities</strong>. A highly flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.</p></li><li><p style=\"min-height:1.5em\"><strong>Personal growth through coaching</strong>: At Alan, coaching isn't just a perk -<strong> </strong>it's core to who we are. Every Alaner is paired with a dedicated coach from day one, who helps maximize their impact, nurture engagement, and navigate Alan's values to develop their full potential.<strong> </strong><a target=\"_blank\" rel=\"noopener noreferrer\" class=\"notion-link-token notion-focusable-token notion-enable-hover\" href=\"https://alan.com/en/blog/discover-alan/a/alan-culture-excellence-through-coaching\"><strong>Learn more about our coaching culture</strong></a><strong>.</strong></p></li><li><p style=\"min-height:1.5em\"><strong>Parental leave</strong>. Extended parental leave for all new parents, <em>for permanent contracts only.</em></p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process</strong><br /><em>Note: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link\"><em>here</em></a><em>. </em></p>","plain":"⭐ THE ENGINEERING TEAM ⭐\n\nIn our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!\n\nBeing an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.\n\nWe move fast, with a lot of ownership, and are proud to tackle big problems!\n\nWe do security as we do everything else — that is, not quite the traditional way, but always in line with our leadership principles.\n\nJoining Alan as a Security Software Engineer team means you're at the forefront of protecting sensitive health data and ensuring our systems are resilient against threats.\n\nWant to know more? Read this article https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c on our Engineering career path.\n\n\n🤖 THE TECH FOUNDATIONS AREA\n\n🎯 Mission: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.\n\n🔭 Scope:\n\n 1. Infrastructure enablement for product crews (e.g. hosting improvements https://www.qovery.com/case-study/alan-case-study/, CI/CD https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733, scalability, multi-cloud architecture)\n\n 2. Security and compliance facilitation (e.g. authentication, encryption, threat protection)\n\n 3. Developer productivity enhancements (e.g. local environment setup https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c, monorepo tooling https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc, observability, tech stack evolution)\n\n 4. Design and development unification (e.g. design system https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d, accessibility)\n\n 5. AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)\n\n👀 Focus for 2026:\n\nIn 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.\n\n\n⭐️ IS IT YOU WE’RE LOOKING FOR? ⭐️\n\nWe are looking for problem-solver engineers with 3+ years of experience who get excited about simplifying complex business problems related to security:\n\n - You’ll be able to tackle high-impact & high-risk projects involving many engineers.\n\n - You’ll design efficient secure systems and engineering practices to align with and facilitate interactions between multiple teams/products.\n\n - You’ll have the opportunity to mentor other engineers & lead crews (more details in this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan).\n\n - You’ll be able to contribute to hiring your future coworkers and shape candidates’ hiring experience (improving our technical assessment process, etc...)\n\nYou would be a good fit at Alan if most of this sounds like you:\n\n - Well-versed in Object Oriented Programming such as Python, Java, C#, and enthusiastic about web technologies such as modern Javascript.\n\n - Willing to work in Python/JavaScript (but you don’t need to have experience with those 2 languages!).\n\n - Passionate about building secure products.\n\n - Self-starting and entrepreneurial.\n\n - Humble and still willing to grow (no matter your seniority!).\n\n - Collaborative, enthusiastic about teamwork, learning, and teaching.\n\n - Fluent in English (no need to speak French!).\n\nFor this opportunity, we are aiming to hire within the C1 - F level range.\n\nBut above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.\n\n\n🙌 PERKS & BENEFITS https://alan.com/about/life-at-alan/a/perks\n\nAt Alan, we believe that being in good health is a basic need, and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\nTherefore, we offer:\n\n - Fair rewards. Generous equity packages complement your base salary, for permanent contracts only.\n\n - Flexible Office. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.\n\n - All the tools you need. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and Bose noise-canceling headphones.\n\n - Flexible vacation policy and flexible working hours. Organize your time as you wish.\n\n - Delightful healthcare insurance: Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country (permanent contracts only).\n\n - Transport. Country-specific commuter benefits.\n\n - Learning & Training opportunities. A highly flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.\n\n - Personal growth through coaching: At Alan, coaching isn't just a perk - it's core to who we are. Every Alaner is paired with a dedicated coach from day one, who helps maximize their impact, nurture engagement, and navigate Alan's values to develop their full potential. Learn more about our coaching culture https://alan.com/en/blog/discover-alan/a/alan-culture-excellence-through-coaching.\n\n - Parental leave. Extended parental leave for all new parents, for permanent contracts only.\n\n🔄 A quick note about the process\nNote: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link."},"descriptionClosing":null},"shortDescription":null,"applicationFormDefinitionId":"b0544849-d400-4af8-913f-fc2d25e9b5e0","surveyFormDefinitionIds":[],"linkedData":{"@context":"https://schema.org/","@type":"JobPosting","title":"Software Engineer (Security) - Tech Foundations","description":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul><h1>⭐ The Engineering team ⭐ </h1><p style=\"min-height:1.5em\">In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!</p><p style=\"min-height:1.5em\">Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.</p><p style=\"min-height:1.5em\">We move fast, with a lot of ownership, and are proud to tackle big problems!</p><p style=\"min-height:1.5em\">We do security as we do everything else — that is, not quite the traditional way, but always in line with our leadership principles.</p><p style=\"min-height:1.5em\">Joining Alan as a Security Software Engineer team means you're at the forefront of protecting sensitive health data and ensuring our systems are resilient against threats.</p><p style=\"min-height:1.5em\">Want to know more? Read <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c\">this article</a> on our Engineering career path.</p><p style=\"min-height:1.5em\"></p><h1>🤖 The Tech Foundations area</h1><p style=\"min-height:1.5em\">🎯 <strong>Mission</strong>: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.</p><p style=\"min-height:1.5em\"><strong>🔭 Scope:</strong></p><ol style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Infrastructure enablement for product crews (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.qovery.com/case-study/alan-case-study/\">hosting improvements</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733\">CI/CD</a>, scalability, multi-cloud architecture)</p></li><li><p style=\"min-height:1.5em\">Security and compliance facilitation (e.g. authentication, encryption, threat protection)</p></li><li><p style=\"min-height:1.5em\">Developer productivity enhancements (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c\">local environment setup</a>, monorepo <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc\">tooling</a>, observability, tech stack evolution)</p></li><li><p style=\"min-height:1.5em\">Design and development unification (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d\">design system</a>, accessibility)</p></li><li><p style=\"min-height:1.5em\">AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)</p></li></ol><p style=\"min-height:1.5em\"><strong>👀 Focus for 2026:</strong></p><p style=\"min-height:1.5em\">In 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.</p><p style=\"min-height:1.5em\"></p><h1>⭐️ <strong>Is it you we’re looking for?</strong> ⭐️</h1><p style=\"min-height:1.5em\">We are looking for problem-solver engineers with 3+ years of experience who get excited about simplifying complex business problems related to security:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You’ll be able to tackle high-impact &amp; high-risk projects involving many engineers.</p></li><li><p style=\"min-height:1.5em\">You’ll design efficient secure systems and engineering practices to align with and facilitate interactions between multiple teams/products.</p></li><li><p style=\"min-height:1.5em\">You’ll have the opportunity to mentor other engineers &amp; lead crews (more details in <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a>).</p></li><li><p style=\"min-height:1.5em\">You’ll be able to contribute to hiring your future coworkers and shape candidates’ hiring experience (improving our technical assessment process, etc...)</p></li></ul><p style=\"min-height:1.5em\">You would be a good fit at Alan if most of this sounds like you:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Well-versed in Object Oriented Programming such as Python, Java, C#, and enthusiastic about web technologies such as modern Javascript.</p></li><li><p style=\"min-height:1.5em\">Willing to work in Python/JavaScript (but you don’t need to have experience with those 2 languages!).</p></li><li><p style=\"min-height:1.5em\">Passionate about building secure products.</p></li><li><p style=\"min-height:1.5em\">Self-starting and entrepreneurial.</p></li><li><p style=\"min-height:1.5em\">Humble and still willing to grow (no matter your seniority!).</p></li><li><p style=\"min-height:1.5em\">Collaborative, enthusiastic about teamwork, learning, and teaching.</p></li><li><p style=\"min-height:1.5em\">Fluent in English (no need to speak French!).</p></li></ul><p style=\"min-height:1.5em\">For this opportunity, we are aiming to hire within the C1 - F level range.</p><p style=\"min-height:1.5em\">But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.</p><p style=\"min-height:1.5em\"></p><h1>🙌   <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about/life-at-alan/a/perks\">Perks &amp; Benefits</a></h1><p style=\"min-height:1.5em\">At Alan, we believe that <strong>being in good health is a basic need</strong>, and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are <strong>happy, efficient and spend only high-quality time</strong> with co-workers.</p><p style=\"min-height:1.5em\"><strong>Therefore, we offer:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Fair rewards</strong>. Generous equity packages complement your base salary, <em>for permanent contracts only.</em></p></li><li><p style=\"min-height:1.5em\"><strong>Flexible Office</strong>. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.</p></li><li><p style=\"min-height:1.5em\"><strong>All the tools you need</strong>. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and Bose noise-canceling headphones.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible vacation policy and flexible working hours</strong>. Organize your time as you wish.</p></li><li><p style=\"min-height:1.5em\"><strong>Delightful healthcare insurance:</strong> Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country<em> (permanent contracts only)</em>.</p></li><li><p style=\"min-height:1.5em\"><strong>Transport</strong>. Country-specific commuter benefits.</p></li><li><p style=\"min-height:1.5em\"><strong>Learning &amp; Training opportunities</strong>. A highly flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.</p></li><li><p style=\"min-height:1.5em\"><strong>Personal growth through coaching</strong>: At Alan, coaching isn't just a perk -<strong> </strong>it's core to who we are. Every Alaner is paired with a dedicated coach from day one, who helps maximize their impact, nurture engagement, and navigate Alan's values to develop their full potential.<strong> </strong><a target=\"_blank\" rel=\"noopener noreferrer\" class=\"notion-link-token notion-focusable-token notion-enable-hover\" href=\"https://alan.com/en/blog/discover-alan/a/alan-culture-excellence-through-coaching\"><strong>Learn more about our coaching culture</strong></a><strong>.</strong></p></li><li><p style=\"min-height:1.5em\"><strong>Parental leave</strong>. Extended parental leave for all new parents, <em>for permanent contracts only.</em></p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process</strong><br /><em>Note: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link\"><em>here</em></a><em>. </em></p>","directApply":true,"identifier":{"@type":"PropertyValue","name":"Alan","value":"5865529b-59ab-49c8-a199-210bb617ef4c"},"datePosted
