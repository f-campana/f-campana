  <meta name="description" content="YOU. BETTER. WITH ALAN.

Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.

Our mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.

By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.

We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.


HOW WE WORK: OUR LEADERSHIP PRINCIPLES

 - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission&#39;s success above all else.

 - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.

 - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.

 - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.


🐼 WHO WE ARE

You. Better. With Alan.

Alan&#39;s vision is to make prevention the new norm of care for all. Our mission is to help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.

We&#39;re building a vertically integrated health partner that seamlessly unites insurance and smart healthcare delivery into one system.

By connecting all aspects of care - private, public, and direct to consumer - we create the most member-centric healthcare experience. Through deep engagement, we empower everyone to overcome day-to-day health obstacles and live healthier lives.

We partner with 35K+ companies of all sizes, serving more than 1M users , and have reached 770M+ in ARR.

Our team of 700+ people (still growing) operates across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦.


🤘 HOW WE DO IT ?

People joining Alan are always surprised and delighted by our innovative working method. We have a set of cultural values https://alan.com/about/company-culture that guide our approach to work, such as:

🎯 What drives us - We&#39;re obsessed with helping members live healthier

 - Mission is the Boss: long-term thinking, mission above all else

 - Member &amp; customer-led: obsessed with solving problems and delighting users

🏆 How we build excellence - We hire the best and empower them to succeed

 - Champions of excellence: extremely high standards and talent density

 - Distributed ownership: everyone owns their decisions and results

 - Radically transparent: all information accessible, written-first, async decisions

🤝 How we grow together - We improve through honest feedback and bold thinking

 - Optimistic alchemy: optimists who collaborate with genuine care

 - Empathetic challengers: direct, caring feedback to help each other grow

 - Bold contrarians: think differently, try new approaches

⚡ How we move fast — We fight complexity and focus on what matters

 - Disciplined execution: decisive action with compounding focus

 - Fight for simplicity: high-impact processes, smart frugality


⭐ THE PRODUCT PLATFORM AREA


🎯 MISSION

We enable product crews to move faster by providing reliable, reusable, and simple internal services. We encapsulate complexity, expose clear interfaces, and build mature, long-term building blocks.


🔭 SCOPE

Our focus is on building reusable internal capabilities that power multiple product flows:

 - Core Services: APIs &amp; systems like Payment, Messaging, Document Processing, Pricing Engine

 - Shared Platforms: Centralized services (e.g. AI Platform) with strong adoption across areas.

 - Operational Tooling: Dashboards and automation that support reliability, observability, and scalability.

 - Foundational User Experience - Ensure quality and consistency of the UX through shared layout systems, navigation, reusable UI components

Our role is to empower product teams, reducing their cognitive load.


⚡ IMPACT

 - Your work will be used daily by hundreds of product builders across Alan.

 - You’ll shape reusable building blocks that make it faster and safer to launch products across multiple countries.

 - By improving adoption of our services, you’ll directly improve product velocity, consistency, and member experience.


⚡ WHY THIS ROLE IS SPECIAL

 - High Leverage: Your work is multiplied across the entire company — adoption &amp; reliability is our main KPIs.

 - Complex Problems: Multi-country services, abstraction design, and adoption challenges.

 - Platform Mindset: You’ll build services like a product, with product teams as your customers.

 - Ownership: You’ll influence product direction, mentor engineers, and shape Alan’s internal platform for years to come.

You’ll work closely with product crews across all Alan areas, as well as with our Architecture Group and Tech Foundation Area, making sure our systems scale globally and align with long-term technical strategy


🛠️ THE STACK

Python/Flask, React, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.


🔍 WHAT WE’RE LOOKING FOR

Experience we value

 - 3+ years in backend, platform, or infrastructure-oriented engineering roles

 - Experience designing and maintaining internal services, APIs, or SDKs

 - You love turning complex problems into elegant solutions

 - You care about the &quot;why&quot; behind what you build, not just the &quot;how&quot;


MINDSET WE VALUE

 - You think in terms of platform as a product: other engineers are your customers

 - You simplify complexity with clear abstractions and long-term ownership

 - You are collaborative, humble, and motivated by enabling others

 - You leverage AI to redefine our roles and unlock scalability

 - Healthcare technology excites you

 - You are fluent in English (no French required)


🌍 HOW WE WORK

 - Location: You must be legally eligible to work in France, Belgium, or Spain.

 - Remote work: We offer remote work flexibility, but we value in-person collaboration


🎯 IMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.

If you&#39;re excited about this opportunity but don&#39;t check every box, we&#39;d love to hear from you. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.

If you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?

Remember, this is just a guide, not a checklist.

We&#39;ll be thrilled to receive your application!

🔖 Check out our About Alan https://alan.com/about and Career https://alan.com/careers pages, as well as our Medium https://medium.com/alan, blog https://blog.alan.com/ and Glassdoor page https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm for more info.


YOU WANT TO KNOW MORE ABOUT ALAN?

 - 🙌 Perks &amp; Benefits https://alan.com/en/careers/a/salary-equity: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.

 - 🤘 A strong culture https://alan.com/en/about/a/leadership-principles: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work

🔄 A quick note about the process

is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul><h1>🐼 Who we are</h1><p style=\"min-height:1.5em\"><strong>You. Better. With Alan.</strong></p><p style=\"min-height:1.5em\">Alan's vision is to make prevention the new norm of care for all. <strong>Our mission is to help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</strong></p><p style=\"min-height:1.5em\">We're building a <strong>vertically integrated health partner</strong> that seamlessly unites insurance and smart healthcare delivery into one system.</p><p style=\"min-height:1.5em\">By connecting all aspects of care - private, public, and direct to consumer - <strong>we create the most member-centric healthcare experience.</strong> Through deep engagement, we empower everyone to overcome day-to-day health obstacles and live healthier lives.</p><p style=\"min-height:1.5em\">We partner with <strong>35K+ companies</strong> of all sizes, serving more than <strong>1M users</strong> , and have reached <strong>770M+</strong> in ARR.</p><p style=\"min-height:1.5em\">Our team of <strong>700+ people</strong> (still growing) operates across <strong>France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦.</strong></p><p style=\"min-height:1.5em\"></p><h1>🤘 How we do it ?</h1><p style=\"min-height:1.5em\">People joining Alan are always surprised and delighted by our innovative working method. We have a set of <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about/company-culture\">cultural values</a> that guide our approach to work, such as:</p><p style=\"min-height:1.5em\"><strong>🎯 What drives us - We're obsessed with helping members live healthier</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong>: long-term thinking, mission above all else</p></li><li><p style=\"min-height:1.5em\"><strong>Member &amp; customer-led</strong>: obsessed with solving problems and delighting users</p></li></ul><p style=\"min-height:1.5em\"><strong>🏆 How we build excellence - We hire the best and empower them to succeed</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Champions of excellence</strong>: extremely high standards and talent density</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed ownership</strong>: everyone owns their decisions and results</p></li><li><p style=\"min-height:1.5em\"><strong>Radically transparent</strong>: all information accessible, written-first, async decisions</p></li></ul><p style=\"min-height:1.5em\"><strong>🤝 How we grow together - We improve through honest feedback and bold thinking</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Optimistic alchemy</strong>: optimists who collaborate with genuine care</p></li><li><p style=\"min-height:1.5em\"><strong>Empathetic challengers</strong>: direct, caring feedback to help each other grow</p></li><li><p style=\"min-height:1.5em\"><strong>Bold contrarians</strong>: think differently, try new approaches</p></li></ul><p style=\"min-height:1.5em\"><strong>⚡ How we move fast — We fight complexity and focus on what matters</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Disciplined execution</strong>: decisive action with compounding focus</p></li><li><p style=\"min-height:1.5em\"><strong>Fight for simplicity</strong>: high-impact processes, smart frugality</p></li></ul><p style=\"min-height:1.5em\"></p><h1>⭐ The Product Platform Area </h1><p style=\"min-height:1.5em\"></p><h2>🎯 Mission</h2><p style=\"min-height:1.5em\"><strong>We enable product crews to move faster by providing reliable, reusable, and simple internal services</strong>. We encapsulate complexity, expose clear interfaces, and build mature, long-term building blocks.</p><p style=\"min-height:1.5em\"></p><h2>🔭 Scope</h2><p style=\"min-height:1.5em\">Our focus is on building reusable internal capabilities that power multiple product flows:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Core Services:</strong> APIs &amp; systems like <strong>Payment</strong>, <strong>Messaging</strong>, <strong>Document Processing</strong>, <strong>Pricing Engine</strong></p></li><li><p style=\"min-height:1.5em\"><strong>Shared Platforms</strong>: Centralized services (e.g. <strong>AI Platform</strong>) with strong adoption across areas.</p></li><li><p style=\"min-height:1.5em\"><strong>Operational Tooling</strong>: Dashboards and automation that support reliability, observability, and scalability.</p></li><li><p style=\"min-height:1.5em\"><strong>Foundational User Experience </strong>- Ensure quality and consistency of the UX through shared layout systems, navigation, reusable UI components</p></li></ul><p style=\"min-height:1.5em\">Our role is to empower product teams, reducing their cognitive load. </p><p style=\"min-height:1.5em\"></p><h2>⚡ Impact</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Your work will be used daily by hundreds of  product builders across Alan.</p></li><li><p style=\"min-height:1.5em\">You’ll shape reusable building blocks that make it faster and safer to launch products across multiple countries.</p></li><li><p style=\"min-height:1.5em\">By improving adoption of our services, you’ll directly improve product velocity, consistency, and member experience.</p></li></ul><p style=\"min-height:1.5em\"></p><h2>⚡ Why this role is special</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>High Leverage: </strong>Your work is multiplied across the entire company — adoption &amp; reliability is our main KPIs.</p></li><li><p style=\"min-height:1.5em\"><strong>Complex Problems:</strong> Multi-country services, abstraction design, and adoption challenges.</p></li><li><p style=\"min-height:1.5em\"><strong>Platform Mindset:</strong> You’ll build services like a product, with product teams as your customers.</p></li><li><p style=\"min-height:1.5em\"><strong>Ownership:</strong> You’ll influence product direction, mentor engineers, and shape Alan’s internal platform for years to come.</p></li></ul><p style=\"min-height:1.5em\">You’ll work closely with product crews across all Alan areas, as well as with our<strong> Architecture Group</strong> and <strong>Tech Foundation Area</strong>, making sure our systems scale globally and align with long-term technical strategy</p><p style=\"min-height:1.5em\"></p><h1>🛠️ The Stack</h1><p style=\"min-height:1.5em\">Python/Flask, React, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.</p><p style=\"min-height:1.5em\"></p><h1>🔍 What we’re looking for</h1><p style=\"min-height:1.5em\"><strong>Experience we value</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">3+ years in backend, platform, or infrastructure-oriented engineering roles</p></li><li><p style=\"min-height:1.5em\">Experience designing and maintaining internal services, APIs, or SDKs</p></li><li><p style=\"min-height:1.5em\">You love turning complex problems into elegant solutions</p></li><li><p style=\"min-height:1.5em\">You care about the \"why\" behind what you build, not just the \"how\"</p></li></ul><h2>Mindset we value</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You think in terms of platform as a product: other engineers are your customers</p></li><li><p style=\"min-height:1.5em\">You simplify complexity with clear abstractions and long-term ownership</p></li><li><p style=\"min-height:1.5em\">You are collaborative, humble, and motivated by enabling others</p></li><li><p style=\"min-height:1.5em\">You leverage AI to redefine our roles and unlock scalability</p></li><li><p style=\"min-height:1.5em\">Healthcare technology excites you</p></li><li><p style=\"min-height:1.5em\">You are fluent in English (no French required)</p></li></ul><p style=\"min-height:1.5em\"></p><h1>🌍 How we work</h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Location</strong>: You must be legally eligible to work in France, Belgium, or Spain.</p></li><li><p style=\"min-height:1.5em\"><strong>Remote work:</strong> We offer remote work flexibility, but we value in-person collaboration</p></li></ul><p style=\"min-height:1.5em\"></p><h1>🎯 Important note: we hire people, not roles.</h1><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you</strong>. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist. </strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p><p style=\"min-height:1.5em\"></p><h1>You want to know more about Alan?</h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>🙌 </strong><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/salary-equity\"><strong>Perks &amp; Benefits</strong></a><strong>:</strong> Alaners are provided with a stimulating environment and perks ensuring they are <strong>happy, efficient and spend only high-quality time</strong> with co-workers.</p></li><li><p style=\"min-height:1.5em\"><strong>🤘 </strong><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/about/a/leadership-principles\"><strong>A strong culture</strong></a><strong>:</strong> People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work</p><p style=\"min-height:1.5em\"></p></li></ul><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process</strong><br /><em>Note: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link\"><em>here</em></a><em>. </em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"></p>","descriptionPlainText":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.\n\n\n🐼 WHO WE ARE\n\nYou. Better. With Alan.\n\nAlan's vision is to make prevention the new norm of care for all. Our mission is to help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nWe're building a vertically integrated health partner that seamlessly unites insurance and smart healthcare delivery into one system.\n\nBy connecting all aspects of care - private, public, and direct to consumer - we create the most member-centric healthcare experience. Through deep engagement, we empower everyone to overcome day-to-day health obstacles and live healthier lives.\n\nWe partner with 35K+ companies of all sizes, serving more than 1M users , and have reached 770M+ in ARR.\n\nOur team of 700+ people (still growing) operates across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦.\n\n\n🤘 HOW WE DO IT ?\n\nPeople joining Alan are always surprised and delighted by our innovative working method. We have a set of cultural values https://alan.com/about/company-culture that guide our approach to work, such as:\n\n🎯 What drives us - We're obsessed with helping members live healthier\n\n - Mission is the Boss: long-term thinking, mission above all else\n\n - Member & customer-led: obsessed with solving problems and delighting users\n\n🏆 How we build excellence - We hire the best and empower them to succeed\n\n - Champions of excellence: extremely high standards and talent density\n\n - Distributed ownership: everyone owns their decisions and results\n\n - Radically transparent: all information accessible, written-first, async decisions\n\n🤝 How we grow together - We improve through honest feedback and bold thinking\n\n - Optimistic alchemy: optimists who collaborate with genuine care\n\n - Empathetic challengers: direct, caring feedback to help each other grow\n\n - Bold contrarians: think differently, try new approaches\n\n⚡ How we move fast — We fight complexity and focus on what matters\n\n - Disciplined execution: decisive action with compounding focus\n\n - Fight for simplicity: high-impact processes, smart frugality\n\n\n⭐ THE PRODUCT PLATFORM AREA\n\n\n🎯 MISSION\n\nWe enable product crews to move faster by providing reliable, reusable, and simple internal services. We encapsulate complexity, expose clear interfaces, and build mature, long-term building blocks.\n\n\n🔭 SCOPE\n\nOur focus is on building reusable internal capabilities that power multiple product flows:\n\n - Core Services: APIs & systems like Payment, Messaging, Document Processing, Pricing Engine\n\n - Shared Platforms: Centralized services (e.g. AI Platform) with strong adoption across areas.\n\n - Operational Tooling: Dashboards and automation that support reliability, observability, and scalability.\n\n - Foundational User Experience - Ensure quality and consistency of the UX through shared layout systems, navigation, reusable UI components\n\nOur role is to empower product teams, reducing their cognitive load.\n\n\n⚡ IMPACT\n\n - Your work will be used daily by hundreds of product builders across Alan.\n\n - You’ll shape reusable building blocks that make it faster and safer to launch products across multiple countries.\n\n - By improving adoption of our services, you’ll directly improve product velocity, consistency, and member experience.\n\n\n⚡ WHY THIS ROLE IS SPECIAL\n\n - High Leverage: Your work is multiplied across the entire company — adoption & reliability is our main KPIs.\n\n - Complex Problems: Multi-country services, abstraction design, and adoption challenges.\n\n - Platform Mindset: You’ll build services like a product, with product teams as your customers.\n\n - Ownership: You’ll influence product direction, mentor engineers, and shape Alan’s internal platform for years to come.\n\nYou’ll work closely with product crews across all Alan areas, as well as with our Architecture Group and Tech Foundation Area, making sure our systems scale globally and align with long-term technical strategy\n\n\n🛠️ THE STACK\n\nPython/Flask, React, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.\n\n\n🔍 WHAT WE’RE LOOKING FOR\n\nExperience we value\n\n - 3+ years in backend, platform, or infrastructure-oriented engineering roles\n\n - Experience designing and maintaining internal services, APIs, or SDKs\n\n - You love turning complex problems into elegant solutions\n\n - You care about the \"why\" behind what you build, not just the \"how\"\n\n\nMINDSET WE VALUE\n\n - You think in terms of platform as a product: other engineers are your customers\n\n - You simplify complexity with clear abstractions and long-term ownership\n\n - You are collaborative, humble, and motivated by enabling others\n\n - You leverage AI to redefine our roles and unlock scalability\n\n - Healthcare technology excites you\n\n - You are fluent in English (no French required)\n\n\n🌍 HOW WE WORK\n\n - Location: You must be legally eligible to work in France, Belgium, or Spain.\n\n - Remote work: We offer remote work flexibility, but we value in-person collaboration\n\n\n🎯 IMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.\n\nIf you're excited about this opportunity but don't check every box, we'd love to hear from you. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.\n\nIf you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?\n\nRemember, this is just a guide, not a checklist.\n\nWe'll be thrilled to receive your application!\n\n🔖 Check out our About Alan https://alan.com/about and Career https://alan.com/careers pages, as well as our Medium https://medium.com/alan, blog https://blog.alan.com/ and Glassdoor page https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm for more info.\n\n\nYOU WANT TO KNOW MORE ABOUT ALAN?\n\n - 🙌 Perks & Benefits https://alan.com/en/careers/a/salary-equity: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\n - 🤘 A strong culture https://alan.com/en/about/a/leadership-principles: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work\n\n🔄 A quick note about the process\nNote: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link.","descriptionParts":{"descriptionOpening":{"html":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-he st centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership."},"descriptionBody":{"html":"<h1>🐼 Who we are</h1><p style=\"min-height:1.5em\"><strong>You. Better. With Alan.</strong></p><p style=\"min-height:1.5em\">Alan's vision is to make prevention the new norm of care for all. <strong>Our mission is to help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</strong></p><p style=\"min-height:1.5em\">We're building a <strong>vertically integrated health partner</strong> that seamlessly unites insurance and smart healthcare delivery into one system.</p><p style=\"min-height:1.5em\">By connecting all aspects of care - private, public, and direct to consumer - <strong>we create the most member-centric healthcare experience.</strong> Through deep engagement, we empower everyone to overcome day-to-day health obstacles and live healthier lives.</p><p style=\"min-height:1.5em\">We partner with <strong>35K+ companies</strong> of all sizes, serving more than <strong>1M users</strong> , and have reached <strong>770M+</strong> in ARR.</p><p style=\"min-height:1.5em\">Our team of <strong>700+ people</strong> (still growing) operates across <strong>France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦.</strong></p><p style=\"min-height:1.5em\"></p><h1>🤘 How we do it ?</h1><p style=\"min-height:1.5em\">People joining Alan are always surprised and delighted by our innovative working method. We have a set of <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about/company-culture\">cultural values</a> that guide our approach to work, such as:</p><p style=\"min-height:1.5em\"><strong>🎯 What drives us - We're obsessed with helping members live healthier</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong>: long-term thinking, mission above all else</p></li><li><p style=\"min-height:1.5em\"><strong>Member &amp; customer-led</strong>: obsessed with solving problems and delighting users</p></li></ul><p style=\"min-height:1.5em\"><strong>🏆 How we build excellence - We hire the best and empower them to succeed</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Champions of excellence</strong>: extremely high standards and talent density</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed ownership</strong>: everyone owns their decisions and results</p></li><li><p style=\"min-height:1.5em\"><strong>Radically transparent</strong>: all information accessible, written-first, async decisions</p></li></ul><p style=\"min-height:1.5em\"><strong>🤝 How we grow together - We improve through honest feedback and bold thinking</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Optimistic alchemy</strong>: optimists who collaborate with genuine care</p></li><li><p style=\"min-height:1.5em\"><strong>Empathetic challengers</strong>: direct, caring feedback to help each other grow</p></li><li><p style=\"min-height:1.5em\"><strong>Bold contrarians</strong>: think differently, try new approaches</p></li></ul><p style=\"min-height:1.5em\"><strong>⚡ How we move fast — We fight complexity and focus on what matters</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Disciplined execution</strong>: decisive action with compounding focus</p></li><li><p style=\"min-height:1.5em\"><strong>Fight for simplicity</strong>: high-impact processes, smart frugality</p></li></ul><p style=\"min-height:1.5em\"></p><h1>⭐ The Product Platform Area </h1><p style=\"min-height:1.5em\"></p><h2>🎯 Mission</h2><p style=\"min-height:1.5em\"><strong>We enable product crews to move faster by providing reliable, reusable, and simple internal services</strong>. We encapsulate complexity, expose clear interfaces, and build mature, long-term building blocks.</p><p style=\"min-height:1.5em\"></p><h2>🔭 Scope</h2><p style=\"min-height:1.5em\">Our focus is on building reusable internal capabilities that power multiple product flows:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Core Services:</strong> APIs &amp; systems like <strong>Payment</strong>, <strong>Messaging</strong>, <strong>Document Processing</strong>, <strong>Pricing Engine</strong></p></li><li><p style=\"min-height:1.5em\"><strong>Shared Platforms</strong>: Centralized services (e.g. <strong>AI Platform</strong>) with strong adoption across areas.</p></li><li><p style=\"min-height:1.5em\"><strong>Operational Tooling</strong>: Dashboards and automation that support reliability, observability, and scalability.</p></li><li><p style=\"min-height:1.5em\"><strong>Foundational User Experience </strong>- Ensure quality and consistency of the UX through shared layout systems, navigation, reusable UI components</p></li></ul><p style=\"min-height:1.5em\">Our role is to empower product teams, reducing their cognitive load. </p><p style=\"min-height:1.5em\"></p><h2>⚡ Impact</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Your work will be used daily by hundreds of  product builders across Alan.</p></li><li><p style=\"min-height:1.5em\">You’ll shape reusable building blocks that make it faster and safer to launch products across multiple countries.</p></li><li><p style=\"min-height:1.5em\">By improving adoption of our services, you’ll directly improve product velocity, consistency, and member experience.</p></li></ul><p style=\"min-height:1.5em\"></p><h2>⚡ Why this role is special</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>High Leverage: </strong>Your work is multiplied across the entire company — adoption &amp; reliability is our main KPIs.</p></li><li><p style=\"min-height:1.5em\"><strong>Complex Problems:</strong> Multi-country services, abstraction design, and adoption challenges.</p></li><li><p style=\"min-height:1.5em\"><strong>Platform Mindset:</strong> You’ll build services like a product, with product teams as your customers.</p></li><li><p style=\"min-height:1.5em\"><strong>Ownership:</strong> You’ll influence product direction, mentor engineers, and shape Alan’s internal platform for years to come.</p></li></ul><p style=\"min-height:1.5em\">You’ll work closely with product crews across all Alan areas, as well as with our<strong> Architecture Group</strong> and <strong>Tech Foundation Area</strong>, making sure our systems scale globally and align with long-term technical strategy</p><p style=\"min-height:1.5em\"></p><h1>🛠️ The Stack</h1><p style=\"min-height:1.5em\">Python/Flask, React, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.</p><p style=\"min-height:1.5em\"></p><h1>🔍 What we’re looking for</h1><p style=\"min-height:1.5em\"><strong>Experience we value</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">3+ years in backend, platform, or infrastructure-oriented engineering roles</p></li><li><p style=\"min-height:1.5em\">Experience designing and maintaining internal services, APIs, or SDKs</p></li><li><p style=\"min-height:1.5em\">You love turning complex problems into elegant solutions</p></li><li><p style=\"min-height:1.5em\">You care about the \"why\" behind what you build, not just the \"how\"</p></li></ul><h2>Mindset we value</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You think in terms of platform as a product: other engineers are your customers</p></li><li><p style=\"min-height:1.5em\">You simplify complexity with clear abstractions and long-term ownership</p></li><li><p style=\"min-height:1.5em\">You are collaborative, humble, and motivated by enabling others</p></li><li><p style=\"min-height:1.5em\">You leverage AI to redefine our roles and unlock scalability</p></li><li><p style=\"min-height:1.5em\">Healthcare technology excites you</p></li><li><p style=\"min-height:1.5em\">You are fluent in English (no French required)</p></li></ul><p style=\"min-height:1.5em\"></p><h1>🌍 How we work</h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Location</strong>: You must be legally eligible to work in France, Belgium, or Spain.</p></li><li><p style=\"min-height:1.5em\"><strong>Remote work:</strong> We offer remote work flexibility, but we value in-person collaboration</p></li></ul><p style=\"min-height:1.5em\"></p><h1>🎯 Important note: we hire people, not roles.</h1><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you</strong>. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist. </strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p><p style=\"min-height:1.5em\"></p><h1>You want to know more about Alan?</h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>🙌 </strong><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/salary-equity\"><strong>Perks &amp; Benefits</strong></a><strong>:</strong> Alaners are provided with a stimulating environment and perks ensuring they are <strong>happy, efficient and spend only high-quality time</strong> with co-workers.</p></li><li><p style=\"min-height:1.5em\"><strong>🤘 </strong><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/about/a/leadership-principles\"><strong>A strong culture</strong></a><strong>:</strong> People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work</p><p style=\"min-height:1.5em\"></p></li></ul><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process</strong><br /><em>Note: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e back to help each other grow\n\n - Bold contrarians: think differently, try new approaches\n\n⚡ How we move fast — We fight complexity and focus on what matters\n\n - Disciplined execution: decisive action with compounding focus\n\n - Fight for simplicity: high-impact processes, smart frugality\n\n\n⭐ THE PRODUCT PLATFORM AREA\n\n\n🎯 MISSION\n\nWe enable product crews to move faster by providing reliable, reusable, and simple internal services. We encapsulate complexity, expose clear interfaces, and build mature, long-term building blocks.\n\n\n🔭 SCOPE\n\nOur focus is on building reusable internal capabilities that power multiple product flows:\n\n - Core Services: APIs & systems like Payment, Messaging, Document Processing, Pricing Engine\n\n - Shared Platforms: Centralized services (e.g. AI Platform) with strong adoption across areas.\n\n - Operational Tooling: Dashboards and automation that support reliability, observability, and scalability.\n\n - Foundational User Experience - Ensure quality and consistency of the UX through shared layout systems, navigation, reusable UI components\n\nOur role is to empower product teams, reducing their cognitive load.\n\n\n⚡ IMPACT\n\n - Your work will be used daily by hundreds of product builders across Alan.\n\n - You’ll shape reusable building blocks that make it faster and safer to launch products across multiple countries.\n\n - By improving adoption of our services, you’ll directly improve product velocity, consistency, and member experience.\n\n\n⚡ WHY THIS ROLE IS SPECIAL\n\n - High Leverage: Your work is multiplied across the entire company — adoption & reliability is our main KPIs.\n\n - Complex Problems: Multi-country services, abstraction design, and adoption challenges.\n\n - Platform Mindset: You’ll build services like a product, with product teams as your customers.\n\n - Ownership: You’ll influence product direction, mentor engineers, and shape Alan’s internal platform for years to come.\n\nYou’ll work closely with product crews across all Alan areas, as well as with our Architecture Group and Tech Foundation Area, making sure our systems scale globally and align with long-term technical strategy\n\n\n🛠️ THE STACK\n\nPython/Flask, React, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.\n\n\n🔍 WHAT WE’RE LOOKING FOR\n\nExperience we value\n\n - 3+ years in backend, platform, or infrastructure-oriented engineering roles\n\n - Experience designing and maintaining internal services, APIs, or SDKs\n\n - You love turning complex problems into elegant solutions\n\n - You care about the \"why\" behind what you build, not just the \"how\"\n\n\nMINDSET WE VALUE\n\n - You think in terms of platform as a product: other engineers are your customers\n\n - You simplify complexity with clear abstractions and long-term ownership\n\n - You are collaborative, humble, and motivated by enabling others\n\n - You leverage AI to redefine our roles and unlock scalability\n\n - Healthcare technology excites you\n\n - You are fluent in English (no French required)\n\n\n🌍 HOW WE WORK\n\n - Location: You must be legally eligible to work in France, Belgium, or Spain.\n\n - Remote work: We offer remote work flexibility, but we value in-person collaboration\n\n\n🎯 IMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.\n\nIf you're excited about this opportunity but don't check every box, we'd love to hear from you. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.\n\nIf you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?\n\nRemember, this is just a guide, not a checklist.\n\nWe'll be thrilled to receive your application!\n\n🔖 Check out our About Alan https://alan.com/about and Career https://alan.com/careers pages, as well as our Medium https://medium.com/alan, blog https://blog.alan.com/ and Glassdoor page https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm for more info.\n\n\nYOU WANT TO KNOW MORE ABOUT ALAN?\n\n - 🙌 Perks & Benefits https://alan.com/en/careers/a/salary-equity: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\n - 🤘 A strong culture https://alan.com/en/about/a/leadership-principles: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work\n\n🔄 A quick note about the process\nNote: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link."},"descriptionClosing":null},"shortDescription":null,"applicationFormDefinitionId":"6c82d3c4-891c-4693-875f-c89df81d9a0a","surveyFormDefinitionIds":[],"linkedData":{"@context":"https://schema.org/","@type":"JobPosting","title":"Fullstack Software Engineer (x/f/m) - Product Platform","description":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thous ilders across Alan.</p></li><li><p style=\"min-height:1.5em\">You’ll shape reusable building blocks that make it faster and safer to launch products across multiple countries.</p></li><li><p style=\"min-height:1.5em\">By improving adoption of our services, you’ll directly improve product velocity, consistency, and member experience.</p></li></ul><p style=\"min-height:1.5em\"></p><h2>⚡ Why this role is special</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>High Leverage: </strong>Your work is multiplied across the entire company — adoption &amp; reliability is our main KPIs.</p></li><li><p style=\"min-height:1.5em\"><strong>Complex Problems:</strong> Multi-country services, abstraction design, and adoption challenges.</p></li><li><p style=\"min-height:1.5em\"><strong>Platform Mindset:</strong> You’ll build services like a product, with product teams as your customers.</p></li><li><p style=\"min-height:1.5em\"><strong>Ownership:</strong> You’ll influence product direction, mentor engineers, and shape Alan’s internal platform for years to come.</p></li></ul><p style=\"min-height:1.5em\">You’ll work closely with product crews across all Alan areas, as well as with our<strong> Architecture Group</strong> and <strong>Tech Foundation Area</strong>, making sure our systems scale globally and align with long-term technical strategy</p><p style=\"min-height:1.5em\"></p><h1>🛠️ The Stack</h1><p style=\"min-height:1.5em\">Python/Flask, React, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.</p><p style=\"min-height:1.5em\"></p><h1>🔍 What we’re looking for</h1><p style=\"min-height:1.5em\"><strong>Experience we value</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">3+ years in backend, platform, or infrastructure-oriented engineering roles</p></li><li><p style=\"min-height:1.5em\">Experience designing and maintaining internal services, APIs, or SDKs</p></li><li><p style=\"min-height:1.5em\">You love turning complex problems into elegant solutions</p></li><li><p style=\"min-height:1.5em\">You care about the \"why\" behind what you build, not just the \"how\"</p></li></ul><h2>Mindset we value</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You think in terms of platform as a product: other engineers are your customers</p></li><li><p style=\"min-height:1.5em\">You simplify complexity with clear abstractions and long-term ownership</p></li><li><p style=\"min-height:1.5em\">You are collaborative, humble, and motivated by enabling others</p></li><li><p style=\"min-height:1.5em\">You leverage AI to redefine our roles and unlock scalability</p></li><li><p style=\"min-height:1.5em\">Healthcare technology excites you</p></li><li><p style=\"min-height:1.5em\">You are fluent in English (no French required)</p></li></ul><p style=\"min-height:1.5em\"></p><h1>🌍 How we work</h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Location</strong>: You must be legally eligible to work in France, Belgium, or Spain.</p></li><li><p style=\"min-height:1.5em\"><strong>Remote work:</strong> We offer remote work flexibility, but we value in-person collaboration</p></li></ul><p style=\"min-height:1.5em\"></p><h1>🎯 Important note: we hire people, not roles.</h1><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you</strong>. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist. </strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our
