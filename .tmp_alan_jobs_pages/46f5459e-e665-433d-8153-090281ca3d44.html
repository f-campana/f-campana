  <meta name="description" content="YOU. BETTER. WITH ALAN.

Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.

Our mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.

By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.

We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.


HOW WE WORK: OUR LEADERSHIP PRINCIPLES

 - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission&#39;s success above all else.

 - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.

 - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.

 - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.


🐼 WHO WE ARE

You. Better. With Alan.

Alan&#39;s vision is to make prevention the new norm of care for all. Our mission is to help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost center into their most valuable investment.

We&#39;re building a vertically integrated health partner that seamlessly unites insurance and smart healthcare delivery into one system.

By connecting all aspects of care - private, public, and direct to consumer - we create the most member-centric healthcare experience. Through deep engagement, we empower everyone to overcome day-to-day health obstacles and live healthier lives.

We partner with 35K+ companies of all sizes, serving more than 1M+ members, and have reached 770M+ in ARR.

Our team of 700 people (still growing) operates across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦.


🚀 WHAT YOU&#39;LL BUILD AND WHO YOU&#39;LL WORK WITH

You would join the “Support Area”, in charge of building smart products offering the most delightful and scalable Customer Service to 1M+ members across France, Spain, Belgium and Canada.


We have developed a team of AI agents that brings immediate and personalized answers to about 50% of member&#39;s questions. And when that’s not enough, we seamlessly transfer member requests to our Care experts, who leverage our smart support tooling, a suite of context-aware and AI-powered tools, to answer the request in the most productive and delightful way. If you want to know more, check out this blog post https://medium.com/alan/inside-alans-claim-agent-how-an-ai-investigates-claims-just-like-a-human-only-faster-11d62bd7efc9 and this post https://www.le-ticket.fr/comment-alan-reussit-a-automatiser-40-de-son-support-client-grace-a-lia/148723/.

We are extending our outstanding conversational experience to new geographies as well as to new modalities (such as voice support).


⭐ IS IT YOU WE’RE LOOKING FOR?

We’re looking for Product engineers with at least 3+ years of experience who get excited about building state-of-the-art AI systems and applying them to real-world, high-stakes problems in healthcare.

 - You’ll implement new conversational experiences, working across engineering, data, and insurance expertise

 - You’ll work on making our systems and product scale, going from the support of 1M+ members to 10M+ members.

 - You’ll have significant influence on system architecture and code quality

 - You’ll mentor engineers, contribute to our product &amp; engineering culture, and help build the team (including participating in hiring, shaping our interview loops, etc.).

You would be a good fit at Alan if most of this sounds like you:

 - Strong background in software engineering, systems architecture, with a spike in back-end engineering.

 - Experience with traditional ML, or LLMs, or voice AI systems is a big plus

 - Product-minded: you want your solutions to be used, impactful and member-centric

 - Self-directed and pragmatic

 - Humble and still willing to grow (no matter your seniority!)

 - Collaborative, enthusiastic about teamwork, learning, and teaching

 - Fluent in English (no need to speak French!)

But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.


⭐ THE ENGINEERING TEAM ⭐

In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!

Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.

We move fast, with a lot of ownership, and are proud to tackle big problems!

Our process is very simple: those who make product decisions are the same ones who build them.

Our stack is React, Python/Flask, PostgreSQL in a monorepo. If you are not familiar with this stack but are a keen learner, it is totally fine. We deploy daily and believe in distributed ownership - you build it, you own it.

Want to know more? Read this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan if you want to discover how life as an Engineer at Alan and this article https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c on our Engineering career path.


🌍 HOW WE WORK

Location: You must be legally eligible to work in France, Belgium or Spain.

Remote work: We offer remote work flexibility, but we value in-person collaboration.

Check here https://alan.com/en/careers/a/everyday-life for more information about our everyday life!


🎯 IMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.

If you&#39;re excited about this opportunity but don&#39;t check every box, we&#39;d love to hear from you. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.

If you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?

Remember, this is just a guide, not a checklist. We&#39;ll be thrilled to receive your application!

🔖 Check out our About Alan and Career pages, as well as our Medium, blog and Glassdoor pages for more info.


YOU WANT TO KNOW MORE ABOUT ALAN?

 - 🙌 Perks &amp; Benefits https://alan.com/en/careers/a/salary-equity: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.

 - 🤘 A strong culture https://alan.com/en/about/a/leadership-principles: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work

🔄 A quick note about the process
Note: While you&#39;re applying for a specific area,, you may join a different engineering team based on where we think you&#39;ll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link." />

3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b6f2a2f2-490b-4305-84f3-0f986d70ef14.png","logoSquareImageUrl":"https://app.ashbyhq.com/api/images/org-theme-logo/16fb5c4f-12a4-4e77-a698-3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b8987509-72b3-449b-8d58-1af70771e1e8.png","applicationSubmittedSuccessMessage":"Your application was successfully submitted. We'll contact shortly. Thank you!","jobBoardTopDescriptionHtml":"<p style=\"min-height:1.5em\"><strong>You. Better. With Alan. </strong><br /><br />Alan's vision is to make <strong>prevention the new norm</strong> of care for all.<br />‭<br />Alan's mission is to <strong>help people live in good health to 100</strong> while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p>","jobBoardBottomDescriptionHtml":"<h2><strong>Important note: we hire people, not roles.</strong></h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you.</strong> Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p>","jobPostingBackUrl":null},"appConfirmationTrackingPixelHtml":null,"recruitingPrivacyPolicyUrl":"https://alan.com/candidate-privacy","timezone":"Europe/Paris","candidateScheduleCancellationReasonRequirementStatus":"Off"},"posting":{"id":"46f5459e-e665-433d-8153-090281ca3d44","title":"Fullstack Software Engineer (x/f/m) - AI Customer Support ","updatedAt":"2026-02-13T09:53:13.561Z","departmentName":"Engineering","departmentExternalName":"Engineering","teamName":"Engineering","teamExternalName":"Engineering","teamNames":["Engineering"],"locationName":"Anywhere in France, Belgium, Spain","locationExternalName":"Anywhere in France, Belgium, Spain","isListed":true,"suppressDescriptionOpening":false,"suppressDescriptionClosing":false,"descriptionHtml":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul><h1><strong>🐼 Who we are</strong></h1><p style=\"min-height:1.5em\"><strong>You. Better. With Alan.</strong></p><p style=\"min-height:1.5em\">Alan's vision is to make prevention the new norm of care for all. <strong>Our mission is to help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost center into their most valuable investment.</strong></p><p style=\"min-height:1.5em\">We're building a <strong>vertically integrated health partner</strong> that seamlessly unites insurance and smart healthcare delivery into one system.</p><p style=\"min-height:1.5em\">By connecting all aspects of care - private, public, and direct to consumer - <strong>we create the most member-centric healthcare experience.</strong> Through deep engagement, we empower everyone to overcome day-to-day health obstacles and live healthier lives.</p><p style=\"min-height:1.5em\">We partner with <strong>35K+ companies</strong> of all sizes, serving more than <strong>1M+ members</strong>, and have reached <strong>770M+</strong> in ARR.</p><p style=\"min-height:1.5em\">Our team of <strong>700 people</strong> (still growing) operates across <strong>France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦.</strong></p><p style=\"min-height:1.5em\"></p><h1><strong>🚀 What you'll build and who you'll work with</strong></h1><p style=\"min-height:1.5em\">You would join the <strong>“Support Area”</strong>, in charge of building smart products offering the most delightful and scalable Customer Service to 1M+ members across France, Spain, Belgium and Canada.</p><p style=\"min-height:1.5em\"><br />We have developed <strong>a team of AI agents </strong>that brings immediate and personalized answers to about 50% of member's questions. And when that’s not enough, we seamlessly transfer member requests to our Care experts, who leverage<strong> </strong>our <strong>smart support tooling</strong>, a suite of context-aware and AI-powered tools, to answer the request in the most productive and delightful way. If you want to know more, check out <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/inside-alans-claim-agent-how-an-ai-investigates-claims-just-like-a-human-only-faster-11d62bd7efc9\"><u>this blog post</u></a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.le-ticket.fr/comment-alan-reussit-a-automatiser-40-de-son-support-client-grace-a-lia/148723/\"><u>this post</u></a>.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">We are extending our outstanding conversational experience to <strong>new geographies</strong> as well as to <strong>new modalities</strong> (such as voice support).</p><p style=\"min-height:1.5em\"></p><h1><strong>⭐ Is it you we’re looking for?</strong></h1><p style=\"min-height:1.5em\">We’re looking for <strong>Product engineers</strong> with at least <strong>3+ years of experience</strong> who get excited about building state-of-the-art AI systems and applying them to <strong>real-world, high-stakes problems in healthcare</strong>.</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You’ll implement new conversational experiences, working across engineering, data, and insurance expertise</p></li><li><p style=\"min-height:1.5em\">You’ll work on making our systems and product scale, going from the support of 1M+ members to 10M+ members.</p></li><li><p style=\"min-height:1.5em\">You’ll have significant influence on system architecture and code quality</p></li><li><p style=\"min-height:1.5em\">You’ll mentor engineers, contribute to our product &amp; engineering culture, and help build the team (including participating in hiring, shaping our interview loops, etc.).</p></li></ul><p style=\"min-height:1.5em\"><strong>You would be a good fit at Alan if most of this sounds like you:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Strong background in software engineering, systems architecture, with a spike in back-end engineering.</p></li><li><p style=\"min-height:1.5em\">Experience with traditional ML, or LLMs, or voice AI systems is a big plus</p></li><li><p style=\"min-height:1.5em\">Product-minded: you want your solutions to be used, impactful and member-centric</p></li><li><p style=\"min-height:1.5em\">Self-directed and pragmatic</p></li><li><p style=\"min-height:1.5em\">Humble and still willing to grow (no matter your seniority!)</p></li><li><p style=\"min-height:1.5em\">Collaborative, enthusiastic about teamwork, learning, and teaching</p></li><li><p style=\"min-height:1.5em\">Fluent in English (no need to speak French!)</p></li></ul><p style=\"min-height:1.5em\">But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.</p><p style=\"min-height:1.5em\"></p><h1><strong>⭐ The Engineering team ⭐</strong></h1><p style=\"min-height:1.5em\">In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!</p><p style=\"min-height:1.5em\">Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.</p><p style=\"min-height:1.5em\">We move fast, with a lot of ownership, and are proud to tackle big problems!</p><p style=\"min-height:1.5em\">Our process is very simple: those who make product decisions are the same ones who build them.</p><p style=\"min-height:1.5em\">Our stack is React, Python/Flask, PostgreSQL in a monorepo. If you are not familiar with this stack but are a keen learner, it is totally fine. We deploy daily and believe in distributed ownership - you build it, you own it.</p><p style=\"min-height:1.5em\">Want to know more? Read<a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\"> <u>this article</u></a> if you want to discover how life as an Engineer at Alan and<a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c\"> <u>this article</u></a> on our Engineering career path.</p><p style=\"min-height:1.5em\"></p><h1><strong>🌍 How we work</strong></h1><p style=\"min-height:1.5em\"><strong>Location</strong>: You must be legally eligible to work in France, Belgium or Spain.</p><p style=\"min-height:1.5em\"><strong>Remote</strong> <strong>work</strong>: We offer remote work flexibility, but we value in-person collaboration.</p><p style=\"min-height:1.5em\"><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/everyday-life\"><u>Check here</u></a> for more information about our everyday life!</p><p style=\"min-height:1.5em\"></p><h1><strong>🎯 Important note: we hire people, not roles.</strong></h1><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you</strong>. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist. </strong>We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our About Alan and Career pages, as well as our Medium, blog and Glassdoor pages for more info.</p><p style=\"min-height:1.5em\"></p><h2><strong>You want to know more about Alan?</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">🙌<a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/salary-equity\"> <u>Perks &amp; Benefits</u></a>: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.</p></li><li><p style=\"min-height:1.5em\">🤘<a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/about/a/leadership-principles\"> <u>A strong culture</u></a>: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work</p></li></ul><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process<br /></strong><em>Note: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas</em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link\"><em> <u>here</u></em></a><em>.</em></p><p style=\"min-height:1.5em\"></p>","descriptionPlainText":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.\n\n\n🐼 WHO WE ARE\n\nYou. Better. With Alan.\n\nAlan's vision is to make prevention the new norm of care for all. Our mission is to help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost center into their most valuable investment.\n\nWe're building a vertically integrated health partner that seamlessly unites insurance and smart healthcare delivery into one system.\n\nBy connecting all aspects of care - private, public, and direct to consumer - we create the most member-centric healthcare experience. Through deep engagement, we empower everyone to overcome day-to-day health obstacles and live healthier lives.\n\nWe partner with 35K+ companies of all sizes, serving more than 1M+ members, and have reached 770M+ in ARR.\n\nOur team of 700 people (still growing) operates across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦.\n\n\n🚀 WHAT YOU'LL BUILD AND WHO YOU'LL WORK WITH\n\nYou would join the “Support Area”, in charge of building smart products offering the most delightful and scalable Customer Service to 1M+ members across France, Spain, Belgium and Canada.\n\n\nWe have developed a team of AI agents that brings immediate and personalized answers to about 50% of member's questions. And when that’s not enough, we seamlessly transfer member requests to our Care experts, who leverage our smart support tooling, a suite of context-aware and AI-powered tools, to answer the request in the most productive and delightful way. If you want to know more, check out this blog post https://medium.com/alan/inside-alans-claim-agent-how-an-ai-investigates-claims-just-like-a-human-only-faster-11d62bd7efc9 and this post https://www.le-ticket.fr/comment-alan-reussit-a-automatiser-40-de-son-support-client-grace-a-lia/148723/.\n\nWe are extending our outstanding conversational experience to new geographies as well as to new modalities (such as voice support).\n\n\n⭐ IS IT YOU WE’RE LOOKING FOR?\n\nWe’re looking for Product engineers with at least 3+ years of experience who get excited about building state-of-the-art AI systems and applying them to real-world, high-stakes problems in healthcare.\n\n - You’ll implement new conversational experiences, working across engineering, data, and insurance expertise\n\n - You’ll work on making our systems and product scale, going from the support of 1M+ members to 10M+ members.\n\n - You’ll have significant influence on system architecture and code quality\n\n - You’ll mentor engineers, contribute to our product & engineering culture, and help build the team (including participating in hiring, shaping our interview loops, etc.).\n\nYou would be a good fit at Alan if most of this sounds like you:\n\n - Strong background in software engineering, systems architecture, with a spike in back-end engineering.\n\n - Experience with traditional ML, or LLMs, or voice AI systems is a big plus\n\n - Product-minded: you want your solutions to be used, impactful and member-centric\n\n - Self-directed and pragmatic\n\n - Humble and still willing to grow (no matter your seniority!)\n\n - Collaborative, enthusiastic about teamwork, learning, and teaching\n\n - Fluent in English (no need to speak French!)\n\nBut above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.\n\n\n⭐ THE ENGINEERING TEAM ⭐\n\nIn our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!\n\nBeing an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.\n\nWe move fast, with a lot of ownership, and are proud to tackle big problems!\n\nOur process is very simple: those who make product decisions are the same ones who build them.\n\nOur stack is React, Python/Flask, PostgreSQL in a monorepo. If you are not familiar with this stack but are a keen learner, it is totally fine. We deploy daily and believe in distributed ownership - you build it, you own it.\n\nWant to know more? Read this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan if you want to discover how life as an Engineer at Alan and this article https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c on our Engineering career path.\n\n\n🌍 HOW WE WORK\n\nLocation: You must be legally eligible to work in France, Belgium or Spain.\n\nRemote work: We offer remote work flexibility, but we value in-person collaboration.\n\nCheck here https://alan.com/en/careers/a/everyday-life for more information about our everyday life!\n\n\n🎯 IMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.\n\nIf you're excited about this opportunity but don't check every box, we'd love to hear from you. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.\n\nIf you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?\n\nRemember, this is just a guide, not a checklist. We'll be thrilled to receive your application!\n\n🔖 Check out our About Alan and Career pages, as well as our Medium, blog and Glassdoor pages for more info.\n\n\nYOU WANT TO KNOW MORE ABOUT ALAN?\n\n - 🙌 Perks & Benefits https://alan.com/en/careers/a/salary-equity: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\n - 🤘 A strong culture https://alan.com/en/about/a/leadership-principles: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work\n\n🔄 A quick note about the process\nNote: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link.","descriptionParts":{"descriptionOpening":{"html":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul>","plain":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership."},"descriptionBody":{"html":"<h1><strong>🐼 Who we are</strong></h1><p style=\"min-height:1.5em\"><strong>You. Better. With Alan.</strong></p><p style=\"min-height:1.5em\">Alan's vision is to make prevention the new norm of care for all. <strong>Our mission is to help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost center into their most valuable investment.</strong></p><p style=\"min-height:1.5em\">We're building a <strong>vertically integrated health partner</strong> that seamlessly unites insurance and smart healthcare delivery into one system.</p><p style=\"min-height:1.5em\">By connecting all aspects of care - private, public, and direct to consumer - <strong>we create the most member-centric healthcare experience.</strong> Through deep engagement, we empower everyone to overcome day-to-day health obstacles and live healthier lives.</p><p style=\"min-height:1.5em\">We partner with <strong>35K+ companies</strong> of all sizes, serving more than <strong>1M+ members</strong>, and have reached <strong>770M+</strong> in ARR.</p><p style=\"min-height:1.5em\">Our team of <strong>700 people</strong> (still growing) operates across <strong>France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦.</strong></p><p style=\"min-height:1.5em\"></p><h1><strong>🚀 What you'll build and who you'll work with</strong></h1><p style=\"min-height:1.5em\">You would join the <strong>“Support Area”</strong>, in charge of building smart products offering the most delightful and scalable Customer Service to 1M+ members across France, Spain, Belgium and Canada.</p><p style=\"min-height:1.5em\"><br />We have developed <strong>a team of AI agents </strong>that brings immediate and personalized answers to about 50% of member's questions. And when that’s not enough, we seamlessly transfer member requests to our Care experts, who leverage<strong> </strong>our <strong>smart support tooling</strong>, a suite of context-aware and AI-powered tools, to answer the request in the most productive and delightful way. If you want to know more, check out <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/inside-alans-claim-agent-how-an-ai-investigates-claims-just-like-a-human-only-faster-11d62bd7efc9\"><u>this blog post</u></a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.le-ticket.fr/comment-alan-reussit-a-automatiser-40-de-son-support-client-grace-a-lia/148723/\"><u>this post</u></a>.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">We are extending our outstanding conversational experience to <strong>new geographies</strong> as well as to <strong>new modalities</strong> (such as voice support).</p><p style=\"min-height:1.5em\"></p><h1><strong>⭐ Is it you we’re looking for?</strong></h1><p style=\"min-height:1.5em\">We’re looking for <strong>Product engineers</strong> with at least <strong>3+ years of experience</strong> who get excited about building state-of-the-art AI systems and applying them to <strong>real-world, high-stakes problems in healthcare</strong>.</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You’ll implement new conversational experiences, working across engineering, data, and insurance expertise</p></li><li><p style=\"min-height:1.5em\">You’ll work on making our systems and product scale, going from the support of 1M+ members to 10M+ members.</p></li><li><p style=\"min-height:1.5em\">You’ll have significant influence on system architecture and code quality</p></li><li><p style=\"min-height:1.5em\">You’ll mentor engineers, contribute to our product &amp; engineering culture, and help build the team (including participating in hiring, shaping our interview loops, etc.).</p></li></ul><p style=\"min-height:1.5em\"><strong>You would be a good fit at Alan if most of this sounds like you:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Strong background in software engineering, systems architecture, with a spike in back-end engineering.</p></li><li><p style=\"min-height:1.5em\">Experience with traditional ML, or LLMs, or voice AI systems is a big plus</p></li><li><p style=\"min-height:1.5em\">Product-minded: you want your solutions to be used, impactful and member-centric</p></li><li><p style=\"min-height:1.5em\">Self-directed and pragmatic</p></li><li><p style=\"min-height:1.5em\">Humble and still willing to grow (no matter your seniority!)</p></li><li><p style=\"min-height:1.5em\">Collaborative, enthusiastic about teamwork, learning, and teaching</p></li><li><p style=\"min-height:1.5em\">Fluent in English (no need to speak French!)</p></li></ul><p style=\"min-height:1.5em\">But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.</p><p style=\"min-height:1.5em\"></p><h1><strong>⭐ The Engineering team ⭐</strong></h1><p style=\"min-height:1.5em\">In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!</p><p style=\"min-height:1.5em\">Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.</p><p style=\"min-height:1.5em\">We move fast, with a lot of ownership, and are proud to tackle big problems!</p><p style=\"min-height:1.5em\">Our process is very simple: those who make product decisions are the same ones who build them.</p><p style=\"min-height:1.5em\">Our stack is React, Python/Flask, PostgreSQL in a monorepo. If you are not familiar with this stack but are a keen learner, it is totally fine. We deploy daily and believe in distributed ownership - you build it, you own it.</p><p style=\"min-height:1.5em\">Want to know more? Read<a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\"> <u>this article</u></a> if you want to discover how life as an Engineer at Alan and<a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c\"> <u>this article</u></a> on our Engineering career path.</p><p style=\"min-height:1.5em\"></p><h1><strong>🌍 How we work</strong></h1><p style=\"min-height:1.5em\"><strong>Location</strong>: You must be legally eligible to work in France, Belgium or Spain.</p><p style=\"min-height:1.5em\"><strong>Remote</strong> <strong>work</strong>: We offer remote work flexibility, but we value in-person collaboration.</p><p style=\"min-height:1.5em\"><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/everyday-life\"><u>Check here</u></a> for more information about our everyday life!</p><p style=\"min-height:1.5em\"></p><h1><strong>🎯 Important note: we hire people, not roles.</strong></h1><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you</strong>. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist. </strong>We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our About Alan and Career pages, as well as our Medium, blog and Glassdoor pages for more info.</p><p style=\"min-height:1.5em\"></p><h2><strong>You want to know more about Alan?</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">🙌<a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/salary-equity\"> <u>Perks &amp; Benefits</u></a>: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.</p></li><li><p style=\"min-height:1.5em\">🤘<a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/about/a/leadership-principles\"> <u>A strong culture</u></a>: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work</p></li></ul><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process<br /></strong><em>Note: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas</em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link\"><em> <u>here</u></em></a><em>.</em></p><p style=\"min-height:1.5em\"></p>","plain":"🐼 WHO WE ARE\n\nYou. Better. With Alan.\n\nAlan's vision is to make prevention the new norm of care for all. Our mission is to help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost center into their most valuable investment.\n\nWe're building a vertically integrated health partner that seamlessly unites insurance and smart healthcare delivery into one system.\n\nBy connecting all aspects of care - private, public, and direct to consumer - we create the most member-centric healthcare experience. Through deep engagement, we empower everyone to overcome day-to-day health obstacles and live healthier lives.\n\nWe partner with 35K+ companies of all sizes, serving more than 1M+ members, and have reached 770M+ in ARR.\n\nOur team of 700 people (still growing) operates across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦.\n\n\n🚀 WHAT YOU'LL BUILD AND WHO YOU'LL WORK WITH\n\nYou would join the “Support Area”, in charge of building smart products offering the most delightful and scalable Customer Service to 1M+ members across France, Spain, Belgium and Canada.\n\n\nWe have developed a team of AI agents that brings immediate and personalized answers to about 50% of member's questions. And when that’s not enough, we seamlessly transfer member requests to our Care experts, who leverage our smart support tooling, a suite of context-aware and AI-powered tools, to answer the request in the most productive and delightful way. If you want to know more, check out this blog post https://medium.com/alan/inside-alans-claim-agent-how-an-ai-investigates-claims-just-like-a-human-only-faster-11d62bd7efc9 and this post https://www.le-ticket.fr/comment-alan-reussit-a-automatiser-40-de-son-support-client-grace-a-lia/148723/.\n\nWe are extending our outstanding conversational experience to new geographies as well as to new modalities (such as voice support).\n\n\n⭐ IS IT YOU WE’RE LOOKING FOR?\n\nWe’re looking for Product engineers with at least 3+ years of experience who get excited about building state-of-the-art AI systems and applying them to real-world, high-stakes problems in healthcare.\n\n - You’ll implement new conversational experiences, working across engineering, data, and insurance expertise\n\n - You’ll work on making our systems and product scale, going from the support of 1M+ members to 10M+ members.\n\n - You’ll have significant influence on system architecture and code quality\n\n - You’ll mentor engineers, contribute to our product & engineering culture, and help build the team (including participating in hiring, shaping our interview loops, etc.).\n\nYou would be a good fit at Alan if most of this sounds like you:\n\n - Strong background in software engineering, systems architecture, with a spike in back-end engineering.\n\n - Experience with traditional ML, or LLMs, or voice AI systems is a big plus\n\n - Product-minded: you want your solutions to be used, impactful and member-centric\n\n - Self-directed and pragmatic\n\n - Humble and still willing to grow (no matter your seniority!)\n\n - Collaborative, enthusiastic about teamwork, learning, and teaching\n\n - Fluent in English (no need to speak French!)\n\nBut above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.\n\n\n⭐ THE ENGINEERING TEAM ⭐\n\nIn our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!\n\nBeing an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.\n\nWe move fast, with a lot of ownership, and are proud to tackle big problems!\n\nOur process is very simple: those who make product decisions are the same ones who build them.\n\nOur stack is React, Python/Flask, PostgreSQL in a monorepo. If you are not familiar with this stack but are a keen learner, it is totally fine. We deploy daily and believe in distributed ownership - you build it, you own it.\n\nWant to know more? Read this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan if you want to discover how life as an Engineer at Alan and this article https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c on our Engineering career path.\n\n\n🌍 HOW WE WORK\n\nLocation: You must be legally eligible to work in France, Belgium or Spain.\n\nRemote work: We offer remote work flexibility, but we value in-person collaboration.\n\nCheck here https://alan.com/en/careers/a/everyday-life for more information about our everyday life!\n\n\n🎯 IMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.\n\nIf you're excited about this opportunity but don't check every box, we'd love to hear from you. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.\n\nIf you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?\n\nRemember, this is just a guide, not a checklist. We'll be thrilled to receive your application!\n\n🔖 Check out our About Alan and Career pages, as well as our Medium, blog and Glassdoor pages for more info.\n\n\nYOU WANT TO KNOW MORE ABOUT ALAN?\n\n - 🙌 Perks & Benefits https://alan.com/en/careers/a/salary-equity: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\n - 🤘 A strong culture https://alan.com/en/about/a/leadership-principles: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work\n\n🔄 A quick note about the process\nNote: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link."},"descriptionClosing":null},"shortDescription":null,"applicationFormDefinitionId":"203db919-f16d-4569-8832-0c6baa8cb263","surveyFormDefinitionIds":[],"linkedData":{"@context":"https://schema.org/","@type":"JobPosting","title":"Fullstack Software Engineer (x/f/m) - AI Customer Support ","description":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul><h1><strong>🐼 Who we are</strong></h1><p style=\"min-height:1.5em\"><strong>You. Better. With Alan.</strong></p><p style=\"min-height:1.5em\">Alan's vision is to make prevention the new norm of care for all. <strong>Our mission is to help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost center into their most valuable investment.</strong></p><p style=\"min-height:1.5em\">We're building a <strong>vertically integrated health partner</strong> that seamlessly unites insurance and smart healthcare delivery into one system.</p><p style=\"min-height:1.5em\">By connecting all aspects of care - private, public, and direct to consumer - <strong>we create the most member-centric healthcare experience.</strong> Through deep engagement, we empower everyone to overcome day-to-day health obstacles and live healthier lives.</p><p style=\"min-height:1.5em\">We partner with <strong>35K+ companies</strong> of all sizes, serving more than <strong>1M+ members</strong>, and have reached <strong>770M+</strong> in ARR.</p><p style=\"min-height:1.5em\">Our team of <strong>700 people</strong> (still growing) operates across <strong>France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦.</strong></p><p style=\"min-height:1.5em\"></p><h1><strong>🚀 What you'll build and who you'll work with</strong></h1><p style=\"min-height:1.5em\">You would join the <strong>“Support Area”</strong>, in charge of building smart products offering the most delightful and scalable Customer Service to 1M+ members across France, Spain, Belgium and Canada.</p><p style=\"min-height:1.5em\"><br />We have developed <strong>a team of AI agents </strong>that brings immediate and personalized answers to about 50% of member's questions. And when that’s not enough, we seamlessly transfer member requests to our Care experts, who leverage<strong> </strong>our <strong>smart support tooling</strong>, a suite of context-aware and AI-powered tools, to answer the request in the most productive and delightful way. If you want to know more, check out <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/inside-alans-claim-agent-how-an-ai-investigates-claims-just-like-a-human-only-faster-11d62bd7efc9\"><u>this blog post</u></a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.le-ticket.fr/comment-alan-reussit-a-automatiser-40-de-son-support-client-grace-a-lia/148723/\"><u>this post</u></a>.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">We are extending our outstanding conversational experience to <strong>new geographies</strong> as well as to <strong>new modalities</strong> (such as voice support).</p><p style=\"min-height:1.5em\"></p><h1><strong>⭐ Is it you we’re looking for?</strong></h1><p style=\"min-height:1.5em\">We’re looking for <strong>Product engineers</strong> with at least <strong>3+ years of experience</strong> who get excited about building state-of-the-art AI systems and applying them to <strong>real-world, high-stakes problems in healthcare</strong>.</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You’ll implement new conversational experiences, working across engineering, data, and insurance expertise</p></li><li><p style=\"min-height:1.5em\">You’ll work on making our systems and product scale, going from the support of 1M+ members to 10M+ members.</p></li><li><p style=\"min-height:1.5em\">You’ll have significant influence on system architecture and code quality</p></li><li><p style=\"min-height:1.5em\">You’ll mentor engineers, contribute to our product &amp; engineering culture, and help build the team (including participating in hiring, shaping our interview loops, etc.).</p></li></ul><p style=\"min-height:1.5em\"><strong>You would be a good fit at Alan if most of this sounds like you:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Strong background in software engineering, systems architecture, with a spike in back-end engineering.</p></li><li><p style=\"min-height:1.5em\">Experience with traditional ML, or LLMs, or voice AI systems is a big plus</p></li><li><p style=\"min-height:1.5em\">Product-minded: you want your solutions to be used, impactful and member-centric</p></li><li><p style=\"min-height:1.5em\">Self-directed and pragmatic</p></li><li><p style=\"min-height:1.5em\">Humble and still willing to grow (no matter your seniority!)</p></li><li><p style=\"min-height:1.5em\">Collaborative, enthusiastic about teamwork, learning, and teaching</p></li><li><p style=\"min-height:1.5em\">Fluent in English (no need to speak French!)</p></li></ul><p style=\"min-height:1.5em\">But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.</p><p style=\"min-height:1.5em\"></p><h1><strong>⭐ The Engineering team ⭐</strong></h1><p style=\"min-height:1.5em\">In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!</p><p style=\"min-height:1.5em\">Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.</p><p style=\"min-height:1.5em\">We move fast, with a lot of ownership, and are proud to tackle big problems!</p><p style=\"min-height:1.5em\">Our process is very simple: those who make product decisions are the same ones who build them.</p><p style=\"min-height:1.5em\">Our stack is React, Python/Flask, PostgreSQL in a monorepo. If you are not familiar with this stack but are a keen learner, it is totally fine. We deploy daily and believe in distributed ownership - you build it, you own it.</p><p style=\"min-height:1.5em\">Want to know more? Read<a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\"> <u>this article</u></a> if you want to discover how life as an Engineer at Alan and<a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c\"> <u>this article</u></a> on our Engineering career path.</p><p style=\"min-height:1.5em\"></p><h1><strong>🌍 How we work</strong></h1><p style=\"min-height:1.5em\"><strong>Location</strong>: You must be legally eligible to work in France, Belgium or Spain.</p><p style=\"min-height:1.5em\"><strong>Remote</strong> <strong>work</strong>: We offer remote work flexibility, but we value in-person collaboration.</p><p style=\"min-height:1.5em\"><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/everyday-life\"><u>Check here</u></a> for more information about our everyday life!</p><p s
