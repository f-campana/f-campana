  <meta name="description" content="YOU. BETTER. WITH ALAN.

Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.

Our mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.

By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.

We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.


HOW WE WORK: OUR LEADERSHIP PRINCIPLES

 - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission&#39;s success above all else.

 - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.

 - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.

 - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.


⭐ THE ENGINEERING TEAM ⭐

In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!

Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.

We move fast, with a lot of ownership, and are proud to tackle big problems!

Our process is very simple: those who make product decisions are the same ones who build them.

Our stack is Python/Flask, React, React Native, PostgreSQL.

Want to know more? Read this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan if you want to discover how life as an Engineer at Alan and this article https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c on our Engineering career path.


🤖 THE TECH FOUNDATIONS AREA

🎯 Mission: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.

🔭 Scope:

 1. Infrastructure enablement for product crews (e.g. hosting improvements https://www.qovery.com/case-study/alan-case-study/, CI/CD https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733, scalability, multi-cloud architecture)

 2. Security and compliance facilitation (e.g. authentication, encryption, threat protection)

 3. Developer productivity enhancements (e.g. local environment setup https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c, monorepo tooling https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc, observability, tech stack evolution)

 4. Design and development unification (e.g. design system https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d, accessibility)

 5. AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)

👀 Focus for 2026:

In 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.

🔄 A quick note about the process:

While you’re applying for a particular area, please note that you may ultimately join a different part of our engineering organization, depending on where we believe you will have the most impact.


⭐ IS IT YOU WE’RE LOOKING FOR?

We are looking for Platform Engineers with 3+ years of experience to help us maintain high reliability while scaling our infrastructure:

 - You’ll be able to tackle high-impact &amp; high-risk projects involving many engineers.

 - You&#39;ll design and implement robust infrastructure systems with a focus on reliability and observability.

 - You&#39;ll maintain our uptime targets while optimizing infrastructure costs.

 - You&#39;ll improve our incident management processes and lead post-mortems.

 - You&#39;ll build and maintain internal tooling (e.g. API, web interface, internal command line, ...) for other engineers.

 - You’ll have the opportunity to mentor other engineers &amp; lead crews (more details in this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan).

 - You’ll be able to contribute to hiring your future coworkers and shape candidates’ hiring experience (improving our technical assessment process etc...)

You would be a good fit at Alan if most of this sounds like you:

 - You have strong experience with cloud platforms (especially AWS).

 - You have experience with monitoring, alerting, and observability tools.

 - You&#39;re comfortable writing code for automation and tooling (e.g. API, internal command line, ...).

 - You have some experience as a Full-Stack or Backend software engineer

 - Willing to work in Python/JavaScript (but you don’t need to have experience with those 2 languages!).

 - You understand modern deployment practices and CI/CD.

 - You&#39;re able to debug complex system issues.

 - Self-starting and entrepreneurial.

 - Humble and still willing to grow (no matter your seniority!).

 - Collaborative, enthusiastic about teamwork, learning, and teaching.

 - Fluent in English (no need to speak French!).

For this opportunity, we are aiming to hire above C1 level range

But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.


🙌 PERKS &amp; BENEFITS https://alan.com/en/careers/a/salary-equity

At Alan, we believe that being in good health is a basic need, and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.

Therefore, we offer:

 - Fair rewards. Generous equity packages complement your base salary.

 - Flexible Office. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.

 - All the tools you need. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and noise-canceling headphones.

 - Flexible vacation policy and flexible working hours. Organize your time as you wish.

 - Delightful healthcare insurance: Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country (permanent contracts only).

 - Transport. Country-specific commuter benefits.

 - Learning &amp; Training opportunities. A highly flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.

 - Delightful healthcare insurance: Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country (permanent contracts only).

 - Parental leave. Extended parental leave for all new parents.


IMPORTANT NOTE: WE HIRE PEOPLE NOT ROLES.

If you&#39;re excited about this opportunity but don&#39;t check every box, we&#39;d love to hear from you. Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.

If you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?

Remember, this is just a guide, not a checklist.

We&#39;ll be thrilled to receive your application!

🔖 Check out our About Alan https://alan.com/about and Career https://alan.com/careers pages, as well as our Medium https://medium.com/alan, blog https://blog.alan.com/ and Glassdoor page https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm for more info.

onsorship, we want you to live where you’re the happiest.</p></li><li><p style=\"min-height:1.5em\"><strong>All the tools you need</strong>. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and noise-canceling headphones.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible vacation policy and flexible working hours</strong>. Organize your  time as you  wish.</p></li><li><p style=\"min-height:1.5em\"><strong>Delightful healthcare insurance:</strong> Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country<em> (permanent contracts only)</em>.</p></li><li><p style=\"min-height:1.5em\"><strong>Transport</strong>. Country-specific commuter benefits.</p></li><li><p style=\"min-height:1.5em\"><strong>Learning &amp; Training opportunities.</strong> A highly  flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.</p></li><li><p style=\"min-height:1.5em\"><strong>Delightful healthcare insurance:</strong> Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country<em> (permanent contracts only)</em>.</p></li><li><p style=\"min-height:1.5em\"><strong>Parental leave.</strong> Extended parental leave for all new parents.</p></li></ul><p style=\"min-height:1.5em\"></p><h2>Important note: we hire people not roles. </h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you.</strong> Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">  and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p>","jobPostingBackUrl":null},"appConfirmationTrackingPixelHtml":null,"recruitingPrivacyPolicyUrl":"https://alan.com/candidate-privacy","timezone":"Europe/Paris","candidateScheduleCancellationReasonRequirementStatus":"Off"},"posting":{"id":"681b352c-d559-4608-859b-700434c55b74","title":"Platform Engineer (x/f/m) - Tech Foundations","updatedAt":"2026-02-11T14:14:11.940Z","departmentName":"Engineering","departmentExternalName":"Engineering","teamName":"Engineering","teamExternalName":"Engineering","teamNames":["Engineering"],"locationName":"Anywhere in France, Belgium, Spain","locationExternalName":"Anywhere in France, Belgium, Spain","isListed":true,"suppressDescriptionOpening":false,"suppressDescriptionClosing":false,"descriptionHtml":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul><h1>⭐ The Engineering team ⭐ </h1><p style=\"min-height:1.5em\">In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!</p><p style=\"min-height:1.5em\">Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.</p><p style=\"min-height:1.5em\">We move fast, with a lot of ownership, and are proud to tackle big problems!</p><p style=\"min-height:1.5em\">Our process is very simple: those who make product decisions are the same ones who build them.</p><p style=\"min-height:1.5em\">Our stack is Python/Flask, React, React Native, PostgreSQL.</p><p style=\"min-height:1.5em\">Want to know more? Read <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a> if you want to discover how life as an Engineer at Alan and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c\">this article</a> on our Engineering career path.</p><p style=\"min-height:1.5em\"></p><h1>🤖 The Tech Foundations area</h1><p style=\"min-height:1.5em\">🎯 <strong>Mission</strong>: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.</p><p style=\"min-height:1.5em\"><strong>🔭 Scope:</strong></p><ol style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Infrastructure enablement for product crews (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.qovery.com/case-study/alan-case-study/\">hosting improvements</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733\">CI/CD</a>, scalability, multi-cloud architecture)</p></li><li><p style=\"min-height:1.5em\">Security and compliance facilitation (e.g. authentication, encryption, threat protection)</p></li><li><p style=\"min-height:1.5em\">Developer productivity enhancements (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c\">local environment setup</a>, monorepo <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc\">tooling</a>, observability, tech stack evolution)</p></li><li><p style=\"min-height:1.5em\">Design and development unification (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d\">design system</a>, accessibility)</p></li><li><p style=\"min-height:1.5em\">AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)</p></li></ol><p style=\"min-height:1.5em\"><strong>👀 Focus for 2026:</strong></p><p style=\"min-height:1.5em\">In 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process:</strong></p><p style=\"min-height:1.5em\">While you’re applying for a particular area, please note that you may ultimately join a different part of our engineering organization, depending on where we believe you will have the most impact.</p><p style=\"min-height:1.5em\"></p><h1> ⭐ Is it you we’re looking for?</h1><p style=\"min-height:1.5em\">We are looking for Platform Engineers with 3+ years of experience to help us maintain high reliability while scaling our infrastructure:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You’ll be able to tackle high-impact &amp; high-risk projects involving many engineers.</p></li><li><p style=\"min-height:1.5em\">You'll design and implement robust infrastructure systems with a focus on reliability and observability.</p></li><li><p style=\"min-height:1.5em\">You'll maintain our uptime targets while optimizing infrastructure costs.</p></li><li><p style=\"min-height:1.5em\">You'll improve our incident management processes and lead post-mortems.</p></li><li><p style=\"min-height:1.5em\">You'll build and maintain internal tooling  (e.g. API, web interface, internal command line, ...) for other engineers.</p></li><li><p style=\"min-height:1.5em\">You’ll have the opportunity to mentor other engineers &amp; lead crews (more details in <a target=\"_blank\" rel=\"noopener noreferrer\" class=\"postings-link\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a>).</p></li><li><p style=\"min-height:1.5em\">You’ll be able to contribute to hiring your future coworkers and shape candidates’ hiring experience (improving our technical assessment process etc...)</p></li></ul><p style=\"min-height:1.5em\"><strong>You would be a good fit at Alan if most of this sounds like you: </strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You have strong experience with cloud platforms (especially AWS).</p></li><li><p style=\"min-height:1.5em\">You have experience with monitoring, alerting, and observability tools.</p></li><li><p style=\"min-height:1.5em\">You're comfortable writing code for automation and tooling (e.g. API, internal command line, ...).</p></li><li><p style=\"min-height:1.5em\">You have some experience as a Full-Stack or Backend software engineer</p></li><li><p style=\"min-height:1.5em\">Willing to work in Python/JavaScript (but you don’t need to have experience with those 2 languages!).</p></li><li><p style=\"min-height:1.5em\">You understand modern deployment practices and CI/CD.</p></li><li><p style=\"min-height:1.5em\">You're able to debug complex system issues.</p></li><li><p style=\"min-height:1.5em\">Self-starting and entrepreneurial.</p></li><li><p style=\"min-height:1.5em\">Humble and still willing to grow (no matter your seniority!).</p></li><li><p style=\"min-height:1.5em\">Collaborative, enthusiastic about teamwork, learning, and teaching.</p></li><li><p style=\"min-height:1.5em\">Fluent in English (no need to speak French!).</p></li></ul><p style=\"min-height:1.5em\">For this opportunity, we are aiming to hire above C1 level range</p><p style=\"min-height:1.5em\">But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.</p><p style=\"min-height:1.5em\"></p><h1>🙌   <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/salary-equity\">Perks &amp; Benefits</a></h1><p style=\"min-height:1.5em\">At Alan, we believe that <strong>being in good health is a basic need,</strong> and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are <strong>happy, efficient and spend only high-quality time</strong> with co-workers. </p><p style=\"min-height:1.5em\"><strong>Therefore, we offer:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Fair rewards</strong>. Generous equity packages complement your base salary.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible Office</strong>. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.</p></li><li><p style=\"min-height:1.5em\"><strong>All the tools you need</strong>. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and noise-canceling headphones.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible vacation policy and flexible working hours</strong>. Organize your  time as you  wish.</p></li><li><p style=\"min-height:1.5em\"><strong>Delightful healthcare insurance:</strong> Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country<em> (permanent contracts only)</em>.</p></li><li><p style=\"min-height:1.5em\"><strong>Transport</strong>. Country-specific commuter benefits.</p></li><li><p style=\"min-height:1.5em\"><strong>Learning &amp; Training opportunities.</strong> A highly  flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.</p></li><li><p style=\"min-height:1.5em\"><strong>Delightful healthcare insurance:</strong> Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country<em> (permanent contracts only)</em>.</p></li><li><p style=\"min-height:1.5em\"><strong>Parental leave.</strong> Extended parental leave for all new parents.</p></li></ul><p style=\"min-height:1.5em\"></p><h2>Important note: we hire people not roles. </h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you.</strong> Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process</strong><br /><em>Note: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link\"><em>here</em></a><em>. </em></p>","descriptionPlainText":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.\n\n\n⭐ THE ENGINEERING TEAM ⭐\n\nIn our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!\n\nBeing an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.\n\nWe move fast, with a lot of ownership, and are proud to tackle big problems!\n\nOur process is very simple: those who make product decisions are the same ones who build them.\n\nOur stack is Python/Flask, React, React Native, PostgreSQL.\n\nWant to know more? Read this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan if you want to discover how life as an Engineer at Alan and this article https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c on our Engineering career path.\n\n\n🤖 THE TECH FOUNDATIONS AREA\n\n🎯 Mission: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.\n\n🔭 Scope:\n\n 1. Infrastructure enablement for product crews (e.g. hosting improvements https://www.qovery.com/case-study/alan-case-study/, CI/CD https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733, scalability, multi-cloud architecture)\n\n 2. Security and compliance facilitation (e.g. authentication, encryption, threat protection)\n\n 3. Developer productivity enhancements (e.g. local environment setup https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c, monorepo tooling https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc, observability, tech stack evolution)\n\n 4. Design and development unification (e.g. design system https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d, accessibility)\n\n 5. AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)\n\n👀 Focus for 2026:\n\nIn 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.\n\n🔄 A quick note about the process:\n\nWhile you’re applying for a particular area, please note that you may ultimately join a different part of our engineering organization, depending on where we believe you will have the most impact.\n\n\n⭐ IS IT YOU WE’RE LOOKING FOR?\n\nWe are looking for Platform Engineers with 3+ years of experience to help us maintain high reliability while scaling our infrastructure:\n\n - You’ll be able to tackle high-impact & high-risk projects involving many engineers.\n\n - You'll design and implement robust infrastructure systems with a focus on reliability and observability.\n\n - You'll maintain our uptime targets while optimizing infrastructure costs.\n\n - You'll improve our incident management processes and lead post-mortems.\n\n - You'll build and maintain internal tooling (e.g. API, web interface, internal command line, ...) for other engineers.\n\n - You’ll have the opportunity to mentor other engineers & lead crews (more details in this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan).\n\n - You’ll be able to contribute to hiring your future coworkers and shape candidates’ hiring experience (improving our technical assessment process etc...)\n\nYou would be a good fit at Alan if most of this sounds like you:\n\n - You have strong experience with cloud platforms (especially AWS).\n\n - You have experience with monitoring, alerting, and observability tools.\n\n - You're comfortable writing code for automation and tooling (e.g. API, internal command line, ...).\n\n - You have some experience as a Full-Stack or Backend software engineer\n\n - Willing to work in Python/JavaScript (but you don’t need to have experience with those 2 languages!).\n\n - You understand modern deployment practices and CI/CD.\n\n - You're able to debug complex system issues.\n\n - Self-starting and entrepreneurial.\n\n - Humble and still willing to grow (no matter your seniority!).\n\n - Collaborative, enthusiastic about teamwork, learning, and teaching.\n\n - Fluent in English (no need to speak French!).\n\nFor this opportunity, we are aiming to hire above C1 level range\n\nBut above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.\n\n\n🙌 PERKS & BENEFITS https://alan.com/en/careers/a/salary-equity\n\nAt Alan, we believe that being in good health is a basic need, and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\nTherefore, we offer:\n\n - Fair rewards. Generous equity packages complement your base salary.\n\n - Flexible Office. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.\n\n - All the tools you need. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and noise-canceling headphones.\n\n - Flexible vacation policy and flexible working hours. Organize your time as you wish.\n\n - Delightful healthcare insurance: Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country (permanent contracts only).\n\n - Transport. Country-specific commuter benefits.\n\n - Learning & Training opportunities. A highly flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.\n\n - Delightful healthcare insurance: Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country (permanent contracts only).\n\n - Parental leave. Extended parental leave for all new parents.\n\n\nIMPORTANT NOTE: WE HIRE PEOPLE NOT ROLES.\n\nIf you're excited about this opportunity but don't check every box, we'd love to hear from you. Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.\n\nIf you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?\n\nRemember, this is just a guide, not a checklist.\n\nWe'll be thrilled to receive your application!\n\n🔖 Check out our About Alan https://alan.com/about and Career https://alan.com/careers pages, as well as our Medium https://medium.com/alan, blog https://blog.alan.com/ and Glassdoor page https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm for more info.\n\n🔄 A quick note about the process\nNote: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link.","descriptionParts":{"descriptionOpening":{"html":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul>","plain":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership."},"descriptionBody":{"html":"<h1>⭐ The Engineering team ⭐ </h1><p style=\"min-height:1.5em\">In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!</p><p style=\"min-height:1.5em\">Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.</p><p style=\"min-height:1.5em\">We move fast, with a lot of ownership, and are proud to tackle big problems!</p><p style=\"min-height:1.5em\">Our process is very simple: those who make product decisions are the same ones who build them.</p><p style=\"min-height:1.5em\">Our stack is Python/Flask, React, React Native, PostgreSQL.</p><p style=\"min-height:1.5em\">Want to know more? Read <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a> if you want to discover how life as an Engineer at Alan and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c\">this article</a> on our Engineering career path.</p><p style=\"min-height:1.5em\"></p><h1>🤖 The Tech Foundations area</h1><p style=\"min-height:1.5em\">🎯 <strong>Mission</strong>: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.</p><p style=\"min-height:1.5em\"><strong>🔭 Scope:</strong></p><ol style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Infrastructure enablement for product crews (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.qovery.com/case-study/alan-case-study/\">hosting improvements</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733\">CI/CD</a>, scalability, multi-cloud architecture)</p></li><li><p style=\"min-height:1.5em\">Security and compliance facilitation (e.g. authentication, encryption, threat protection)</p></li><li><p style=\"min-height:1.5em\">Developer productivity enhancements (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c\">local environment setup</a>, monorepo <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc\">tooling</a>, observability, tech stack evolution)</p></li><li><p style=\"min-height:1.5em\">Design and development unification (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d\">design system</a>, accessibility)</p></li><li><p style=\"min-height:1.5em\">AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)</p></li></ol><p style=\"min-height:1.5em\"><strong>👀 Focus for 2026:</strong></p><p style=\"min-height:1.5em\">In 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process:</strong></p><p style=\"min-height:1.5em\">While you’re applying for a particular area, please note that you may ultimately join a different part of our engineering organization, depending on where we believe you will have the most impact.</p><p style=\"min-height:1.5em\"></p><h1> ⭐ Is it you we’re looking for?</h1><p style=\"min-height:1.5em\">We are looking for Platform Engineers with 3+ years of experience to help us maintain high reliability while scaling our infrastructure:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You’ll be able to tackle high-impact &amp; high-risk projects involving many engineers.</p></li><li><p style=\"min-height:1.5em\">You'll design and implement robust infrastructure systems with a focus on reliability and observability.</p></li><li><p style=\"min-height:1.5em\">You'll maintain our uptime targets while optimizing infrastructure costs.</p></li><li><p style=\"min-height:1.5em\">You'll improve our incident management processes and lead post-mortems.</p></li><li><p style=\"min-height:1.5em\">You'll build and maintain internal tooling  (e.g. API, web interface, internal command line, ...) for other engineers.</p></li><li><p style=\"min-height:1.5em\">You’ll have the opportunity to mentor other engineers &amp; lead crews (more details in <a target=\"_blank\" rel=\"noopener noreferrer\" class=\"postings-link\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a>).</p></li><li><p style=\"min-height:1.5em\">You’ll be able to contribute to hiring your future coworkers and shape candidates’ hiring experience (improving our technical assessment process etc...)</p></li></ul><p style=\"min-height:1.5em\"><strong>You would be a good fit at Alan if most of this sounds like you: </strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You have strong experience with cloud platforms (especially AWS).</p></li><li><p style=\"min-height:1.5em\">You have experience with monitoring, alerting, and observability tools.</p></li><li><p style=\"min-height:1.5em\">You're comfortable writing code for automation and tooling (e.g. API, internal command line, ...).</p></li><li><p style=\"min-height:1.5em\">You have some experience as a Full-Stack or Backend software engineer</p></li><li><p style=\"min-height:1.5em\">Willing to work in Python/JavaScript (but you don’t need to have experience with those 2 languages!).</p></li><li><p style=\"min-height:1.5em\">You understand modern deployment practices and CI/CD.</p></li><li><p style=\"min-height:1.5em\">You're able to debug complex system issues.</p></li><li><p style=\"min-height:1.5em\">Self-starting and entrepreneurial.</p></li><li><p style=\"min-height:1.5em\">Humble and still willing to grow (no matter your seniority!).</p></li><li><p style=\"min-height:1.5em\">Collaborative, enthusiastic about teamwork, learning, and teaching.</p></li><li><p style=\"min-height:1.5em\">Fluent in English (no need to speak French!).</p></li></ul><p style=\"min-height:1.5em\">For this opportunity, we are aiming to hire above C1 level range</p><p style=\"min-height:1.5em\">But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.</p><p style=\"min-height:1.5em\"></p><h1>🙌   <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/salary-equity\">Perks &amp; Benefits</a></h1><p style=\"min-height:1.5em\">At Alan, we believe that <strong>being in good health is a basic need,</strong> and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are <strong>happy, efficient and spend only high-quality time</strong> with co-workers. </p><p style=\"min-height:1.5em\"><strong>Therefore, we offer:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Fair rewards</strong>. Generous equity packages complement your base salary.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible Office</strong>. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.</p></li><li><p style=\"min-height:1.5em\"><strong>All the tools you need</strong>. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and noise-canceling headphones.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible vacation policy and flexible working hours</strong>. Organize your  time as you  wish.</p></li><li><p style=\"min-height:1.5em\"><strong>Delightful healthcare insurance:</strong> Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country<em> (permanent contracts only)</em>.</p></li><li><p style=\"min-height:1.5em\"><strong>Transport</strong>. Country-specific commuter benefits.</p></li><li><p style=\"min-height:1.5em\"><strong>Learning &amp; Training opportunities.</strong> A highly  flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.</p></li><li><p style=\"min-height:1.5em\"><strong>Delightful healthcare insurance:</strong> Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country<em> (permanent contracts only)</em>.</p></li><li><p style=\"min-height:1.5em\"><strong>Parental leave.</strong> Extended parental leave for all new parents.</p></li></ul><p style=\"min-height:1.5em\"></p><h2>Important note: we hire people not roles. </h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you.</strong> Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process</strong><br /><em>Note: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link\"><em>here</em></a><em>. </em></p>","plain":"⭐ THE ENGINEERING TEAM ⭐\n\nIn our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!\n\nBeing an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.\n\nWe move fast, with a lot of ownership, and are proud to tackle big problems!\n\nOur process is very simple: those who make product decisions are the same ones who build them.\n\nOur stack is Python/Flask, React, React Native, PostgreSQL.\n\nWant to know more? Read this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan if you want to discover how life as an Engineer at Alan and this article https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c on our Engineering career path.\n\n\n🤖 THE TECH FOUNDATIONS AREA\n\n🎯 Mission: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.\n\n🔭 Scope:\n\n 1. Infrastructure enablement for product crews (e.g. hosting improvements https://www.qovery.com/case-study/alan-case-study/, CI/CD https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733, scalability, multi-cloud architecture)\n\n 2. Security and compliance facilitation (e.g. authentication, encryption, threat protection)\n\n 3. Developer productivity enhancements (e.g. local environment setup https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c, monorepo tooling https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc, observability, tech stack evolution)\n\n 4. Design and development unification (e.g. design system https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d, accessibility)\n\n 5. AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)\n\n👀 Focus for 2026:\n\nIn 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.\n\n🔄 A quick note about the process:\n\nWhile you’re applying for a particular area, please note that you may ultimately join a different part of our engineering organization, depending on where we believe you will have the most impact.\n\n\n⭐ IS IT YOU WE’RE LOOKING FOR?\n\nWe are looking for Platform Engineers with 3+ years of experience to help us maintain high reliability while scaling our infrastructure:\n\n - You’ll be able to tackle high-impact & high-risk projects involving many engineers.\n\n - You'll design and implement robust infrastructure systems with a focus on reliability and observability.\n\n - You'll maintain our uptime targets while optimizing infrastructure costs.\n\n - You'll improve our incident management processes and lead post-mortems.\n\n - You'll build and maintain internal tooling (e.g. API, web interface, internal command line, ...) for other engineers.\n\n - You’ll have the opportunity to mentor other engineers & lead crews (more details in this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan).\n\n - You’ll be able to contribute to hiring your future coworkers and shape candidates’ hiring experience (improving our technical assessment process etc...)\n\nYou would be a good fit at Alan if most of this sounds like you:\n\n - You have strong experience with cloud platforms (especially AWS).\n\n - You have experience with monitoring, alerting, and observability tools.\n\n - You're comfortable writing code for automation and tooling (e.g. API, internal command line, ...).\n\n - You have some experience as a Full-Stack or Backend software engineer\n\n - Willing to work in Python/JavaScript (but you don’t need to have experience with those 2 languages!).\n\n - You understand modern deployment practices and CI/CD.\n\n - You're able to debug complex system issues.\n\n - Self-starting and entrepreneurial.\n\n - Humble and still willing to grow (no matter your seniority!).\n\n - Collaborative, enthusiastic about teamwork, learning, and teaching.\n\n - Fluent in English (no need to speak French!).\n\nFor this opportunity, we are aiming to hire above C1 level range\n\nBut above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.\n\n\n🙌 PERKS & BENEFITS https://alan.com/en/careers/a/salary-equity\n\nAt Alan, we believe that being in good health is a basic need, and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\nTherefore, we offer:\n\n - Fair rewards. Generous equity packages complement your base salary.\n\n - Flexible Office. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.\n\n - All the tools you need. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and noise-canceling headphones.\n\n - Flexible vacation policy and flexible working hours. Organize your time as you wish.\n\n - Delightful healthcare insurance: Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country (permanent contracts only).\n\n - Transport. Country-specific commuter benefits.\n\n - Learning & Training opportunities. A highly flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.\n\n - Delightful healthcare insurance: Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country (permanent contracts only).\n\n - Parental leave. Extended parental leave for all new parents.\n\n\nIMPORTANT NOTE: WE HIRE PEOPLE NOT ROLES.\n\nIf you're excited about this opportunity but don't check every box, we'd love to hear from you. Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.\n\nIf you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?\n\nRemember, this is just a guide, not a checklist.\n\nWe'll be thrilled to receive your application!\n\n🔖 Check out our About Alan https://alan.com/about and Career https://alan.com/careers pages, as well as our Medium https://medium.com/alan, blog https://blog.alan.com/ and Glassdoor page https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm for more info.\n\n🔄 A quick note about the process\nNote: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link."},"descriptionClosing":null},"shortDescription":null,"applicationFormDefinitionId":"46405c90-7e22-40c8-8075-20522903c43d","surveyFormDefinitionIds":[],"linkedData":{"@context":"https://schema.org/","@type":"JobPosting","title":"Platform Engineer (x/f/m) - Tech Foundations","description":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul><h1>⭐ The Engineering team ⭐ </h1><p style=\"min-height:1.5em\">In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!</p><p style=\"min-height:1.5em\">Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.</p><p style=\"min-height:1.5em\">We move fast, with a lot of ownership, and are proud to tackle big problems!</p><p style=\"min-height:1.5em\">Our process is very simple: those who make product decisions are the same ones who build them.</p><p style=\"min-height:1.5em\">Our stack is Python/Flask, React, React Native, PostgreSQL.</p><p style=\"min-height:1.5em\">Want to know more? Read <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a> if you want to discover how life as an Engineer at Alan and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c\">this article</a> on our Engineering career path.</p><p style=\"min-height:1.5em\"></p><h1>🤖 The Tech Foundations area</h1><p style=\"min-height:1.5em\">🎯 <strong>Mission</strong>: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.</p><p style=\"min-height:1.5em\"><strong>🔭 Scope:</strong></p><ol style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Infrastructure enablement for product crews (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.qovery.com/case-study/alan-case-study/\">hosting improvements</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733\">CI/CD</a>, scalability, multi-cloud architecture)</p></li><li><p style=\"min-height:1.5em\">Security and compliance facilitation (e.g. authentication, encryption, threat protection)</p></li><li><p style=\"min-height:1.5em\">Developer productivity enhancements (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c\">local environment setup</a>, monorepo <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc\">tooling</a>, observability, tech stack evolution)</p></li><li><p style=\"min-height:1.5em\">Design and development unification (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d\">design system</a>, accessibility)</p></li><li><p style=\"min-height:1.5em\">AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)</p></li></ol><p style=\"min-height:1.5em\"><strong>👀 Focus for 2026:</strong></p><p style=\"min-height:1.5em\">In 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process:</strong></p><p style=\"min-height:1.5em\">While you’re applying for a particular area, please note that you may ultimately join a different part of our engineering organization, depending on where we believe you will have the most impact.</p><p style=\"min-height:1.5em\"></p><h1> ⭐ Is it you we’re looking for?</h1><p style=\"min-height:1.5em\">We are looking for Platform Engineers with 3+ years of experience to help us maintain high reliability while scaling our infrastructure:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You’ll be able to tackle high-impact &amp; high-risk projects involving many engineers.</p></li><li><p style=\"min-height:1.5em\">You'll design and implement robust infrastructure systems with a focus on reliability and observability.</p></li><li><p style=\"min-height:1.5em\">You'll maintain our uptime targets while optimizing infrastructure costs.</p></li><li><p style=\"min-height:1.5em\">You'll improve our incident management processes and lead post-mortems.</p></li><li><p style=\"min-height:1.5em\">You'll build and maintain internal tooling  (e.g. API, web interface, internal command line, ...) for other engineers.</p></li><li><p style=\"min-height:1.5em\">You’ll have the opportunity to mentor other engineers &amp; lead crews (more details in <a target=\"_blank\" rel=\"noopener noreferrer\" class=\"postings-link\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a>).</p></li><li><p style=\"min-height:1.5em\">You’ll be able to contribute to hiring your future coworkers and shape candidates’ hiring experience (improving our technical assessment process etc...)</p></li></ul><p style=\"min-height:1.5em\"><strong>You would be a good fit at Alan if most of this sounds like you: </strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You have strong experience with cloud platforms (especially AWS).</p></li><li><p style=\"min-height:1.5em\">You have experience with monitoring, alerting, and observability tools.</p></li><li><p style=\"min-height:1.5em\">You're comfortable writing code for automation and tooling (e.g. API, internal command line, ...).</p></li><li><p style=\"min-height:1.5em\">You have some experience as a Full-Stack or Backend software engineer</p></li><li><p style=\"min-height:1.5em\">Willing to work in Python/JavaScript (but you don’t need to have experience with those 2 languages!).</p></li><li><p style=\"min-height:1.5em\">You understand modern deployment practices and CI/CD.</p></li><li><p style=\"min-height:1.5em\">You're able to debug complex system issues.</p></li><li><p style=\"min-height:1.5em\">Self-starting and entrepreneurial.</p></li><li><p style=\"min-height:1.5em\">Humble and still willing to grow (no matter your seniority!).</p></li><li><p style=\"min-height:1.5em\">Collaborative, enthusiastic about teamwork, learning, and teaching.</p></li><li><p style=\"min-height:1.5em\">Fluent in English (no need to speak French!).</p></li></ul><p style=\"min-height:1.5em\">For this opportunity, we are aiming to hire above C1 level range</p><p style=\"min-height:1.5em\">But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.</p><p style=\"min-height:1.5em\"></p><h1>🙌   <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/salary-equity\">Perks &amp; Benefits</a></h1><p style=\"min-height:1.5em\">At Alan, we believe that <strong>being in good health is a basic need,</strong> and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are <strong>happy, efficient and spend only high-quality time</strong> with co-workers. </p><p style=\"min-height:1.5em\"><strong>Therefore, we offer:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Fair rewards</strong>. Generous equity packages complement your base salary.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible Office</strong>. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.</p></li><li><p style=\"min-height:1.5em\"><strong>All the tools you need</strong>. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and noise-canceling headphones.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible vacation policy and flexible working hours</strong>. Organize your  time as you  wish.</p></li><li><p style=\"min-height:1.5em\"><strong>Delightful healthcare insurance:</strong> Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country<em> (permanent contracts only)</em>.</p></li><li><p style=\"min-height:1.5em\"><strong>Transport</strong>. Country-specific commuter benefits.</p></li><li><p style=\"min-height:1.5em\"><strong>Learning &amp; Training opportunities.</strong> A highly  flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.</p></li><li><p style=\"min-height:1.5em\"><strong>Delightful healthcare insurance:</strong> Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country<em> (permanent contracts only)</em>.</p></li><li><p style=\"min-height:1.5em\"><strong>Parental leave.</strong> Extended parental leave for all new parents.</p></li></ul><p style=\"min-height:1.5em\"></p><h2>Important note: we hire people not roles. </h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you.</strong> Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process</strong><br /><em>Note: While you're applying for a specific area,, you may
