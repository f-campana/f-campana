  <meta name="description" content="YOU. BETTER. WITH ALAN.

Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.

Our mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.

By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.

We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.


HOW WE WORK: OUR LEADERSHIP PRINCIPLES

 - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission&#39;s success above all else.

 - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.

 - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.

 - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.


⭐ THE ENGINEERING TEAM ⭐

In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!

Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.

We move fast, with a lot of ownership, and are proud to tackle big problems!

Our process is very simple: those who make product decisions are the same ones who build them.

Want to know more? Read this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan if you want to discover how life as an Engineer at Alan and this article https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c on our Engineering career path.


🛠️ THE STACK

Python/Flask, React, React Native, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.


🤖 THE TECH FOUNDATIONS AREA

🎯 Mission: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.

🔭 Scope:

 1. Infrastructure enablement for product crews (e.g. hosting improvements https://www.qovery.com/case-study/alan-case-study/, CI/CD https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733, scalability, multi-cloud architecture)

 2. Security and compliance facilitation (e.g. authentication, encryption, threat protection)

 3. Developer productivity enhancements (e.g. local environment setup https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c, monorepo tooling https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc, observability, tech stack evolution)

 4. Design and development unification (e.g. design system https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d, accessibility)

 5. AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)

👀 Focus for 2026:

In 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.


⭐ IS IT YOU WE’RE LOOKING FOR?


EXPERIENCE WE VALUE

 - 3+ years in full-stack software engineering roles

 - Experience building internal tools, frameworks, CLIs, or libraries that improve developer workflows

 - Strong frontend development skills and understanding of modern UI practices

 - You&#39;ve contributed to design systems, component libraries, or accessibility initiatives

 - You care about creating delightful experiences, whether building UIs or APIs


MINDSET WE VALUE

 - You think in terms of developer experience: engineers are your customers

 - You are collaborative, humble, and motivated by enabling others

 - You simplify complexity with elegant abstractions and maintainable code

 - You&#39;re excited about AI and automation in engineering workflows

 - You are fluent in English (no French required)

 - But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.


🌍 HOW WE WORK

 - Location: You must be legally eligible to work in France, Belgium, or Spain.

 - Remote work: We offer remote work flexibility, but we value in-person collaboration


🎯 IMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.

If you&#39;re excited about this opportunity but don&#39;t check every box, we&#39;d love to hear from you. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.

If you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?

Remember, this is just a guide, not a checklist.

We&#39;ll be thrilled to receive your application!

🔖 Check out our About Alan https://alan.com/about and Career https://alan.com/careers pages, as well as our Medium https://medium.com/alan, blog https://blog.alan.com/ and Glassdoor page https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm for more info.


YOU WANT TO KNOW MORE ABOUT ALAN?

 - 🙌 Perks &amp; Benefits https://alan.com/en/careers/a/salary-equity: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.

 - 🤘 A strong culture https://alan.com/en/about/a/leadership-principles: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work

🔄 A quick note about the process

Note: While you&#39;re applying for a specific area, you may join a different engineering team based on where we think you&#39;ll have the most impact. Check out descriptions of other areas here https://www.notion.so/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?pvs=21." />

3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b6f2a2f2-490b-4305-84f3-0f986d70ef14.png","logoSquareImageUrl":"https://app.ashbyhq.com/api/images/org-theme-logo/16fb5c4f-12a4-4e77-a698-3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b8987509-72b3-449b-8d58-1af70771e1e8.png","applicationSubmittedSuccessMessage":"Your application was successfully submitted. We'll contact shortly. Thank you!","jobBoardTopDescriptionHtml":"<p style=\"min-height:1.5em\"><strong>You. Better. With Alan. </strong><br /><br />Alan's vision is to make <strong>prevention the new norm</strong> of care for all.<br />‭<br />Alan's mission is to <strong>help people live in good health to 100</strong> while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p>","jobBoardBottomDescriptionHtml":"<h2><strong>Important note: we hire people, not roles.</strong></h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you.</strong> Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p>","jobPostingBackUrl":null},"appConfirmationTrackingPixelHtml":null,"recruitingPrivacyPolicyUrl":"https://alan.com/candidate-privacy","timezone":"Europe/Paris","candidateScheduleCancellationReasonRequirementStatus":"Off"},"posting":{"id":"14729a35-9c9f-479e-860b-3d6c1348a2b0","title":"Full-stack Software Engineer (x/f/m) - Tech Foundations","updatedAt":"2026-02-02T22:03:00.681Z","departmentName":"Engineering","departmentExternalName":"Engineering","teamName":"Engineering","teamExternalName":"Engineering","teamNames":["Engineering"],"locationName":"Anywhere in France, Belgium, Spain","locationExternalName":"Anywhere in France, Belgium, Spain","isListed":true,"suppressDescriptionOpening":false,"suppressDescriptionClosing":false,"descriptionHtml":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul><h1>⭐ The Engineering team ⭐</h1><p style=\"min-height:1.5em\">In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!</p><p style=\"min-height:1.5em\">Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.</p><p style=\"min-height:1.5em\">We move fast, with a lot of ownership, and are proud to tackle big problems!</p><p style=\"min-height:1.5em\">Our process is very simple: those who make product decisions are the same ones who build them.</p><p style=\"min-height:1.5em\">Want to know more? Read <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a> if you want to discover how life as an Engineer at Alan and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c\">this article</a> on our Engineering career path.</p><p style=\"min-height:1.5em\"></p><h1><strong>🛠️ The Stack</strong></h1><p style=\"min-height:1.5em\">Python/Flask, React, React Native, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.</p><p style=\"min-height:1.5em\"></p><h1>🤖 The Tech Foundations area</h1><p style=\"min-height:1.5em\">🎯 <strong>Mission</strong>: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.</p><p style=\"min-height:1.5em\"><strong>🔭 Scope:</strong></p><ol style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Infrastructure enablement for product crews (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.qovery.com/case-study/alan-case-study/\">hosting improvements</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733\">CI/CD</a>, scalability, multi-cloud architecture)</p></li><li><p style=\"min-height:1.5em\">Security and compliance facilitation (e.g. authentication, encryption, threat protection)</p></li><li><p style=\"min-height:1.5em\">Developer productivity enhancements (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c\">local environment setup</a>, monorepo <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc\">tooling</a>, observability, tech stack evolution)</p></li><li><p style=\"min-height:1.5em\">Design and development unification (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d\">design system</a>, accessibility)</p></li><li><p style=\"min-height:1.5em\">AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)</p></li></ol><p style=\"min-height:1.5em\"><strong>👀 Focus for 2026:</strong></p><p style=\"min-height:1.5em\">In 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.</p><p style=\"min-height:1.5em\"></p><h1>⭐ Is it you we’re looking for?</h1><h2>Experience we value</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">3+ years in full-stack software engineering roles</p></li><li><p style=\"min-height:1.5em\">Experience building internal tools, frameworks, CLIs, or libraries that improve developer workflows</p></li><li><p style=\"min-height:1.5em\">Strong frontend development skills and understanding of modern UI practices</p></li><li><p style=\"min-height:1.5em\">You've contributed to design systems, component libraries, or accessibility initiatives</p></li><li><p style=\"min-height:1.5em\">You care about creating delightful experiences, whether building UIs or APIs</p></li></ul><h2>Mindset we value</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You think in terms of developer experience: engineers are your customers</p></li><li><p style=\"min-height:1.5em\">You are collaborative, humble, and motivated by enabling others</p></li><li><p style=\"min-height:1.5em\">You simplify complexity with elegant abstractions and maintainable code</p></li><li><p style=\"min-height:1.5em\">You're excited about AI and automation in engineering workflows</p></li><li><p style=\"min-height:1.5em\">You are fluent in English (no French required)</p></li><li><p style=\"min-height:1.5em\">But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.</p></li></ul><h1><strong>🌍 How we work</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Location</strong>: You must be legally eligible to work in France, Belgium, or Spain.</p></li><li><p style=\"min-height:1.5em\"><strong>Remote work:</strong> We offer remote work flexibility, but we value in-person collaboration</p></li></ul><h2><strong>🎯 Important note: we hire people, not roles.</strong></h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you</strong>. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p><p style=\"min-height:1.5em\"></p><h1><strong>You want to know more about Alan?</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>🙌 </strong><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/salary-equity\"><strong>Perks &amp; Benefits</strong></a><strong>:</strong> Alaners are provided with a stimulating environment and perks ensuring they are <strong>happy, efficient and spend only high-quality time</strong> with co-workers.</p></li><li><p style=\"min-height:1.5em\"><strong>🤘 </strong><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/about/a/leadership-principles\"><strong>A strong culture</strong></a><strong>:</strong> People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work</p></li></ul><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process</strong></p><p style=\"min-height:1.5em\"><em>Note: While you're applying for a specific area, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?pvs=21\"><em>here</em></a><em>.</em></p>","descriptionPlainText":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.\n\n\n⭐ THE ENGINEERING TEAM ⭐\n\nIn our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!\n\nBeing an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.\n\nWe move fast, with a lot of ownership, and are proud to tackle big problems!\n\nOur process is very simple: those who make product decisions are the same ones who build them.\n\nWant to know more? Read this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan if you want to discover how life as an Engineer at Alan and this article https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c on our Engineering career path.\n\n\n🛠️ THE STACK\n\nPython/Flask, React, React Native, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.\n\n\n🤖 THE TECH FOUNDATIONS AREA\n\n🎯 Mission: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.\n\n🔭 Scope:\n\n 1. Infrastructure enablement for product crews (e.g. hosting improvements https://www.qovery.com/case-study/alan-case-study/, CI/CD https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733, scalability, multi-cloud architecture)\n\n 2. Security and compliance facilitation (e.g. authentication, encryption, threat protection)\n\n 3. Developer productivity enhancements (e.g. local environment setup https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c, monorepo tooling https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc, observability, tech stack evolution)\n\n 4. Design and development unification (e.g. design system https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d, accessibility)\n\n 5. AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)\n\n👀 Focus for 2026:\n\nIn 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.\n\n\n⭐ IS IT YOU WE’RE LOOKING FOR?\n\n\nEXPERIENCE WE VALUE\n\n - 3+ years in full-stack software engineering roles\n\n - Experience building internal tools, frameworks, CLIs, or libraries that improve developer workflows\n\n - Strong frontend development skills and understanding of modern UI practices\n\n - You've contributed to design systems, component libraries, or accessibility initiatives\n\n - You care about creating delightful experiences, whether building UIs or APIs\n\n\nMINDSET WE VALUE\n\n - You think in terms of developer experience: engineers are your customers\n\n - You are collaborative, humble, and motivated by enabling others\n\n - You simplify complexity with elegant abstractions and maintainable code\n\n - You're excited about AI and automation in engineering workflows\n\n - You are fluent in English (no French required)\n\n - But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.\n\n\n🌍 HOW WE WORK\n\n - Location: You must be legally eligible to work in France, Belgium, or Spain.\n\n - Remote work: We offer remote work flexibility, but we value in-person collaboration\n\n\n🎯 IMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.\n\nIf you're excited about this opportunity but don't check every box, we'd love to hear from you. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.\n\nIf you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?\n\nRemember, this is just a guide, not a checklist.\n\nWe'll be thrilled to receive your application!\n\n🔖 Check out our About Alan https://alan.com/about and Career https://alan.com/careers pages, as well as our Medium https://medium.com/alan, blog https://blog.alan.com/ and Glassdoor page https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm for more info.\n\n\nYOU WANT TO KNOW MORE ABOUT ALAN?\n\n - 🙌 Perks & Benefits https://alan.com/en/careers/a/salary-equity: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\n - 🤘 A strong culture https://alan.com/en/about/a/leadership-principles: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work\n\n🔄 A quick note about the process\n\nNote: While you're applying for a specific area, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?pvs=21.","descriptionParts":{"descriptionOpening":{"html":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul>","plain":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcar 9cc\">tooling</a>, observability, tech stack evolution)</p></li><li><p style=\"min-height:1.5em\">Design and development unification (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d\">design system</a>, accessibility)</p></li><li><p style=\"min-height:1.5em\">AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)</p></li></ol><p style=\"min-height:1.5em\"><strong>👀 Focus for 2026:</strong></p><p style=\"min-height:1.5em\">In 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.</p><p style=\"min-height:1.5em\"></p><h1>⭐ Is it you we’re looking for?</h1><h2>Experience we value</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">3+ years in full-stack software engineering roles</p></li><li><p style=\"min-height:1.5em\">Experience building internal tools, frameworks, CLIs, or libraries that improve developer workflows</p></li><li><p style=\"min-height:1.5em\">Strong frontend development skills and understanding of modern UI practices</p></li><li><p style=\"min-height:1.5em\">You've contributed to design systems, component libraries, or accessibility initiatives</p></li><li><p style=\"min-height:1.5em\">You care about creating delightful experiences, whether building UIs or APIs</p></li></ul><h2>Mindset we value</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You think in terms of developer experience: engineers are your customers</p></li><li><p style=\"min-height:1.5em\">You are collaborative, humble, and motivated by enabling others</p></li><li><p style=\"min-height:1.5em\">You simplify complexity with elegant abstractions and maintainable code</p></li><li><p style=\"min-height:1.5em\">You're excited about AI and automation in engineering workflows</p></li><li><p style=\"min-height:1.5em\">You are fluent in English (no French required)</p></li><li><p style=\"min-height:1.5em\">But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.</p></li></ul><h1><strong>🌍 How we work</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Location</strong>: You must be legally eligible to work in France, Belgium, or Spain.</p></li><li><p style=\"min-height:1.5em\"><strong>Remote work:</strong> We offer remote work flexibility, but we value in-person collaboration</p></li></ul><h2><strong>🎯 Important note: we hire people, not roles.</strong></h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you</strong>. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener n \nIn 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.\n\n\n⭐ IS IT YOU WE’RE LOOKING FOR?\n\n\nEXPERIENCE WE VALUE\n\n - 3+ years in full-stack software engineering roles\n\n - Experience building internal tools, frameworks, CLIs, or libraries that improve developer workflows\n\n - Strong frontend development skills and understanding of modern UI practices\n\n - You've contributed to design systems, component libraries, or accessibility initiatives\n\n - You care about creating delightful experiences, whether building UIs or APIs\n\n\nMINDSET WE VALUE\n\n - You think in terms of developer experience: engineers are your customers\n\n - You are collaborative, humble, and motivated by enabling others\n\n - You simplify complexity with elegant abstractions and maintainable code\n\n - You're excited about AI and automation in engineering workflows\n\n - You are fluent in English (no French required)\n\n - But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.\n\n\n🌍 HOW WE WORK\n\n - Location: You must be legally eligible to work in France, Belgium, or Spain.\n\n - Remote work: We offer remote work flexibility, but we value in-person collaboration\n\n\n🎯 IMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.\n\nIf you're excited about this opportunity but don't check every box, we'd love to hear from you. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.\n\nIf you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?\n\nRemember, this is just a guide, not a checklist.\n\nWe'll be thrilled to receive your application!\n\n🔖 Check out our About Alan https://alan.com/about and Career https://alan.com/careers pages, as well as our Medium https://medium.com/alan, blog https://blog.alan.com/ and Glassdoor page https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm for more info.\n\n\nYOU WANT TO KNOW MORE ABOUT ALAN?\n\n - 🙌 Perks & Benefits https://alan.com/en/careers/a/salary-equity: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\n - 🤘 A strong culture https://alan.com/en/about/a/leadership-principles: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work\n\n🔄 A quick note about the process\n\nNote: While you're applying for a specific area, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?pvs=21."},"descriptionClosing":null},"shortDescription":null,"applicationFormDefinitionId":"74214292-7de2-4e99-b4c3-9f4972d252a1","surveyFormDefinitionIds":[],"linkedData":{"@context":"https://schema.org/","@type":"JobPosting","title":"Full-stack Software Engineer (x/f/m) - Tech Foundations","description":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul><h1>⭐ The Engineering team ⭐</h1><p style=\"min-height:1.5em\">In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!</p><p style=\"min-height:1.5em\">Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.</p><p style=\"min-height:1.5em\">We move fast, with a lot of ownership, and are proud to tackle big problems!</p><p style=\"min-height:1.5em\">Our process is very simple: those who make product decisions are the same ones who build them.</p><p style=\"min-height:1.5em\">Want to know more? Read <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a> if you want to discover how life as an Engineer at Alan and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c\">this article</a> on our Engineering career path.</p><p style=\"min-height:1.5em\"></p><h1><strong>🛠️ The Stack</strong></h1><p style=\"min-height:1.5em\">Python/Flask, React, React Native, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.</p><p style=\"min-height:1.5em\"></p><h1>🤖 The Tech Foundations area</h1><p style=\"min-height:1.5em\">🎯 <strong>Mission</strong>: Tech Foundations enables product crews and creates the environment to thrive—combining world-class infrastructure, intuitive developer experience, exquisite operational excellence, and built-in security to make shipping exceptional products effortless.</p><p style=\"min-height:1.5em\"><strong>🔭 Scope:</strong></p><ol style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Infrastructure enablement for product crews (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.qovery.com/case-study/alan-case-study/\">hosting improvements</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/moving-our-ci-cd-to-github-actions-40df3f7e4733\">CI/CD</a>, scalability, multi-cloud architecture)</p></li><li><p style=\"min-height:1.5em\">Security and compliance facilitation (e.g. authentication, encryption, threat protection)</p></li><li><p style=\"min-height:1.5em\">Developer productivity enhancements (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/our-journey-from-react-native-to-expo-for-mobile-app-development-at-alan-%EF%B8%8F-3b1569e8ab7c\">local environment setup</a>, monorepo <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/building-debug-tooling-for-engineers-and-support-teams-alike-34cab315b9cc\">tooling</a>, observability, tech stack evolution)</p></li><li><p style=\"min-height:1.5em\">Design and development unification (e.g. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/towards-a-universal-design-system-dc4a65e1e13d\">design system</a>, accessibility)</p></li><li><p style=\"min-height:1.5em\">AI-assisted engineering enablement (e.g. agentic development, code assistants, MCP servers)</p></li></ol><p style=\"min-height:1.5em\"><strong>👀 Focus for 2026:</strong></p><p style=\"min-height:1.5em\">In 2026, we will grow the team significantly to further increase our impact. We want to expand our cloud footprint with a revisited multi-cloud strategy as we expand internationally, while we’re elevating the quality bar, from infrastructure to code foundations (backend/frontend/mobile). We are also evolving our AI-augmented development, by putting AI code assistants as a first-class citizen for everyone, including non-engineers. Ultimately we have massive ambitions around our Security stack and posture with enhanced tools and processes to protect our developers and users.</p><p style=\"min-height:1.5em\"></p><h1>⭐ Is it you we’re looking for?</h1><h2>Experience we value</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">3+ years in full-stack software engineering roles</p></li><li><p style=\"min-height:1.5em\">Experience building internal tools, frameworks, CLIs, or libraries that improve developer workflows</p></li><li><p style=\"min-height:1.5em\">Strong frontend development skills and understanding of modern UI practices</p></li><li><p style=\"min-height:1.5em\">You've contributed to design systems, component libraries, or accessibility initiatives</p></li><li><p style=\"min-height:1.5em\">You care about creating delightful experiences, whether building UIs or APIs</p></li></ul><h2>Mindset we value</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You think in terms of developer experience: engineers are your customers</p></li><li><p style=\"min-height:1.5em\">You are collaborative, humble, and motivated by enabling others</p></li><li><p style=\"min-height:1.5em\">You simplify complexity with elegant abstractions and maintainable code</p></li><li><p style=\"min-height:1.5em\">You're excited about AI and automation in engineering workflows</p></li><li><p style=\"min-height:1.5em\">You are fluent in English (no French required)</p></li><li><p style=\"min-height:1.5em\">But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.</p></li></ul><h1><strong>🌍 How we work</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Location</strong>: You must be legally eligible to work in France, Belgium, or Spain.</p></li><li><p style=\"min-height:1.5em\"><strong>Remote work:</strong> We offer remote work flexibility, but we value in-person collaboration</p></li></ul><h2><strong>🎯 Important note: we hire people, not roles.</strong></h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you</strong>. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/
