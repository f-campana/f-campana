  <meta name="description" content="YOU. BETTER. WITH ALAN.

Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.

Our mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.

By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.

We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.


HOW WE WORK: OUR LEADERSHIP PRINCIPLES

 - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission&#39;s success above all else.

 - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.

 - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.

 - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.


⭐ BUILD THE BACKBONE OF ALAN’S FINANCIAL SYSTEMS

At Alan, billing is a platform that powers reliable, accurate, and scalable financial operations across multiple countries and products. Our mission is to turn complex, high-volume billing flows into systems that “just work,” so customers and members can focus on what matters.

As a Software Engineer on this team, you will:

 - Build the core billing engine: process thousands of transactions daily with precision and reliability.

 - Design modular, reusable billing primitives and abstractions that scale across products and regions.

 - Integrate seamlessly with internal systems and external payment platforms.

 - Automate workflows and billing schedules at scale for companies of all sizes.

 - Ensure invoices are accurate, reliable, and easy to manage for internal and external users.

 - Collaborate closely with product, design, and operations to maintain a unified, high-quality platform experience.


WHY THIS ROLE IS SPECIAL:

 - Solve technically challenging problems in a mission-critical, high-scale platform.

 - Shape the architecture of Alan’s core financial systems and long-term product strategy.

 - Impact millions of members and clients, powering hassle-free experience.

 - Join a team obsessed with craftsmanship, scalability, and operational excellence.

 - Work in an environment where your ideas, designs, and decisions drive tangible outcomes.


🛠 YOUR PLAYGROUND

 - Stack: Python/Flask, React, React Native, PostgreSQL.

 - What you’ll do: ship solutions that handle high complexity and scale across multiple countries, collaborating closely with product and design teams.

 - Impact: your work touches core business operations and enables hundreds of thousands of employees to benefit from Alan every day.


👥 WHO WE’RE LOOKING FOR

 - We are looking for software engineers of all experience levels, ideally with backend and full-stack experience.

 - Passionate about building elegant solutions to support rich business logic.

 - Experienced in building scalable systems that handle real-world complexity.

 - B2B experience is a plus!

 - Well-versed in OOP languages (Python, Java, C#).

 - Fluent in English (French is a plus but not required).

 - Curious, self-starting, humble, collaborative, and eager to grow.


🙌 PERKS &amp; BENEFITS

 - Fair rewards &amp; equity packages.

 - Flexible office &amp; remote options.

 - Top-tier equipment: MacBook Pro, monitor, noise-canceling headphones.

 - Flexible vacation &amp; hours.

 - Comprehensive healthcare for you, children, and partners.

 - Transport support and coaching for personal growth.

 - Training budget for conferences, courses, books.

 - Extended parental leave for all parents.


🔄 RECRUITMENT NOTE

🌟 We hire people, not roles. Don’t worry if you don’t check every box - high potential and curiosity matter most. We may even suggest another team if we see a better fit.

3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b6f2a2f2-490b-4305-84f3-0f986d70ef14.png","logoSquareImageUrl":"https://app.ashbyhq.com/api/images/org-theme-logo/16fb5c4f-12a4-4e77-a698-3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b8987509-72b3-449b-8d58-1af70771e1e8.png","applicationSubmittedSuccessMessage":"Your application was successfully submitted. We'll contact shortly. Thank you!","jobBoardTopDescriptionHtml":"<p style=\"min-height:1.5em\"><strong>You. Better. With Alan. </strong><br /><br />Alan's vision is to make <strong>prevention the new norm</strong> of care for all.<br />‭<br />Alan's mission is to <strong>help people live in good health to 100</strong> while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p>","jobBoardBottomDescriptionHtml":"<h2><strong>Important note: we hire people, not roles.</strong></h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you.</strong> Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p>","jobPostingBackUrl":null},"appConfirmationTrackingPixelHtml":null,"recruitingPrivacyPolicyUrl":"https://alan.com/candidate-privacy","timezone":"Europe/Paris","candidateScheduleCancellationReasonRequirementStatus":"Off"},"posting":{"id":"0544ee39-4b01-4f86-b239-892047b1eed0","title":"Fullstack Software Engineer (x/f/m) - Global Billing Platform","updatedAt":"2026-02-13T10:45:17.946Z","departmentName":"Engineering","departmentExternalName":"Engineering","teamName":"Engineering","teamExternalName":"Engineering","teamNames":["Engineering"],"locationName":"Anywhere in France, Belgium, Spain","locationExternalName":"Anywhere in France, Belgium, Spain","isListed":true,"suppressDescriptionOpening":false,"suppressDescriptionClosing":false,"descriptionHtml":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul><h1><strong>⭐ Build the backbone of Alan’s financial systems</strong></h1><p style=\"min-height:1.5em\">At Alan, billing is a platform that powers reliable, accurate, and scalable financial operations across multiple countries and products. Our mission is to turn complex, high-volume billing flows into systems that “just work,” so customers and members can focus on what matters.</p><p style=\"min-height:1.5em\"><strong>As a Software Engineer on this team, you will:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Build the core billing engine</strong>: process thousands of transactions daily with precision and reliability.</p></li><li><p style=\"min-height:1.5em\"><strong>Design modular, reusable billing primitives</strong> and abstractions that scale across products and regions.</p></li><li><p style=\"min-height:1.5em\"><strong>Integrate seamlessly</strong> with internal systems and external payment platforms.</p></li><li><p style=\"min-height:1.5em\"><strong>Automate workflows</strong> and billing schedules at scale for companies of all sizes.</p></li><li><p style=\"min-height:1.5em\"><strong>Ensure invoices are accurate</strong>, reliable, and easy to manage for internal and external users.</p></li><li><p style=\"min-height:1.5em\"><strong>Collaborate closely</strong> with product, design, and operations to maintain a unified, high-quality platform experience.</p><p style=\"min-height:1.5em\"></p></li></ul><h2><strong>Why this role is special:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Solve technically challenging problems</strong> in a mission-critical, high-scale platform.</p></li><li><p style=\"min-height:1.5em\"><strong>Shape the architecture of Alan’s core financial systems</strong> and long-term product strategy.</p></li><li><p style=\"min-height:1.5em\"><strong>Impact millions of members and clients</strong>, powering hassle-free experience.</p></li><li><p style=\"min-height:1.5em\"><strong>Join a team obsessed with craftsmanship</strong>, scalability, and operational excellence.</p></li><li><p style=\"min-height:1.5em\"><strong>Work in an environment</strong> where your ideas, designs, and decisions drive tangible outcomes.</p></li></ul><p style=\"min-height:1.5em\"></p><h1><strong>🛠 Your playground</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Stack</strong>: Python/Flask, React, React Native, PostgreSQL.</p></li><li><p style=\"min-height:1.5em\"><strong>What you’ll do</strong>: ship solutions that handle high complexity and scale across multiple countries, collaborating closely with product and design teams.</p></li><li><p style=\"min-height:1.5em\"><strong>Impact</strong>: your work touches core business operations and enables hundreds of thousands of employees to benefit from Alan every day.</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>👥 Who we’re looking for</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">We are looking for software engineers of all experience levels, ideally with <strong>backend and full-stack experience</strong>.</p></li><li><p style=\"min-height:1.5em\">Passionate about building<strong> elegant solutions </strong>to support rich business logic.</p></li><li><p style=\"min-height:1.5em\">Experienced in building <strong>scalable systems</strong> that handle real-world complexity.</p></li><li><p style=\"min-height:1.5em\">B2B experience is a plus!</p></li><li><p style=\"min-height:1.5em\">Well-versed in <strong>OOP languages</strong> (Python, Java, C#).</p></li><li><p style=\"min-height:1.5em\"><strong>Fluent in English</strong> (French is a plus but not required).</p></li><li><p style=\"min-height:1.5em\">Curious, self-starting, humble, collaborative, and eager to grow.</p></li></ul><p style=\"min-height:1.5em\"></p><h1><strong>🙌 Perks &amp; Benefits</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Fair rewards &amp; equity</strong> packages.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible office &amp; remote options</strong>.</p></li><li><p style=\"min-height:1.5em\"><strong>Top-tier equipment</strong>: MacBook Pro, monitor, noise-canceling headphones.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible vacation &amp; hours</strong>.</p></li><li><p style=\"min-height:1.5em\"><strong>Comprehensive healthcare</strong> for you, children, and partners.</p></li><li><p style=\"min-height:1.5em\"><strong>Transport support</strong> and <strong>coaching for personal growth</strong>.</p></li><li><p style=\"min-height:1.5em\"><strong>Training budget</strong> for conferences, courses, books.</p></li><li><p style=\"min-height:1.5em\"><strong>Extended parental leave</strong> for all parents.</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>🔄 Recruitment note</strong></h1><p style=\"min-height:1.5em\">🌟 We hire people, not roles. Don’t worry if you don’t check every box - <strong>high potential and curiosity matter most</strong>. We may even suggest another team if we see a better fit.</p><p style=\"min-height:1.5em\">🔖 Learn more <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and on our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a>.</p>","descriptionPlainText":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.\n\n\n⭐ BUILD THE BACKBONE OF ALAN’S FINANCIAL SYSTEMS\n\nAt Alan, billing is a platform that powers reliable, accurate, and scalable financial operations across multiple countries and products. Our mission is to turn complex, high-volume billing flows into systems that “just work,” so customers and members can focus on what matters.\n\nAs a Software Engineer on this team, you will:\n\n - Build the core billing engine: process thousands of transactions daily with precision and reliability.\n\n - Design modular, reusable billing primitives and abstractions that scale across products and regions.\n\n - Integrate seamlessly with internal systems and external payment platforms.\n\n - Automate workflows and billing schedules at scale for companies of all sizes.\n\n - Ensure invoices are accurate, reliable, and easy to manage for internal and external users.\n\n - Collaborate closely with product, design, and operations to maintain a unified, high-quality platform experience.\n\n\nWHY THIS ROLE IS SPECIAL:\n\n - Solve technically challenging problems in a mission-critical, high-scale platform.\n\n - Shape the architecture of Alan’s core financial systems and long-term product strategy.\n\n - Impact millions of members and clients, powering hassle-free experience.\n\n - Join a team obsessed with craftsmanship, scalability, and operational excellence.\n\n - Work in an environment where your ideas, designs, and decisions drive tangible outcomes.\n\n\n🛠 YOUR PLAYGROUND\n\n - Stack: Python/Flask, React, React Native, PostgreSQL.\n\n - What you’ll do: ship solutions that handle high complexity and scale across multiple countries, collaborating closely with product and design teams.\n\n - Impact: your work touches core business operations and enables hundreds of thousands of employees to benefit from Alan every day.\n\n\n👥 WHO WE’RE LOOKING FOR\n\n - We are looking for software engineers of all experience levels, ideally with backend and full-stack experience.\n\n - Passionate about building elegant solutions to support rich business logic.\n\n - Experienced in building scalable systems that handle real-world complexity.\n\n - B2B experience is a plus!\n\n - Well-versed in OOP languages (Python, Java, C#).\n\n - Fluent in English (French is a plus but not required).\n\n - Curious, self-starting, humble, collaborative, and eager to grow.\n\n\n🙌 PERKS & BENEFITS\n\n - Fair rewards & equity packages.\n\n - Flexible office & remote options.\n\n - Top-tier equipment: MacBook Pro, monitor, noise-canceling headphones.\n\n - Flexible vacation & hours.\n\n - Comprehensive healthcare for you, children, and partners.\n\n - Transport support and coaching for personal growth.\n\n - Training budget for conferences, courses, books.\n\n - Extended parental leave for all parents.\n\n\n🔄 RECRUITMENT NOTE\n\n🌟 We hire people, not roles. Don’t worry if you don’t check every box - high potential and curiosity matter most. We may even suggest another team if we see a better fit.\n\n🔖 Learn more About Alan https://alan.com/about and on our Career https://alan.com/careers pages, Medium https://medium.com/alan, blog https://blog.alan.com/ and Glassdoor page https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm.","descriptionParts":{"descriptionOpening":{"html":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul>","plain":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership."},"descriptionBody":{"html":"<h1><strong>⭐ Build the backbone of Alan’s financial systems</strong></h1><p style=\"min-height:1.5em\">At Alan, billing is a platform that powers reliable, accurate, and scalable financial operations across multiple countries and products. Our mission is to turn complex, high-volume billing flows into systems that “just work,” so customers and members can focus on what matters.</p><p style=\"min-height:1.5em\"><strong>As a Software Engineer on this team, you will:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Build the core billing engine</strong>: process thousands of transactions daily with precision and reliability.</p></li><li><p style=\"min-height:1.5em\"><strong>Design modular, reusable billing primitives</strong> and abstractions that scale across products and regions.</p></li><li><p style=\"min-height:1.5em\"><strong>Integrate seamlessly</strong> with internal systems and external payment platforms.</p></li><li><p style=\"min-height:1.5em\"><strong>Automate workflows</strong> and billing schedules at scale for companies of all sizes.</p></li><li><p style=\"min-height:1.5em\"><strong>Ensure invoices are accurate</strong>, reliable, and easy to manage for internal and external users.</p></li><li><p style=\"min-height:1.5em\"><strong>Collaborate closely</strong> with product, design, and operations to maintain a unified, high-quality platform experience.</p><p style=\"min-height:1.5em\"></p></li></ul><h2><strong>Why this role is special:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Solve technically challenging problems</strong> in a mission-critical, high-scale platform.</p></li><li><p style=\"min-height:1.5em\"><strong>Shape the architecture of Alan’s core financial systems</strong> and long-term product strategy.</p></li><li><p style=\"min-height:1.5em\"><strong>Impact millions of members and clients</strong>, powering hassle-free experience.</p></li><li><p style=\"min-height:1.5em\"><strong>Join a team obsessed with craftsmanship</strong>, scalability, and operational excellence.</p></li><li><p style=\"min-height:1.5em\"><strong>Work in an environment</strong> where your ideas, designs, and decisions drive tangible outcomes.</p></li></ul><p style=\"min-height:1.5em\"></p><h1><strong>🛠 Your playground</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Stack</strong>: Python/Flask, React, React Native, PostgreSQL.</p></li><li><p style=\"min-height:1.5em\"><strong>What you’ll do</strong>: ship solutions that handle high complexity and scale across multiple countries, collaborating closely with product and design teams.</p></li><li><p style=\"min-height:1.5em\"><strong>Impact</strong>: your work touches core business operations and enables hundreds of thousands of employees to benefit from Alan every day.</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>👥 Who we’re looking for</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">We are looking for software engineers of all experience levels, ideally with <strong>backend and full-stack experience</strong>.</p></li><li><p style=\"min-height:1.5em\">Passionate about building<strong> elegant solutions </strong>to support rich business logic.</p></li><li><p style=\"min-height:1.5em\">Experienced in building <strong>scalable systems</strong> that handle real-world complexity.</p></li><li><p style=\"min-height:1.5em\">B2B experience is a plus!</p></li><li><p style=\"min-height:1.5em\">Well-versed in <strong>OOP languages</strong> (Python, Java, C#).</p></li><li><p style=\"min-height:1.5em\"><strong>Fluent in English</strong> (French is a plus but not required).</p></li><li><p style=\"min-height:1.5em\">Curious, self-starting, humble, collaborative, and eager to grow.</p></li></ul><p style=\"min-height:1.5em\"></p><h1><strong>🙌 Perks &amp; Benefits</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Fair rewards &amp; equity</strong> packages.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible office &amp; remote options</strong>.</p></li><li><p style=\"min-height:1.5em\"><strong>Top-tier equipment</strong>: MacBook Pro, monitor, noise-canceling headphones.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible vacation &amp; hours</strong>.</p></li><li><p style=\"min-height:1.5em\"><strong>Comprehensive healthcare</strong> for you, children, and partners.</p></li><li><p style=\"min-height:1.5em\"><strong>Transport support</strong> and <strong>coaching for personal growth</strong>.</p></li><li><p style=\"min-height:1.5em\"><strong>Training budget</strong> for conferences, courses, books.</p></li><li><p style=\"min-height:1.5em\"><strong>Extended parental leave</strong> for all parents.</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>🔄 Recruitment note</strong></h1><p style=\"min-height:1.5em\">🌟 We hire people, not roles. Don’t worry if you don’t check every box - <strong>high potential and curiosity matter most</strong>. We may even suggest another team if we see a better fit.</p><p style=\"min-height:1.5em\">🔖 Learn more <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and on our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a>.</p>","plain":"⭐ BUILD THE BACKBONE OF ALAN’S FINANCIAL SYSTEMS\n\nAt Alan, billing is a platform that powers reliable, accurate, and scalable financial operations across multiple countries and products. Our mission is to turn complex, high-volume billing flows into systems that “just work,” so customers and members can focus on what matters.\n\nAs a Software Engineer on this team, you will:\n\n - Build the core billing engine: process thousands of transactions daily with precision and reliability.\n\n - Design modular, reusable billing primitives and abstractions that scale across products and regions.\n\n - Integrate seamlessly with internal systems and external payment platforms.\n\n - Automate workflows and billing schedules at scale for companies of all sizes.\n\n - Ensure invoices are accurate, reliable, and easy to manage for internal and external users.\n\n - Collaborate closely with product, design, and operations to maintain a unified, high-quality platform experience.\n\n\nWHY THIS ROLE IS SPECIAL:\n\n - Solve technically challenging problems in a mission-critical, high-scale platform.\n\n - Shape the architecture of Alan’s core financial systems and long-term product strategy.\n\n - Impact millions of members and clients, powering hassle-free experience.\n\n - Join a team obsessed with craftsmanship, scalability, and operational excellence.\n\n - Work in an environment where your ideas, designs, and decisions drive tangible outcomes.\n\n\n🛠 YOUR PLAYGROUND\n\n - Stack: Python/Flask, React, React Native, PostgreSQL.\n\n - What you’ll do: ship solutions that handle high complexity and scale across multiple countries, collaborating closely with product and design teams.\n\n - Impact: your work touches core business operations and enables hundreds of thousands of employees to benefit from Alan every day.\n\n\n👥 WHO WE’RE LOOKING FOR\n\n - We are looking for software engineers of all experience levels, ideally with backend and full-stack experience.\n\n - Passionate about building elegant solutions to support rich business logic.\n\n - Experienced in building scalable systems that handle real-world complexity.\n\n - B2B experience is a plus!\n\n - Well-versed in OOP languages (Python, Java, C#).\n\n - Fluent in English (French is a plus but not required).\n\n - Curious, self-starting, humble, collaborative, and eager to grow.\n\n\n🙌 PERKS & BENEFITS\n\n - Fair rewards & equity packages.\n\n - Flexible office & remote options.\n\n - Top-tier equipment: MacBook Pro, monitor, noise-canceling headphones.\n\n - Flexible vacation & hours.\n\n - Comprehensive healthcare for you, children, and partners.\n\n - Transport support and coaching for personal growth.\n\n - Training budget for conferences, courses, books.\n\n - Extended parental leave for all parents.\n\n\n🔄 RECRUITMENT NOTE\n\n🌟 We hire people, not roles. Don’t worry if you don’t check every box - high potential and curiosity matter most. We may even suggest another team if we see a better fit.\n\n🔖 Learn more About Alan https://alan.com/about and on our Career https://alan.com/careers pages, Medium https://medium.com/alan, blog https://blog.alan.com/ and Glassdoor page https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm."},"descriptionClosing":null},"shortDescription":null,"applicationFormDefinitionId":"5f0fc57d-0369-4a14-98db-6270fe1cc7bb","surveyFormDefinitionIds":[],"linkedData":{"@context":"https://schema.org/","@type":"JobPosting","title":"Fullstack Software Engineer (x/f/m) - Global Billing Platform","description":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experie
