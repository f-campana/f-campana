  <meta name="description" content="YOU. BETTER. WITH ALAN.

Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.

Our mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.

By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.

We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.


HOW WE WORK: OUR LEADERSHIP PRINCIPLES

 - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission&#39;s success above all else.

 - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.

 - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.

 - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.


🐼 WHO WE ARE

We’re building Mo — a health companion for everyone.

We’re a small team within Alan, on a mission to redefine the future of care by democratizing access to medical expertise. We are building Mo, an intelligent, empathetic, multimodal LLM-based conversational AI assistant able to prescribe, triage, and proactively follow up on care.

Imagine giving every person in the world instant, 24/7 access to personalised medical expertise - through chat, voice, or video. That’s what we are building 🤖.

We kicked off the project in 2023. After a strong R&amp;D phase, we’re now scaling Mo to our entire French portfolio (1M members), and then our other countries.


🐼 POWERED BY ALAN ♥️

You. Better. With Alan.

We’re part of Alan, a leading European health insurance and healthcare company. That gives us access to world-class resources: 1M+ members, 32,000+ client companies, €780M+ ARR, a talented team of 700+ people, strong positioning in AI (co-founded Mistral AI)

We benefit from Alan’s platform, infrastructure, distribution, and health expertise — but operate with the speed and focus of a startup. If you’re curious about Alan’s broader vision, our Shareholder Letters https://alan.com/en/blog/discover-alan/a/alan-2025-q3-letter-to-shareholders are worth a read.


🚀 WHAT KEEPS US UP AT NIGHT

We’re building a medical agent that works — reliably, safely, and at scale.

You’ll work at the intersection of product engineering, ML engineering, and medical expertise. Our mission is to build the most accurate and reliable medical agent in the world, while delivering an outstanding conversational experience. Things we’re working on:

 - 💬 Deliver the most memorable chatting experience — You’ll work on making Mo the obvious choice when it comes to asking a health question. It means having a world-class snappy and delightful chatting experience, blazing fast time to answer, and rich content shared.

 - 🚀 Scaling our systems to serve 100x more users — You’ll work on preparing Mo for unprecedented scale, going up to a few millions of members to serve early in 2026. You’ll work on our latency, error rate, and error recovery, as any bug makes us lose members that would have used Mo on weekly basis otherwise.

 - 🧱 Integrate Mo with all Alan services — You’ll work on integrating Mo with our other services (digital chat with HP, map of physical location of HPs, tailored prevention programs, …) to increase the value we deliver to our members.

 - ➕ Extend our architecture to support the next chapters of Mo — You’ll work on our architecture, and agentic framework, to support Mo’s next needs (get more context, use new skills, be accessible in other countries we operate in)

If you’re excited by the idea of building the future of healthcare, this is the team for you - we&#39;re at the start of the journey. If you’re curious, here https://arxiv.org/abs/2411.12808 is a paper we published recently.





🎯 IS IT YOU WE’RE LOOKING FOR?

We benefit from Alan’s platform, infrastructure, distribution, and health expertise — but operate with the speed and focus of a startup. If you’re curious about Alan’s broader vision, our https://www.notion.so/alaninsuranceShareholder Letters https://alan.com/en/blog/discover-alan/a/alan-2025-q3-letter-to-shareholders are worth a read.

We’re looking for Product engineers with 3+ years of experience and mobile expertise who get excited about building state-of-the-art AI systems and applying them to real-world, high-stakes problems in healthcare.

 - You’ll work at the frontier of LLMs, multi-agent architectures, and human-in-the-loop learning — and see your work deployed in production, helping real people.

 - You’ll implement new capabilities for Mo, working across engineering, data, and medical expertise

 - You’ll continuously refine our mobile experience, so that chatting with Mo remains snappy, delightful, and memorable

 - You’ll have significant influence on system architecture and code quality

 - You’ll mentor engineers, contribute to our product &amp; engineering culture, and help build the team (including participating in hiring, shaping our interview loops, etc.).

You would be a good fit at Alan if most of this sounds like you:

 - Strong background in software engineering, with a spike in mobile development.

 - Experience with traditional ML, or LLMs, or ML dev ops is a big plus

 - Product-minded: you want your solutions to be used, and impactful

 - Self-directed and pragmatic

 - Humble and still willing to grow (no matter your seniority!)

 - Collaborative, enthusiastic about teamwork, learning, and teaching

 - Fluent in English (no need to speak French!)

But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.

For this opportunity, we are aiming to hire within the C1-E level range.


🤘 HOW WE DO IT ?

People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values https://alan.com/about/company-culture that guide our approach to work, such as:

🎯 What drives us — We&#39;re obsessed with helping our members live healthier

Mission is the Boss: long-term thinking, seeking our mission success above all else.

Member &amp; customer-led: obsessively focused on solving members &amp; customers problems and creating the most delightful experiences.


🏆 How we build excellence — We hire the best people and give them platform to succeed

Champions of excellence: extremely high standards and talent density.

Distributed ownership: accountable enlightened despots, everyone owns their decisions and results.

Radically transparent: all information is accessible and written-first, so everyone can make the best decisions asynchronously


🤝 How we grow together — We help each other improve through honest feedback and bold thinking

Optimistic alchemy: optimists who collaborate with genuine care and support teammates.

Empathetic challengers: direct, caring feedback combined with praises to help each other grow professionally

Bold &amp; creative contrarians: think differently to achieve greatness, try new approaches


⚡ How we move fast — We fight complexity and focus on what matters most

Disciplined in execution: taking decisive actions with focus that compounds success over time

Fight for simplicity: only high impact processes, smart frugality


🙌 PERKS &amp; BENEFITS https://alan.com/en/careers/a/salary-equity

At Alan, we believe that being in good health is a basic need, and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.

Therefore, we offer:

 - Fair rewards. Generous equity packages complement your base salary.

 - Flexible Office. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.

 - All the tools you need. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and noise-canceling headphones.

 - Flexible vacation policy and flexible working hours. Organize your time as you wish.

 - Delightful healthcare insurance: Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country (permanent contracts only).

 - Transport. Country-specific commuter benefits.

 - Learning &amp; Training opportunities. A highly flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.

 - Personal growth through coaching: At Alan, coaching isn&#39;t just a perk - it&#39;s core to who we are. Every Alaner is paired with a dedicated coach from day one, who helps maximize their impact, nurture engagement, and navigate Alan&#39;s values to develop their full potential. Learn more about our coaching culture https://alan.com/en/blog/discover-alan/a/alan-culture-excellence-through-coaching.

 - Parental leave. Extended parental leave for all new parents.


IMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.

If you&#39;re excited about this opportunity but don&#39;t check every box, we&#39;d love to hear from you. Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.

If you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?

Remember, this is just a guide, not a checklist.

We&#39;ll be thrilled to receive your application!

🔖 Check out our About Alan https://alan.com/about and Career https://alan.com/careers pages, as well as our Medium https://medium.com/alan, blog https://blog.alan.com/ and Glassdoor page https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm for more info.

🔄 A quick note about the process

><strong>🎯 Is it you we’re looking for?</strong></h1><p style=\"min-height:1.5em\"><strong>We benefit from Alan’s platform</strong>, infrastructure, distribution, and health expertise — <strong>but</strong> <strong>operate with the speed and focus of a startup.</strong> If you’re curious about Alan’s broader vision, our<a target=\"_blank\" rel=\"noopener noreferrer\" class=\"notion-link-token notion-focusable-token notion-enable-hover\" href=\"https://www.notion.so/alaninsurance\"><u> </u></a><a target=\"_blank\" rel=\"noopener noreferrer\" class=\"notion-link-token notion-focusable-token notion-enable-hover\" href=\"https://alan.com/en/blog/discover-alan/a/alan-2025-q3-letter-to-shareholders\"><u>Shareholder Letters</u></a> are worth a read.</p><p style=\"min-height:1.5em\">We’re looking for <strong>Product engineers</strong> with <strong>3+ years of experience and mobile expertise</strong> who get excited about building state-of-the-art AI systems and applying them to <strong>real-world, high-stakes problems in healthcare</strong>.</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You’ll work at the frontier of LLMs, multi-agent architectures, and human-in-the-loop learning — and see your work deployed in production, helping real people.</p></li><li><p style=\"min-height:1.5em\">You’ll implement new capabilities for Mo, working across engineering, data, and medical expertise</p></li><li><p style=\"min-height:1.5em\">You’ll continuously refine our mobile experience, so that chatting with Mo remains snappy, delightful, and memorable</p></li><li><p style=\"min-height:1.5em\">You’ll have significant influence on system architecture and code quality</p></li><li><p style=\"min-height:1.5em\">You’ll mentor engineers, contribute to our product &amp; engineering culture, and help build the team (including participating in hiring, shaping our interview loops, etc.).</p></li></ul><p style=\"min-height:1.5em\"><strong>You would be a good fit at Alan if most of this sounds like you:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Strong background in software engineering, with a spike in mobile development.</p></li><li><p style=\"min-height:1.5em\">Experience with traditional ML, or LLMs, or ML dev ops is a big plus</p></li><li><p style=\"min-height:1.5em\">Product-minded: you want your solutions to be used, and impactful</p></li><li><p style=\"min-height:1.5em\">Self-directed and pragmatic</p></li><li><p style=\"min-height:1.5em\">Humble and still willing to grow (no matter your seniority!)</p></li><li><p style=\"min-height:1.5em\">Collaborative, enthusiastic about teamwork, learning, and teaching</p></li><li><p style=\"min-height:1.5em\">Fluent in English (no need to speak French!)</p></li></ul><p style=\"min-height:1.5em\">But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.</p><p style=\"min-height:1.5em\">For this opportunity, we are aiming to hire within the C1-E level range.</p><p style=\"min-height:1.5em\"></p><h1><strong>🤘 How we do it ?</strong></h1><p style=\"min-height:1.5em\">People joining Alan are often surprised and delighted by our innovative working method. We have a set of <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about/company-culture\">cultural values</a> that guide our approach to work, such as:</p><p style=\"min-height:1.5em\"><strong>🎯 What drives us — We're obsessed with helping our members live healthier</strong></p><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong>: long-term thinking, seeking our mission success above all else.</p><p style=\"min-height:1.5em\"><strong>Member &amp; customer-led: </strong>obsessively focused on solving members &amp; customers problems and creating the most delightful experiences.</p><p style=\"min-height:1.5em\"><br /><strong>🏆 How we build excellence — We hire the best people and give them platform to succeed</strong></p><p style=\"min-height:1.5em\"><strong>Champions of excellence:</strong> extremely high standards and talent density.</p><p style=\"min-height:1.5em\"><strong>Distributed ownership:</strong> accountable enlightened despots, everyone owns their decisions and results.</p><p style=\"min-height:1.5em\"><strong>Radically transparent</strong>: all information is accessible and written-first, so everyone can make the best decisions asynchronously</p><p style=\"min-height:1.5em\"><br />🤝<strong> How we grow together — We help each other improve through honest feedback and bold thinking</strong></p><p style=\"min-height:1.5em\"><strong>Optimistic alchemy:</strong> optimists who collaborate with genuine care and support teammates.</p><p style=\"min-height:1.5em\"><strong>Empathetic challengers: </strong>direct, caring feedback combined with praises to help each other grow professionally</p><p style=\"min-height:1.5em\"><strong>Bold &amp; creative contrarians: </strong>think differently to achieve greatness, try new approaches</p><p style=\"min-height:1.5em\"><br />⚡<strong> How we move fast — We fight complexity and focus on what matters most</strong></p><p style=\"min-height:1.5em\"><strong>Disciplined in execution: </strong>taking decisive actions with focus that compounds success over time</p><p style=\"min-height:1.5em\"><strong>Fight for simplicity: </strong>only high impact processes, smart frugality</p><p style=\"min-height:1.5em\"></p><h1>🙌   <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/salary-equity\">Perks &amp; Benefits</a></h1><p style=\"min-height:1.5em\">At Alan, we believe that <strong>being in good health is a basic need,</strong> and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are <strong>happy, efficient and spend only high-quality time</strong> with co-workers. </p><p style=\"min-height:1.5em\"><strong>Therefore, we offer:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Fair rewards</strong>. Generous equity packages complement your base salary.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible Office</strong>. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.</p></li><li><p style=\"min-height:1.5em\"><strong>All the tools you need</strong>. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and noise-canceling headphones.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible vacation policy and flexible working hours</strong>. Organize your  time as you  wish.</p></li><li><p style=\"min-height:1.5em\"><strong>Delightful healthcare insurance:</strong> Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country<em> (permanent contracts only)</em>.</p></li><li><p style=\"min-height:1.5em\"><strong>Transport</strong>. Country-specific commuter benefits.</p></li><li><p style=\"min-height:1.5em\"><strong>Learning &amp; Training opportunities.</strong> A highly  flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.</p></li><li><p style=\"min-height:1.5em\"><strong>Personal growth through coaching</strong>: At Alan, coaching isn't just a perk -<strong> </strong>it's core to who we are. Every Alaner is paired with a dedicated coach from day one, who helps maximize their impact, nurture engagement, and navigate Alan's values to develop their full potential.<strong> </strong><a target=\"_blank\" rel=\"noopener noreferrer\" class=\"notion-link-token notion-focusable-token notion-enable-hover\" href=\"https://alan.com/en/blog/discover-alan/a/alan-culture-excellence-through-coaching\"><strong>Learn more about our coaching culture</strong></a><strong>.</strong></p></li><li><p style=\"min-height:1.5em\"><strong>Parental leave.</strong> Extended parental leave for all new parents.</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>Important note: we hire people, not roles.</strong></h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you.</strong> Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process</strong><br /><em>Note: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link\"><em>here</em></a><em>. </em></p>","directApply":true,"identifier":{"@type":"PropertyValue","name":"Alan","value":"dea1cc7f-07ed-4f3b-bf21-8d1e473d6ade"},"datePosted":"2026-02-11","hiringOrganization":{"@type":"Organization","name":"Alan","sameAs":"https://alan.com/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/16fb5c4f-12a4-4e77-a698-3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b8987509-72b3-449b-8d58-1af70771e1e8.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"France"}},"employmentType":"FULL_TIME","jobLocationType":"TELECOMMUTE","applicantLocationRequirements":{"@type":"Country","name":"France"}}</script>

3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b6f2a2f2-490b-4305-84f3-0f986d70ef14.png","logoSquareImageUrl":"https://app.ashbyhq.com/api/images/org-theme-logo/16fb5c4f-12a4-4e77-a698-3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b8987509-72b3-449b-8d58-1af70771e1e8.png","applicationSubmittedSuccessMessage":"Your application was successfully submitted. We'll contact shortly. Thank you!","jobBoardTopDescriptionHtml":"<p style=\"min-height:1.5em\"><strong>You. Better. With Alan. </strong><br /><br />Alan's vision is to make <strong>prevention the new norm</strong> of care for all.<br />‭<br />Alan's mission is to <strong>help people live in good health to 100</strong> while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p>","jobBoardBottomDescriptionHtml":"<h2><strong>Important note: we hire people, not roles.</strong></h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you.</strong> Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p>","jobPostingBackUrl":null},"appConfirmationTrackingPixelHtml":null,"recruitingPrivacyPolicyUrl":"https://alan.com/candidate-privacy","timezone":"Europe/Paris","candidateScheduleCancellationReasonRequirementStatus":"Off"},"posting":{"id":"dea1cc7f-07ed-4f3b-bf21-8d1e473d6ade","title":"Mobile Software Engineer (x/f/m) - AI Health Companion","updatedAt":"2026-02-11T09:03:11.471Z","departmentName":"Engineering","departmentExternalName":"Engineering","teamName":"Engineering","teamExternalName":"Engineering","teamNames":["Engineering"],"locationName":"Paris, France","locationExternalName":"Paris, France","isListed":true,"suppressDescriptionOpening":false,"suppressDescriptionClosing":false,"descriptionHtml":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul><h1><strong>🐼 Who we are</strong></h1><p style=\"min-height:1.5em\"><strong>We’re building Mo — a health companion for everyone.</strong></p><p style=\"min-height:1.5em\">We’re a small team within Alan, on a mission to redefine the future of care by <strong>democratizing access to medical expertise</strong>. We are building <strong>Mo,</strong> an intelligent, empathetic, multimodal <strong>LLM-based conversational AI assistant able</strong> to <strong>prescribe, triage, and proactively follow up</strong> on care.</p><p style=\"min-height:1.5em\">Imagine giving every person in the world <strong>instant, 24/7 access to personalised medical expertise</strong> - through chat, voice, or video. That’s what we are building 🤖.</p><p style=\"min-height:1.5em\">We kicked off the project in 2023. After a strong R&amp;D phase, we’re now scaling Mo to our entire French portfolio (1M members), and then our other countries.</p><p style=\"min-height:1.5em\"></p><h1><strong>🐼 Powered by Alan ♥️</strong></h1><p style=\"min-height:1.5em\"><strong>You. Better. With Alan.</strong></p><p style=\"min-height:1.5em\">We’re part of Alan, a leading European health insurance and healthcare company. That gives us access to world-class resources: <strong>1M+ members</strong>, <strong>32,000+ client companies</strong>, <strong>€780M+ ARR</strong>, a talented team of <strong>700+ people</strong>, strong positioning in AI (co-founded Mistral AI)</p><p style=\"min-height:1.5em\"><strong>We benefit from Alan’s platform</strong>, infrastructure, distribution, and health expertise — <strong>but</strong> <strong>operate with the speed and focus of a startup.</strong> If you’re curious about Alan’s broader vision, our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/blog/discover-alan/a/alan-2025-q3-letter-to-shareholders\">Shareholder Letters</a> are worth a read.</p><p style=\"min-height:1.5em\"></p><h1><strong>🚀 What keeps us up at night</strong></h1><p style=\"min-height:1.5em\">We’re building a medical agent that works — <strong>reliably, safely, and at scale</strong>.</p><p style=\"min-height:1.5em\">You’ll work at the <strong>intersection of product engineering, ML engineering, and medical expertise</strong>. Our mission is to <strong>build the most accurate and reliable medical agent in the world</strong>, while delivering an <strong>outstanding conversational experience</strong>. Things we’re working on:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">💬 <strong>Deliver the most memorable chatting experience</strong> — You’ll work on making Mo the obvious choice when it comes to asking a health question. It means having a world-class snappy and delightful chatting experience, blazing fast time to answer, and rich content shared.</p></li><li><p style=\"min-height:1.5em\">🚀 <strong>Scaling our systems to serve 100x more users</strong> — You’ll work on preparing Mo for unprecedented scale, going up to a few millions of members to serve early in 2026. You’ll work on our latency, error rate, and error recovery, as any bug makes us lose members that would have used Mo on weekly basis otherwise.</p></li><li><p style=\"min-height:1.5em\">🧱 <strong>Integrate Mo with all Alan services —</strong> You’ll work on integrating Mo with our other services (digital chat with HP, map of physical location of HPs, tailored prevention programs, …) to increase the value we deliver to our members.</p></li><li><p style=\"min-height:1.5em\">➕ <strong>Extend our architecture to support the next chapters</strong> <strong>of Mo</strong> — You’ll work on our architecture, and agentic framework, to support Mo’s next needs (get more context, use new skills, be accessible in other countries we operate in)</p></li></ul><p style=\"min-height:1.5em\">If you’re excited by the idea of building the future of healthcare, this is the team for you - we're at the start of the journey. If you’re curious, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://arxiv.org/abs/2411.12808\">here</a> is a paper we published recently.</p><h1> </h1><h1><strong>🎯 Is it you we’re looking for?</strong></h1><p style=\"min-height:1.5em\"><strong>We benefit from Alan’s platform</strong>, infrastructure, distribution, and health expertise — <strong>but</strong> <strong>operate with the speed and focus of a startup.</strong> If you’re curious about Alan’s broader vision, our<a target=\"_blank\" rel=\"noopener noreferrer\" class=\"notion-link-token notion-focusable-token notion-enable-hover\" href=\"https://www.notion.so/alaninsurance\"><u> </u></a><a target=\"_blank\" rel=\"noopener noreferrer\" class=\"notion-link-token notion-focusable-token notion-enable-hover\" href=\"https://alan.com/en/blog/discover-alan/a/alan-2025-q3-letter-to-shareholders\"><u>Shareholder Letters</u></a> are worth a read.</p><p style=\"min-height:1.5em\">We’re looking for <strong>Product engineers</strong> with <strong>3+ years of experience and mobile expertise</strong> who get excited about building state-of-the-art AI systems and applying them to <strong>real-world, high-stakes problems in healthcare</strong>.</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You’ll work at the frontier of LLMs, multi-agent architectures, and human-in-the-loop learning — and see your work deployed in production, helping real people.</p></li><li><p style=\"min-height:1.5em\">You’ll implement new capabilities for Mo, working across engineering, data, and medical expertise</p></li><li><p style=\"min-height:1.5em\">You’ll continuously refine our mobile experience, so that chatting with Mo remains snappy, delightful, and memorable</p></li><li><p style=\"min-height:1.5em\">You’ll have significant influence on system architecture and code quality</p></li><li><p style=\"min-height:1.5em\">You’ll mentor engineers, contribute to our product &amp; engineering culture, and help build the team (including participating in hiring, shaping our interview loops, etc.).</p></li></ul><p style=\"min-height:1.5em\"><strong>You would be a good fit at Alan if most of this sounds like you:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Strong background in software engineering, with a spike in mobile development.</p></li><li><p style=\"min-height:1.5em\">Experience with traditional ML, or LLMs, or ML dev ops is a big plus</p></li><li><p style=\"min-height:1.5em\">Product-minded: you want your solutions to be used, and impactful</p></li><li><p style=\"min-height:1.5em\">Self-directed and pragmatic</p></li><li><p style=\"min-height:1.5em\">Humble and still willing to grow (no matter your seniority!)</p></li><li><p style=\"min-height:1.5em\">Collaborative, enthusiastic about teamwork, learning, and teaching</p></li><li><p style=\"min-height:1.5em\">Fluent in English (no need to speak French!)</p></li></ul><p style=\"min-height:1.5em\">But above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.</p><p style=\"min-height:1.5em\">For this opportunity, we are aiming to hire within the C1-E level range.</p><p style=\"min-height:1.5em\"></p><h1><strong>🤘 How we do it ?</strong></h1><p style=\"min-height:1.5em\">People joining Alan are often surprised and delighted by our innovative working method. We have a set of <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about/company-culture\">cultural values</a> that guide our approach to work, such as:</p><p style=\"min-height:1.5em\"><strong>🎯 What drives us — We're obsessed with helping our members live healthier</strong></p><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong>: long-term thinking, seeking our mission success above all else.</p><p style=\"min-height:1.5em\"><strong>Member &amp; customer-led: </strong>obsessively focused on solving members &amp; customers problems and creating the most delightful experiences.</p><p style=\"min-height:1.5em\"><br /><strong>🏆 How we build excellence — We hire the best people and give them platform to succeed</strong></p><p style=\"min-height:1.5em\"><strong>Champions of excellence:</strong> extremely high standards and talent density.</p><p style=\"min-height:1.5em\"><strong>Distributed ownership:</strong> accountable enlightened despots, everyone owns their decisions and results.</p><p style=\"min-height:1.5em\"><strong>Radically transparent</strong>: all information is accessible and written-first, so everyone can make the best decisions asynchronously</p><p style=\"min-height:1.5em\"><br />🤝<strong> How we grow together — We help each other improve through honest feedback and bold thinking</strong></p><p style=\"min-height:1.5em\"><strong>Optimistic alchemy:</strong> optimists who collaborate with genuine care and support teammates.</p><p style=\"min-height:1.5em\"><strong>Empathetic challengers: </strong>direct, caring feedback combined with praises to help each other grow professionally</p><p style=\"min-height:1.5em\"><strong>Bold &amp; creative contrarians: </strong>think differently to achieve greatness, try new approaches</p><p style=\"min-height:1.5em\"><br />⚡<strong> How we move fast — We fight complexity and focus on what matters most</strong></p><p style=\"min-height:1.5em\"><strong>Disciplined in execution: </strong>taking decisive actions with focus that compounds success over time</p><p style=\"min-height:1.5em\"><strong>Fight for simplicity: </strong>only high impact processes, smart frugality</p><p style=\"min-height:1.5em\"></p><h1>🙌   <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/salary-equity\">Perks &amp; Benefits</a></h1><p style=\"min-height:1.5em\">At Alan, we believe that <strong>being in good health is a basic need,</strong> and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are <strong>happy, efficient and spend only high-quality time</strong> with co-workers. </p><p style=\"min-height:1.5em\"><strong>Therefore, we offer:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Fair rewards</strong>. Generous equity packages complement your base salary.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible Office</strong>. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.</p></li><li><p style=\"min-height:1.5em\"><strong>All the tools you need</strong>. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and noise-canceling headphones.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible vacation policy and flexible working hours</strong>. Organize your  time as you  wish.</p></li><li><p style=\"min-height:1.5em\"><strong>Delightful healthcare insurance:</strong> Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country<em> (permanent contracts only)</em>.</p></li><li><p style=\"min-height:1.5em\"><strong>Transport</strong>. Country-specific commuter benefits.</p></li><li><p style=\"min-height:1.5em\"><strong>Learning &amp; Training opportunities.</strong> A highly  flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.</p></li><li><p style=\"min-height:1.5em\"><strong>Personal growth through coaching</strong>: At Alan, coaching isn't just a perk -<strong> </strong>it's core to who we are. Every Alaner is paired with a dedicated coach from day one, who helps maximize their impact, nurture engagement, and navigate Alan's values to develop their full potential.<strong> </strong><a target=\"_blank\" rel=\"noopener noreferrer\" class=\"notion-link-token notion-focusable-token notion-enable-hover\" href=\"https://alan.com/en/blog/discover-alan/a/alan-culture-excellence-through-coaching\"><strong>Learn more about our coaching culture</strong></a><strong>.</strong></p></li><li><p style=\"min-height:1.5em\"><strong>Parental leave.</strong> Extended parental leave for all new parents.</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>Important note: we hire people, not roles.</strong></h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you.</strong> Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process</strong><br /><em>Note: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link\"><em>here</em></a><em>. </em></p>","descriptionPlainText":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.\n\n\n🐼 WHO WE ARE\n\nWe’re building Mo — a health companion for everyone.\n\nWe’re a small team within Alan, on a mission to redefine the future of care by democratizing access to medical expertise. We are building Mo, an intelligent, empathetic, multimodal LLM-based conversational AI assistant able to prescribe, triage, and proactively follow up on care.\n\nImagine giving every person in the world instant, 24/7 access to personalised medical expertise - through chat, voice, or video. That’s what we are building 🤖.\n\nWe kicked off the project in 2023. After a strong R&D phase, we’re now scaling Mo to our entire French portfolio (1M members), and then our other countries.\n\n\n🐼 POWERED BY ALAN ♥️\n\nYou. Better. With Alan.\n\nWe’re part of Alan, a leading European health insurance and healthcare company. That gives us access to world-class resources: 1M+ members, 32,000+ client companies, €780M+ ARR, a talented team of 700+ people, strong positioning in AI (co-founded Mistral AI)\n\nWe benefit from Alan’s platform, infrastructure, distribution, and health expertise — but operate with the speed and focus of a startup. If you’re curious about Alan’s broader vision, our Shareholder Letters https://alan.com/en/blog/discover-alan/a/alan-2025-q3-letter-to-shareholders are worth a read.\n\n\n🚀 WHAT KEEPS US UP AT NIGHT\n\nWe’re building a medical agent that works — reliably, safely, and at scale.\n\nYou’ll work at the intersection of product engineering, ML engineering, and medical expertise. Our mission is to build the most accurate and reliable medical agent in the world, while delivering an outstanding conversational experience. Things we’re working on:\n\n - 💬 Deliver the most memorable chatting experience — You’ll work on making Mo the obvious choice when it comes to asking a health question. It means having a world-class snappy and delightful chatting experience, blazing fast time to answer, and rich content shared.\n\n - 🚀 Scaling our systems to serve 100x more users — You’ll work on preparing Mo for unprecedented scale, going up to a few millions of members to serve early in 2026. You’ll work on our latency, error rate, and error recovery, as any bug makes us lose members that would have used Mo on weekly basis otherwise.\n\n - 🧱 Integrate Mo with all Alan services — You’ll work on integrating Mo with our other services (digital chat with HP, map of physical location of HPs, tailored prevention programs, …) to increase the value we deliver to our members.\n\n - ➕ Extend our architecture to support the next chapters of Mo — You’ll work on our architecture, and agentic framework, to support Mo’s next needs (get more context, use new skills, be accessible in other countries we operate in)\n\nIf you’re excited by the idea of building the future of healthcare, this is the team for you - we're at the start of the journey. If you’re curious, here https://arxiv.org/abs/2411.12808 is a paper we published recently.\n\n\n\n\n\n🎯 IS IT YOU WE’RE LOOKING FOR?\n\nWe benefit from Alan’s platform, infrastructure, distribution, and health expertise — but operate with the speed and focus of a startup. If you’re curious about Alan’s broader vision, our https://www.notion.so/alaninsuranceShareholder Letters https://alan.com/en/blog/discover-alan/a/alan-2025-q3-letter-to-shareholders are worth a read.\n\nWe’re looking for Product engineers with 3+ years of experience and mobile expertise who get excited about building state-of-the-art AI systems and applying them to real-world, high-stakes problems in healthcare.\n\n - You’ll work at the frontier of LLMs, multi-agent architectures, and human-in-the-loop learning — and see your work deployed in production, helping real people.\n\n - You’ll implement new capabilities for Mo, working across engineering, data, and medical expertise\n\n - You’ll continuously refine our mobile experience, so that chatting with Mo remains snappy, delightful, and memorable\n\n - You’ll have significant influence on system architecture and code quality\n\n - You’ll mentor engineers, contribute to our product & engineering culture, and help build the team (including participating in hiring, shaping our interview loops, etc.).\n\nYou would be a good fit at Alan if most of this sounds like you:\n\n - Strong background in software engineering, with a spike in mobile development.\n\n - Experience with traditional ML, or LLMs, or ML dev ops is a big plus\n\n - Product-minded: you want your solutions to be used, and impactful\n\n - Self-directed and pragmatic\n\n - Humble and still willing to grow (no matter your seniority!)\n\n - Collaborative, enthusiastic about teamwork, learning, and teaching\n\n - Fluent in English (no need to speak French!)\n\nBut above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.\n\nFor this opportunity, we are aiming to hire within the C1-E level range.\n\n\n🤘 HOW WE DO IT ?\n\nPeople joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values https://alan.com/about/company-culture that guide our approach to work, such as:\n\n🎯 What drives us — We're obsessed with helping our members live healthier\n\nMission is the Boss: long-term thinking, seeking our mission success above all else.\n\nMember & customer-led: obsessively focused on solving members & customers problems and creating the most delightful experiences.\n\n\n🏆 How we build excellence — We hire the best people and give them platform to succeed\n\nChampions of excellence: extremely high standards and talent density.\n\nDistributed ownership: accountable enlightened despots, everyone owns their decisions and results.\n\nRadically transparent: all information is accessible and written-first, so everyone can make the best decisions asynchronously\n\n\n🤝 How we grow together — We help each other improve through honest feedback and bold thinking\n\nOptimistic alchemy: optimists who collaborate with genuine care and support teammates.\n\nEmpathetic challengers: direct, caring feedback combined with praises to help each other grow professionally\n\nBold & creative contrarians: think differently to achieve greatness, try new approaches\n\n\n⚡ How we move fast — We fight complexity and focus on what matters most\n\nDisciplined in execution: taking decisive actions with focus that compounds success over time\n\nFight for simplicity: only high impact processes, smart frugality\n\n\n🙌 PERKS & BENEFITS https://alan.com/en/careers/a/salary-equity\n\nAt Alan, we believe that being in good health is a basic need, and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\nTherefore, we offer:\n\n - Fair rewards. Generous equity packages complement your base salary.\n\n - Flexible Office. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.\n\n - All the tools you need. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and noise-canceling headphones.\n\n - Flexible vacation policy and flexible working hours. Organize your time as you wish.\n\n - Delightful healthcare insurance: Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country (permanent contracts only).\n\n - Transport. Country-specific commuter benefits.\n\n - Learning & Training opportunities. A highly flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.\n\n - Personal growth through coaching: At Alan, coaching isn't just a perk - it's core to who we are. Every Alaner is paired with a dedicated coach from day one, who helps maximize their impact, nurture engagement, and navigate Alan's values to develop their full potential. Learn more about our coaching culture https://alan.com/en/blog/discover-alan/a/alan-culture-excellence-through-coaching.\n\n - Parental leave. Extended parental leave for all new parents.\n\n\nIMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.\n\nIf you're excited about this opportunity but don't check every box, we'd love to hear from you. Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.\n\nIf you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?\n\nRemember, this is just a guide, not a checklist.\n\nWe'll be thrilled to receive your application!\n\n🔖 Check out our About Alan https://alan.com/about and Career https://alan.com/careers pages, as well as our Medium https://medium.com/alan, blog https://blog.alan.com/ and Glassdoor page https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm for more info.\n\n🔄 A quick note about the process\nNote: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link.","descriptionParts":{"descriptionOpening":{"html":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul>","plain":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take ris sdoor page</a> for more info.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process</strong><br /><em>Note: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link\"><em>here</em></a><em>. </em></p>","plain":"🐼 WHO WE ARE\n\nWe’re building Mo — a health companion for everyone.\n\nWe’re a small team within Alan, on a mission to redefine the future of care by democratizing access to medical expertise. We are building Mo, an intelligent, empathetic, multimodal LLM-based conversational AI assistant able to prescribe, triage, and proactively follow up on care.\n\nImagine giving every person in the world instant, 24/7 access to personalised medical expertise - through chat, voice, or video. That’s what we are building 🤖.\n\nWe kicked off the project in 2023. After a strong R&D phase, we’re now scaling Mo to our entire French portfolio (1M members), and then our other countries.\n\n\n🐼 POWERED BY ALAN ♥️\n\nYou. Better. With Alan.\n\nWe’re part of Alan, a leading European health insurance and healthcare company. That gives us access to world-class resources: 1M+ members, 32,000+ client companies, €780M+ ARR, a talented team of 700+ people, strong positioning in AI (co-founded Mistral AI)\n\nWe benefit from Alan’s platform, infrastructure, distribution, and health expertise — but operate with the speed and focus of a startup. If you’re curious about Alan’s broader vision, our Shareholder Letters https://alan.com/en/blog/discover-alan/a/alan-2025-q3-letter-to-shareholders are worth a read.\n\n\n🚀 WHAT KEEPS US UP AT NIGHT\n\nWe’re building a medical agent that works — reliably, safely, and at scale.\n\nYou’ll work at the intersection of product engineering, ML engineering, and medical expertise. Our mission is to build the most accurate and reliable medical agent in the world, while delivering an outstanding conversational experience. Things we’re working on:\n\n - 💬 Deliver the most memorable chatting experience — You’ll work on making Mo the obvious choice when it comes to asking a health question. It means having a world-class snappy and delightful chatting experience, blazing fast time to answer, and rich content shared.\n\n - 🚀 Scaling our systems to serve 100x more users — You’ll work on preparing Mo for unprecedented scale, going up to a few millions of members to serve early in 2026. You’ll work on our latency, error rate, and error recovery, as any bug makes us lose members that would have used Mo on weekly basis otherwise.\n\n - 🧱 Integrate Mo with all Alan services — You’ll work on integrating Mo with our other services (digital chat with HP, map of physical location of HPs, tailored prevention programs, …) to increase the value we deliver to our members.\n\n - ➕ Extend our architecture to support the next chapters of Mo — You’ll work on our architecture, and agentic framework, to support Mo’s next needs (get more context, use new skills, be accessible in other countries we operate in)\n\nIf you’re excited by the idea of building the future of healthcare, this is the team for you - we're at the start of the journey. If you’re curious, here https://arxiv.org/abs/2411.12808 is a paper we published recently.\n\n\n\n\n\n🎯 IS IT YOU WE’RE LOOKING FOR?\n\nWe benefit from Alan’s platform, infrastructure, distribution, and health expertise — but operate with the speed and focus of a startup. If you’re curious about Alan’s broader vision, our https://www.notion.so/alaninsuranceShareholder Letters https://alan.com/en/blog/discover-alan/a/alan-2025-q3-letter-to-shareholders are worth a read.\n\nWe’re looking for Product engineers with 3+ years of experience and mobile expertise who get excited about building state-of-the-art AI systems and applying them to real-world, high-stakes problems in healthcare.\n\n - You’ll work at the frontier of LLMs, multi-agent architectures, and human-in-the-loop learning — and see your work deployed in production, helping real people.\n\n - You’ll implement new capabilities for Mo, working across engineering, data, and medical expertise\n\n - You’ll continuously refine our mobile experience, so that chatting with Mo remains snappy, delightful, and memorable\n\n - You’ll have significant influence on system architecture and code quality\n\n - You’ll mentor engineers, contribute to our product & engineering culture, and help build the team (including participating in hiring, shaping our interview loops, etc.).\n\nYou would be a good fit at Alan if most of this sounds like you:\n\n - Strong background in software engineering, with a spike in mobile development.\n\n - Experience with traditional ML, or LLMs, or ML dev ops is a big plus\n\n - Product-minded: you want your solutions to be used, and impactful\n\n - Self-directed and pragmatic\n\n - Humble and still willing to grow (no matter your seniority!)\n\n - Collaborative, enthusiastic about teamwork, learning, and teaching\n\n - Fluent in English (no need to speak French!)\n\nBut above all, we are looking for high potential and curiosity: make sure to show us this when you apply! Everything else is a bonus.\n\nFor this opportunity, we are aiming to hire within the C1-E level range.\n\n\n🤘 HOW WE DO IT ?\n\nPeople joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values https://alan.com/about/company-culture that guide our approach to work, such as:\n\n🎯 What drives us — We're obsessed with helping our members live healthier\n\nMission is the Boss: long-term thinking, seeking our mission success above all else.\n\nMember & customer-led: obsessively focused on solving members & customers problems and creating the most delightful experiences.\n\n\n🏆 How we build excellence — We hire the best people and give them platform to succeed\n\nChampions of excellence: extremely high standards and talent density.\n\nDistributed ownership: accountable enlightened despots, everyone owns their decisions and results.\n\nRadically transparent: all information is accessible and written-first, so everyone can make the best decisions asynchronously\n\n\n🤝 How we grow together — We help each other improve through honest feedback and bold thinking\n\nOptimistic alchemy: optimists who collaborate with genuine care and support teammates.\n\nEmpathetic challengers: direct, caring feedback combined with praises to help each other grow professionally\n\nBold & creative contrarians: think differently to achieve greatness, try new approaches\n\n\n⚡ How we move fast — We fight complexity and focus on what matters most\n\nDisciplined in execution: taking decisive actions with focus that compounds success over time\n\nFight for simplicity: only high impact processes, smart frugality\n\n\n🙌 PERKS & BENEFITS https://alan.com/en/careers/a/salary-equity\n\nAt Alan, we believe that being in good health is a basic need, and it starts with our employees. This is why Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\nTherefore, we offer:\n\n - Fair rewards. Generous equity packages complement your base salary.\n\n - Flexible Office. Amazing office space at our HQ, sponsored co-working hubs or a full-remote experience with home office equipment sponsorship, we want you to live where you’re the happiest.\n\n - All the tools you need. Top of the range equipment: Macbook Pro, keyboard, laptop stand, monitor, and noise-canceling headphones.\n\n - Flexible vacation policy and flexible working hours. Organize your time as you wish.\n\n - Delightful healthcare insurance: Extremely comprehensive health insurance - 100% for you and your children, 90-100% for partners depending on your country (permanent contracts only).\n\n - Transport. Country-specific commuter benefits.\n\n - Learning & Training opportunities. A highly flexible Training policy free books and budget to attend and speak at conferences if the opportunity arises.\n\n - Personal growth through coaching: At Alan, coaching isn't just a perk - it's core to who we are. Every Alaner is paired with a dedicated coach from day one, who helps maximize their impact, nurture engagement, and navigate Alan's values to develop their full potential. Learn more about our coaching culture https://alan.com/en/blog/discover-alan/a/alan-culture-excellence-through-coaching.\n\n - Parental leave. Extended parental leave for all new parents.\n\n\nIMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.\n\nIf you're excited about this opportunity but don't check every box, we'd love to hear from you. Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.\n\nIf you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?\n\nRemember, this is just a guide, not a checklist.\n\nWe'll be thrilled to receive your application!\n\n🔖 Check out our About Alan https://alan.com/about and Career https://alan.com/careers pages, as well as our Medium https://medium.com/alan, blog https://blog.alan.com/ and Glassdoor page https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm for more info.\n\n🔄 A quick note about the process\nNote: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link."},"descriptionClosing":null},"shortDescription":null,"applicationFormDefinitionId":"a17c5ab3-fa8f-4d56-9
