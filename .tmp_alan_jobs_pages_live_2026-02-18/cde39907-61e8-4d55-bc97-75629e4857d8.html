  <meta name="description" content="YOU. BETTER. WITH ALAN.

Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.

Our mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.

By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.

We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.


HOW WE WORK: OUR LEADERSHIP PRINCIPLES

 - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission&#39;s success above all else.

 - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.

 - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.

 - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.


🎯 THE MISSION &amp; IMPACT

The Global Offer Builder is the system that turns Alan’s insurance expertise into something our GTM teams (and eventually our customers) can use fast, safely, and at scale.

Concretely, we:

 - Enable Sales to craft coverage, price it, and contractualize it without waiting days (and without relying on a few scarce experts).

 - Make sure offers are competitive, compliant, and consistent — especially in France, where pricing is still ~13% above the market on average and we can only justify a ~+5% premium.

 - Power multi‑country growth by reducing local exceptions: one stack used across FR/BE/ES (and upcoming markets like KSA) is a major acceleration lever.

 - Reduce hidden toil and risk: fewer ad‑hoc tools, fewer “mystery pricing” situations, better observability and trust in the system.


🚀 WHAT YOU&#39;LL BUILD AND WHO YOU’LL WORK WITH

You’ll build the offer configuration + pricing + builder tooling that sits at the center of Alan’s growth engine.

 - Competitiveness fixes (P1): close the most visible pricing gaps in France by making offer configurations truly “ISO” (e.g., Action Sociale, full‑month billing vs pro‑rata, guarantee expressions). The goal is to unlock +3 pts of competitiveness while keeping a disciplined loss ratio.

 - Globalization &amp; migrations (core stack): migrate countries onto the global Offer Builder stack (starting with Spain as the proving ground), and ensure new markets (e.g., KSA) can launch without scrappy local hacks. This includes sequencing trade‑offs (ES vs FR first) and building a stack that can scale beyond the next country.

 - Sales &amp; Insurance Business tooling (expertise at scale): build the “Sales Cockpit” / insurance intelligence layer so AEs + IBS can create better offers faster, with fewer handoffs and less dependency on scarce expertise. (Some automation parts of “Sales AI” may be dropped without additional resources, but the cockpit is a key enabler.)

 - Reliability, enablement, and toil reduction: consolidate and robustify the builder (move away from fragmented solutions), improve internal usability and documentation/training, and keep the system healthy during peak seasons (renewal + sales season).


⚡ WHY THIS ROLE IS SPECIAL

 - Direct Impact: Your decisions affect Alan’s scaling, growth, profitability and ability to provide easy access to healthcare to more and more people.

 - Complex Problems: Modelling a complex world in a simple stack, real-time pricing, scale challenges

 - Ownership &amp; Growth: Influence product direction, mentor other engineers, and lead technical initiatives that shape the future of healthcare access


🛠️ THE STACK

Python/Flask, React, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.


🔍 WHAT WE&#39;RE LOOKING FOR

Technical Requirements:

 - 3+ years building scalable backend systems

 - Experience with high-traffic applications that real users depend on

What we value:

 - You love turning complex problems into elegant solutions

 - You care about the &quot;why&quot; behind what you build, not just the &quot;how&quot;

 - Clear progression in your career - increasing responsibility, scope, and impact over time

Mission Alignment:

 - Healthcare technology excites you

 - You understand that insurance isn&#39;t just about money - it&#39;s about access to care


🌍 HOW WE WORK

Location: You must be legally eligible to work in France, Belgium, or Spain.

Remote work: We offer remote work flexibility, but we value in-person collaboration. We are looking for people who want to help people live in good health to 100 while helping employers turn health benefits from a cost center into their most valuable investment..


🎯 IMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.

If you&#39;re excited about this opportunity but don&#39;t check every box, we&#39;d love to hear from you. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.

If you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?

Remember, this is just a guide, not a checklist. We&#39;ll be thrilled to receive your application!

🔖 Check out our About Alan and Career pages, as well as our Medium, blog and Glassdoor pages for more info.


YOU WANT TO KNOW MORE ABOUT ALAN?

 - 🙌 Perks &amp; Benefits https://alan.com/en/careers/a/salary-equity: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.

 - 🤘 A strong culture https://alan.com/en/about/a/leadership-principles: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work

Note: While you&#39;re applying for Insurance Offer, you may join a different engineering team based on where we think you&#39;ll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link." />

theme-wordmark/16fb5c4f-12a4-4e77-a698-3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b6f2a2f2-490b-4305-84f3-0f986d70ef14.png","logoSquareImageUrl":"https://app.ashbyhq.com/api/images/org-theme-logo/16fb5c4f-12a4-4e77-a698-3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b8987509-72b3-449b-8d58-1af70771e1e8.png","applicationSubmittedSuccessMessage":"Your application was successfully submitted. We'll contact shortly. Thank you!","jobBoardTopDescriptionHtml":"<p style=\"min-height:1.5em\"><strong>You. Better. With Alan. </strong><br /><br />Alan's vision is to make <strong>prevention the new norm</strong> of care for all.<br />‭<br />Alan's mission is to <strong>help people live in good health to 100</strong> while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p>","jobBoardBottomDescriptionHtml":"<h2><strong>Important note: we hire people, not roles.</strong></h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you.</strong> Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p>","jobPostingBackUrl":null},"appConfirmationTrackingPixelHtml":null,"recruitingPrivacyPolicyUrl":"https://alan.com/candidate-privacy","timezone":"Europe/Paris","candidateScheduleCancellationReasonRequirementStatus":"Off"},"posting":{"id":"cde39907-61e8-4d55-bc97-75629e4857d8","title":"Fullstack Software Engineer (x/f/m) - Global Offer Builder","updatedAt":"2026-02-18T12:03:58.930Z","departmentName":"Engineering","departmentExternalName":"Engineering","teamName":"Engineering","teamExternalName":"Engineering","teamNames":["Engineering"],"locationName":"Anywhere in France, Belgium, Spain","locationExternalName":"Anywhere in France, Belgium, Spain","isListed":true,"suppressDescriptionOpening":false,"suppressDescriptionClosing":false,"descriptionHtml":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul><h1><strong>🎯 The mission &amp; impact</strong></h1><p style=\"min-height:1.5em\">The <strong>Global Offer Builder</strong> is the system that turns Alan’s insurance expertise into something our GTM teams (and eventually our customers) can use <strong>fast, safely, and at scale</strong>.</p><p style=\"min-height:1.5em\">Concretely, we:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Enable Sales to <strong>craft coverage, price it, and contractualize it</strong> without waiting days (and without relying on a few scarce experts).</p></li><li><p style=\"min-height:1.5em\">Make sure offers are <strong>competitive, compliant, and consistent</strong> — especially in France, where pricing is still ~13% above the market on average and we can only justify a ~+5% premium.</p></li><li><p style=\"min-height:1.5em\">Power multi‑country growth by reducing local exceptions: one stack used across <strong>FR/BE/ES</strong> (and upcoming markets like <strong>KSA</strong>) is a major acceleration lever.</p></li><li><p style=\"min-height:1.5em\">Reduce hidden toil and risk: fewer ad‑hoc tools, fewer “mystery pricing” situations, better observability and trust in the system.</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>🚀 What you'll build and who you’ll work with</strong></h1><p style=\"min-height:1.5em\">You’ll build the <strong>offer configuration + pricing + builder tooling</strong> that sits at the center of Alan’s growth engine.</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Competitiveness fixes (P1):</strong> close the most visible pricing gaps in France by making offer configurations truly “ISO” (e.g., Action Sociale, full‑month billing vs pro‑rata, guarantee expressions). The goal is to unlock <strong>+3 pts of competitiveness</strong> while keeping a disciplined loss ratio.</p></li><li><p style=\"min-height:1.5em\"><strong>Globalization &amp; migrations (core stack):</strong> migrate countries onto the global Offer Builder stack (starting with <strong>Spain</strong> as the proving ground), and ensure new markets (e.g., <strong>KSA</strong>) can launch without scrappy local hacks. This includes sequencing trade‑offs (ES vs FR first) and building a stack that can scale beyond the next country.</p></li><li><p style=\"min-height:1.5em\"><strong>Sales &amp; Insurance Business tooling (expertise at scale):</strong> build the “Sales Cockpit” / insurance intelligence layer so AEs + IBS can create better offers faster, with fewer handoffs and less dependency on scarce expertise. (Some automation parts of “Sales AI” may be dropped without additional resources, but the cockpit is a key enabler.)</p></li><li><p style=\"min-height:1.5em\"><strong>Reliability, enablement, and toil reduction:</strong> consolidate and robustify the builder (move away from fragmented solutions), improve internal usability and documentation/training, and keep the system healthy during peak seasons (renewal + sales season).</p></li></ul><p style=\"min-height:1.5em\"></p><h1><strong>⚡ Why this role is special</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Direct Impact</strong>: Your decisions affect Alan’s scaling, growth, profitability and ability to provide easy access to healthcare to more and more people.</p></li><li><p style=\"min-height:1.5em\"><strong>Complex Problems</strong>: Modelling a complex world in a simple stack, real-time pricing, scale challenges</p></li><li><p style=\"min-height:1.5em\"><strong>Ownership &amp; Growth</strong>: Influence product direction, mentor other engineers, and lead technical initiatives that shape the future of healthcare access</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>🛠️ The Stack</strong></h1><p style=\"min-height:1.5em\">Python/Flask, React, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.</p><p style=\"min-height:1.5em\"></p><h1><strong>🔍 What we're looking for</strong></h1><p style=\"min-height:1.5em\"><strong>Technical Requirements:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">3+ years building scalable backend systems</p></li><li><p style=\"min-height:1.5em\">Experience with high-traffic applications that real users depend on</p></li></ul><p style=\"min-height:1.5em\"><strong>What we value:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You love turning complex problems into elegant solutions</p></li><li><p style=\"min-height:1.5em\">You care about the \"why\" behind what you build, not just the \"how\"</p></li><li><p style=\"min-height:1.5em\">Clear progression in your career - increasing responsibility, scope, and impact over time</p></li></ul><p style=\"min-height:1.5em\"><strong>Mission Alignment:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Healthcare technology excites you</p></li><li><p style=\"min-height:1.5em\">You understand that insurance isn't just about money - it's about access to care</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>🌍 How we work</strong></h1><p style=\"min-height:1.5em\"><strong>Location</strong>: You must be legally eligible to work in France, Belgium, or Spain.</p><p style=\"min-height:1.5em\"><strong>Remote</strong> <strong>work</strong>: We offer remote work flexibility, but we value in-person collaboration. We are looking for people who want to help people live in good health to 100 while helping employers turn health benefits from a cost center into their most valuable investment..</p><p style=\"min-height:1.5em\"></p><h1><strong>🎯 Important note: we hire people, not roles.</strong></h1><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you</strong>. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong> We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our About Alan and Career pages, as well as our Medium, blog and Glassdoor pages for more info.</p><p style=\"min-height:1.5em\"></p><h2><strong>You want to know more about Alan?</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">🙌 <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/salary-equity\">Perks &amp; Benefits</a>: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.</p></li><li><p style=\"min-height:1.5em\">🤘 <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/about/a/leadership-principles\">A strong culture</a>: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work</p></li></ul><p style=\"min-height:1.5em\"><em>Note: While you're applying for Insurance Offer, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link\"><em>here</em></a><em>. </em></p>","descriptionPlainText":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.\n\n\n🎯 THE MISSION & IMPACT\n\nThe Global Offer Builder is the system that turns Alan’s insurance expertise into something our GTM teams (and eventually our customers) can use fast, safely, and at scale.\n\nConcretely, we:\n\n - Enable Sales to craft coverage, price it, and contractualize it without waiting days (and without relying on a few scarce experts).\n\n - Make sure offers are competitive, compliant, and consistent — especially in France, where pricing is still ~13% above the market on average and we can only justify a ~+5% premium.\n\n - Power multi‑country growth by reducing local exceptions: one stack used across FR/BE/ES (and upcoming markets like KSA) is a major acceleration lever.\n\n - Reduce hidden toil and risk: fewer ad‑hoc tools, fewer “mystery pricing” situations, better observability and trust in the system.\n\n\n🚀 WHAT YOU'LL BUILD AND WHO YOU’LL WORK WITH\n\nYou’ll build the offer configuration + pricing + builder tooling that sits at the center of Alan’s growth engine.\n\n - Competitiveness fixes (P1): close the most visible pricing gaps in France by making offer configurations truly “ISO” (e.g., Action Sociale, full‑month billing vs pro‑rata, guarantee expressions). The goal is to unlock +3 pts of competitiveness while keeping a disciplined loss ratio.\n\n - Globalization & migrations (core stack): migrate countries onto the global Offer Builder stack (starting with Spain as the proving ground), and ensure new markets (e.g., KSA) can launch without scrappy local hacks. This includes sequencing trade‑offs (ES vs FR first) and building a stack that can scale beyond the next country.\n\n - Sales & Insurance Business tooling (expertise at scale): build the “Sales Cockpit” / insurance intelligence layer so AEs + IBS can create better offers faster, with fewer handoffs and less dependency on scarce expertise. (Some automation parts of “Sales AI” may be dropped without additional resources, but the cockpit is a key enabler.)\n\n - Reliability, enablement, and toil reduction: consolidate and robustify the builder (move away from fragmented solutions), improve internal usability and documentation/training, and keep the system healthy during peak seasons (renewal + sales season).\n\n\n⚡ WHY THIS ROLE IS SPECIAL\n\n - Direct Impact: Your decisions affect Alan’s scaling, growth, profitability and ability to provide easy access to healthcare to more and more people.\n\n - Complex Problems: Modelling a complex world in a simple stack, real-time pricing, scale challenges\n\n - Ownership & Growth: Influence product direction, mentor other engineers, and lead technical initiatives that shape the future of healthcare access\n\n\n🛠️ THE STACK\n\nPython/Flask, React, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.\n\n\n🔍 WHAT WE'RE LOOKING FOR\n\nTechnical Requirements:\n\n - 3+ years building scalable backend systems\n\n - Experience with high-traffic applications that real users depend on\n\nWhat we value:\n\n - You love turning complex problems into elegant solutions\n\n - You care about the \"why\" behind what you build, not just the \"how\"\n\n - Clear progression in your career - increasing responsibility, scope, and impact over time\n\nMission Alignment:\n\n - Healthcare technology excites you\n\n - You understand that insurance isn't just about money - it's about access to care\n\n\n🌍 HOW WE WORK\n\nLocation: You must be legally eligible to work in France, Belgium, or Spain.\n\nRemote work: We offer remote work flexibility, but we value in-person collaboration. We are looking for people who want to help people live in good health to 100 while helping employers turn health benefits from a cost center into their most valuable investment..\n\n\n🎯 IMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.\n\nIf you're excited about this opportunity but don't check every box, we'd love to hear from you. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.\n\nIf you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?\n\nRemember, this is just a guide, not a checklist. We'll be thrilled to receive your application!\n\n🔖 Check out our About Alan and Career pages, as well as our Medium, blog and Glassdoor pages for more info.\n\n\nYOU WANT TO KNOW MORE ABOUT ALAN?\n\n - 🙌 Perks & Benefits https://alan.com/en/careers/a/salary-equity: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\n - 🤘 A strong culture https://alan.com/en/about/a/leadership-principles: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work\n\nNote: While you're applying for Insurance Offer, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link.","descriptionParts":{"descriptionOpening":{"html":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul>","plain":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership."},"descriptionBody":{"html":"<h1><strong>🎯 The mission &amp; impact</strong></h1><p style=\"min-height:1.5em\">The <strong>Global Offer Builder</strong> is the system that turns Alan’s insurance expertise into something our GTM teams (and eventually our customers) can use <strong>fast, safely, and at scale</strong>.</p><p style=\"min-height:1.5em\">Concretely, we:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Enable Sales to <strong>craft coverage, price it, and contractualize it</strong> without waiting days (and without relying on a few scarce experts).</p></li><li><p style=\"min-height:1.5em\">Make sure offers are <strong>competitive, compliant, and consistent</strong> — especially in France, where pricing is still ~13% above the market on average and we can only justify a ~+5% premium.</p></li><li><p style=\"min-height:1.5em\">Power multi‑country growth by reducing local exceptions: one stack used across <strong>FR/BE/ES</strong> (and upcoming markets like <strong>KSA</strong>) is a major acceleration lever.</p></li><li><p style=\"min-height:1.5em\">Reduce hidden toil and risk: fewer ad‑hoc tools, fewer “mystery pricing” situations, better observability and trust in the system.</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>🚀 What you'll build and who you’ll work with</strong></h1><p style=\"min-height:1.5em\">You’ll build the <strong>offer configuration + pricing + builder tooling</strong> that sits at the center of Alan’s growth engine.</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Competitiveness fixes (P1):</strong> close the most visible pricing gaps in France by making offer configurations truly “ISO” (e.g., Action Sociale, full‑month billing vs pro‑rata, guarantee expressions). The goal is to unlock <strong>+3 pts of competitiveness</strong> while keeping a disciplined loss ratio.</p></li><li><p style=\"min-height:1.5em\"><strong>Globalization &amp; migrations (core stack):</strong> migrate countries onto the global Offer Builder stack (starting with <strong>Spain</strong> as the proving ground), and ensure new markets (e.g., <strong>KSA</strong>) can launch without scrappy local hacks. This includes sequencing trade‑offs (ES vs FR first) and building a stack that can scale beyond the next country.</p></li><li><p style=\"min-height:1.5em\"><strong>Sales &amp; Insurance Business tooling (expertise at scale):</strong> build the “Sales Cockpit” / insurance intelligence layer so AEs + IBS can create better offers faster, with fewer handoffs and less dependency on scarce expertise. (Some automation parts of “Sales AI” may be dropped without additional resources, but the cockpit is a key enabler.)</p></li><li><p style=\"min-height:1.5em\"><strong>Reliability, enablement, and toil reduction:</strong> consolidate and robustify the builder (move away from fragmented solutions), improve internal usability and documentation/training, and keep the system healthy during peak seasons (renewal + sales season).</p></li></ul><p style=\"min-height:1.5em\"></p><h1><strong>⚡ Why this role is special</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Direct Impact</strong>: Your decisions affect Alan’s scaling, growth, profitability and ability to provide easy access to healthcare to more and more people.</p></li><li><p style=\"min-height:1.5em\"><strong>Complex Problems</strong>: Modelling a complex world in a simple stack, real-time pricing, scale challenges</p></li><li><p style=\"min-height:1.5em\"><strong>Ownership &amp; Growth</strong>: Influence product direction, mentor other engineers, and lead technical initiatives that shape the future of healthcare access</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>🛠️ The Stack</strong></h1><p style=\"min-height:1.5em\">Python/Flask, React, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.</p><p style=\"min-height:1.5em\"></p><h1><strong>🔍 What we're looking for</strong></h1><p style=\"min-height:1.5em\"><strong>Technical Requirements:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">3+ years building scalable backend systems</p></li><li><p style=\"min-height:1.5em\">Experience with high-traffic applications that real users depend on</p></li></ul><p style=\"min-height:1.5em\"><strong>What we value:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You love turning complex problems into elegant solutions</p></li><li><p style=\"min-height:1.5em\">You care about the \"why\" behind what you build, not just the \"how\"</p></li><li><p style=\"min-height:1.5em\">Clear progression in your career - increasing responsibility, scope, and impact over time</p></li></ul><p style=\"min-height:1.5em\"><strong>Mission Alignment:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Healthcare technology excites you</p></li><li><p style=\"min-height:1.5em\">You understand that insurance isn't just about money - it's about access to care</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>🌍 How we work</strong></h1><p style=\"min-height:1.5em\"><strong>Location</strong>: You must be legally eligible to work in France, Belgium, or Spain.</p><p style=\"min-height:1.5em\"><strong>Remote</strong> <strong>work</strong>: We offer remote work flexibility, but we value in-person collaboration. We are looking for people who want to help people live in good health to 100 while helping employers turn health benefits from a cost center into their most valuable investment..</p><p style=\"min-height:1.5em\"></p><h1><strong>🎯 Important note: we hire people, not roles.</strong></h1><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you</strong>. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of ricing is still ~13% above the market on average and we can only justify a ~+5% premium.\n\n - Power multi‑country growth by reducing local exceptions: one stack used across FR/BE/ES (and upcoming markets like KSA) is a major acceleration lever.\n\n - Reduce hidden toil and risk: fewer ad‑hoc tools, fewer “mystery pricing” situations, better observability and trust in the system.\n\n\n🚀 WHAT YOU'LL BUILD AND WHO YOU’LL WORK WITH\n\nYou’ll build the offer configuration + pricing + builder tooling that sits at the center of Alan’s growth engine.\n\n - Competitiveness fixes (P1): close the most visible pricing gaps in France by making offer configurations truly “ISO” (e.g., Action Sociale, full‑month billing vs pro‑rata, guarantee expressions). The goal is to unlock +3 pts of competitiveness while keeping a disciplined loss ratio.\n\n - Globalization & migrations (core stack): migrate countries onto the global Offer Builder stack (starting with Spain as the proving ground), and ensure new markets (e.g., KSA) can launch without scrappy local hacks. This includes sequencing trade‑offs (ES vs FR first) and building a stack that can scale beyond the next country.\n\n - Sales & Insurance Business tooling (expertise at scale): build the “Sales Cockpit” / insurance intelligence layer so AEs + IBS can create better offers faster, with fewer handoffs and less dependency on scarce expertise. (Some automation parts of “Sales AI” may be dropped without additional resources, but the cockpit is a key enabler.)\n\n - Reliability, enablement, and toil reduction: consolidate and robustify the builder (move away from fragmented solutions), improve internal usability and documentation/training, and keep the system healthy during peak seasons (renewal + sales season).\n\n\n⚡ WHY THIS ROLE IS SPECIAL\n\n - Direct Impact: Your decisions affect Alan’s scaling, growth, profitability and ability to provide easy access to healthcare to more and more people.\n\n - Complex Problems: Modelling a c
