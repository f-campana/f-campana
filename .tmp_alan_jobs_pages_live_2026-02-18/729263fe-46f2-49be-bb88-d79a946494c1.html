  <meta name="description" content="YOU. BETTER. WITH ALAN.

Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.

Our mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.

By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.

We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.


HOW WE WORK: OUR LEADERSHIP PRINCIPLES

 - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission&#39;s success above all else.

 - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.

 - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.

 - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.


🚀 WHAT YOU&#39;LL BUILD AND WHO YOU&#39;LL WORK WITH

You would join the team called “Claims Management”, in charge of refunding €350M+ of healthcare expenses every year to 1M+ members across France, Belgium, Spain, and Canada.

Our mission is to refund each member as fast as we can and the right amount, while being cost-effective for Alan.

We have internalized all the critical parts to handle health claims, which makes this product division a technical, deep, and exciting place to work.

Claims Management contains several product crews, notably:

 - Document processing https://medium.com/alan/working-on-document-processing-early-2023-88f642627ec0: 2M documents received every year. We automatically parse a good portion of them with LLMs but we want to go further.

 - Claims experience https://medium.com/alan/claim-engine-saving-60-k-year-by-avoiding-unnecessary-recompute-dbbbb9f52de7: Building the most memorable and straightforward experience for our members to understand their guarantees and get a claim refunded. Across 4 different countries, mobile and desktop.

 - Payments: Building a payment infra &amp; source ingestion system to make sure our members get refunded super fast or better, they don’t need to advance the money.

 - Fraud fighting: 4M€ saved in 2024 with an internal stack combining Machine learning scoring, anomaly detections, and manual investigations





⭐ IS IT YOU WE’RE LOOKING FOR?

We are looking for engineers with 3+ years of experience who get excited about building complex systems that need to work perfectly 24/7 every day of the year despite being on a high-growth trajectory.

We value:

 - Passionate about creating delightful products with exceptional user experiences, you understand what it takes to build delightful user experiences at scale.

 - Good experience building and shipping web applications

 - You&#39;re genuinely interested in the business side - understanding conversion funnels, marketing metrics, and what drives growth

 - Clear progression in your career - increasing responsibility, scope, and impact over time.

 - Open to working with TypeScript and Python in a cross-platform environment, familiar with modern web technologies, and proficient in Object-Oriented Programming (Python, Java, Swift, Kotlin, or C#).

 - Self-starting and entrepreneurial.

 - Humble and still willing to grow (no matter your seniority!).

 - Collaborative, enthusiastic about teamwork, learning, and teaching.

 - English working proficiency

Mission Alignment:

 - Healthcare technology excites you

 - Leveraging AI to redefine our roles and unlock scalability


⭐ THE ENGINEERING TEAM ⭐

In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!

Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.

We move fast, with a lot of ownership, and are proud to tackle big problems!

Our process is very simple: those who make product decisions are the same ones who build them.

Our stack is React, Python/Flask, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.

Want to know more? Read this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan if you want to discover how life as an Engineer at Alan and this article https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c on our Engineering career path.



🌍 HOW WE WORK

Location: You must be legally eligible to work in France, Belgium, or Spain.

Remote work: We offer remote work flexibility, but we value in-person collaboration


🎯 IMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.

If you&#39;re excited about this opportunity but don&#39;t check every box, we&#39;d love to hear from you. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.

If you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?

Remember, this is just a guide, not a checklist. We&#39;ll be thrilled to receive your application!

🔖 Check out our About Alan and Career pages, as well as our Medium, blog and Glassdoor pages for more info.


YOU WANT TO KNOW MORE ABOUT ALAN?

 - 🙌 Perks &amp; Benefits https://alan.com/en/careers/a/salary-equity: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.

 - 🤘 A strong culture https://alan.com/en/about/a/leadership-principles: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work

🔄 A quick note about the process

theme-wordmark/16fb5c4f-12a4-4e77-a698-3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b6f2a2f2-490b-4305-84f3-0f986d70ef14.png","logoSquareImageUrl":"https://app.ashbyhq.com/api/images/org-theme-logo/16fb5c4f-12a4-4e77-a698-3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b8987509-72b3-449b-8d58-1af70771e1e8.png","applicationSubmittedSuccessMessage":"Your application was successfully submitted. We'll contact shortly. Thank you!","jobBoardTopDescriptionHtml":"<p style=\"min-height:1.5em\"><strong>You. Better. With Alan. </strong><br /><br />Alan's vision is to make <strong>prevention the new norm</strong> of care for all.<br />‭<br />Alan's mission is to <strong>help people live in good health to 100</strong> while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p>","jobBoardBottomDescriptionHtml":"<h2><strong>Important note: we hire people, not roles.</strong></h2><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you.</strong> Everyone, no matter how underrepresented, should feel free to apply as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist.</strong></p><p style=\"min-height:1.5em\">We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/about\">About Alan</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/careers\">Career</a> pages, as well as our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan\">Medium</a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/\">blog</a> and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Alan-EI_IE1696043.11,15.htm\">Glassdoor page</a> for more info.</p>","jobPostingBackUrl":null},"appConfirmationTrackingPixelHtml":null,"recruitingPrivacyPolicyUrl":"https://alan.com/candidate-privacy","timezone":"Europe/Paris","candidateScheduleCancellationReasonRequirementStatus":"Off"},"posting":{"id":"729263fe-46f2-49be-bb88-d79a946494c1","title":"Fullstack Software Engineer (x/f/m) - Claims Management","updatedAt":"2026-02-17T17:29:08.046Z","departmentName":"Engineering","departmentExternalName":"Engineering","teamName":"Engineering","teamExternalName":"Engineering","teamNames":["Engineering"],"locationName":"Anywhere in France, Belgium, Spain","locationExternalName":"Anywhere in France, Belgium, Spain","isListed":true,"suppressDescriptionOpening":false,"suppressDescriptionClosing":false,"descriptionHtml":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul><h1><strong>🚀 What you'll build and who you'll work with</strong></h1><p style=\"min-height:1.5em\">You would join the team called “<strong>Claims Management</strong>”, in charge of refunding <strong>€350M+ of healthcare expenses</strong> every year to <strong>1M+ members</strong> across France, Belgium, Spain, and Canada.</p><p style=\"min-height:1.5em\">Our mission is to refund each member as fast as we can and the right amount, while being cost-effective for Alan.</p><p style=\"min-height:1.5em\">We have internalized all the critical parts to handle health claims, which makes this product division a technical, deep, and exciting place to work.</p><p style=\"min-height:1.5em\">Claims Management contains several product crews, notably:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/working-on-document-processing-early-2023-88f642627ec0\"><strong>Document processing</strong></a>: 2M documents received every year. We automatically parse a good portion of them with LLMs but we want to go further.</p></li><li><p style=\"min-height:1.5em\"><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/claim-engine-saving-60-k-year-by-avoiding-unnecessary-recompute-dbbbb9f52de7\"><strong>Claims experience</strong></a><strong>:</strong> Building the most memorable and straightforward experience for our members to understand their guarantees and get a claim refunded. Across 4 different countries, mobile and desktop.</p></li><li><p style=\"min-height:1.5em\"><strong>Payments:</strong> Building a payment infra &amp; source ingestion system to make sure our members get refunded super fast or better, they don’t need to advance the money.</p></li><li><p style=\"min-height:1.5em\"><strong>Fraud fighting:</strong> 4M€ saved in 2024 with an internal stack combining Machine learning scoring, anomaly detections, and manual investigations</p></li></ul><h1></h1><h1><strong>⭐ Is it you we’re looking for?</strong></h1><p style=\"min-height:1.5em\">We are looking for engineers with 3+ years of experience who get excited about <strong>building complex systems</strong> that need to work perfectly <strong>24/7 every day</strong> of the year despite being on a high-growth trajectory.</p><p style=\"min-height:1.5em\"><strong>We value:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Passionate about creating<strong> delightful products with exceptional user experiences,</strong> you understand what it takes to build delightful user experiences at scale<strong>.</strong></p></li><li><p style=\"min-height:1.5em\">Good experience building and shipping <strong>web applications</strong></p></li><li><p style=\"min-height:1.5em\">You're genuinely interested in the business side - understanding conversion funnels, marketing metrics, and what drives growth</p></li><li><p style=\"min-height:1.5em\"><strong>Clear progression in your career</strong> - increasing responsibility, scope, and impact over time.</p></li><li><p style=\"min-height:1.5em\">Open to working with TypeScript and Python in a cross-platform environment, familiar with modern web technologies, and proficient in Object-Oriented Programming (Python, Java, Swift, Kotlin, or C#).</p></li></ul><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Self-starting and entrepreneurial.</p></li><li><p style=\"min-height:1.5em\">Humble and still willing to grow (no matter your seniority!).</p></li><li><p style=\"min-height:1.5em\">Collaborative, enthusiastic about teamwork, learning, and teaching.</p></li><li><p style=\"min-height:1.5em\">English working proficiency</p></li></ul><p style=\"min-height:1.5em\"><strong>Mission Alignment:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Healthcare technology excites you</p></li><li><p style=\"min-height:1.5em\">Leveraging AI to redefine our roles and unlock scalability</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>⭐ The Engineering team ⭐</strong></h1><p style=\"min-height:1.5em\">In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!</p><p style=\"min-height:1.5em\">Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.</p><p style=\"min-height:1.5em\">We move fast, with a lot of ownership, and are proud to tackle big problems!</p><p style=\"min-height:1.5em\">Our process is very simple: those who make product decisions are the same ones who build them.</p><p style=\"min-height:1.5em\">Our stack is React, Python/Flask, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.</p><p style=\"min-height:1.5em\">Want to know more? Read <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a> if you want to discover how life as an Engineer at Alan and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c\">this article</a> on our Engineering career path.</p><h1><br /><strong>🌍 How we work</strong></h1><p style=\"min-height:1.5em\"><strong>Location</strong>: You must be legally eligible to work in France, Belgium, or Spain.</p><p style=\"min-height:1.5em\"><strong>Remote</strong> <strong>work</strong>: We offer remote work flexibility, but we value in-person collaboration</p><p style=\"min-height:1.5em\"></p><h1><strong>🎯 Important note: we hire people, not roles.</strong></h1><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you</strong>. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist. </strong>We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our About Alan and Career pages, as well as our Medium, blog and Glassdoor pages for more info.</p><p style=\"min-height:1.5em\"></p><h2><strong>You want to know more about Alan?</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">🙌 <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/salary-equity\"><u>Perks &amp; Benefits</u></a>: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.</p></li><li><p style=\"min-height:1.5em\">🤘 <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/about/a/leadership-principles\"><u>A strong culture</u></a>: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process</strong><br /><em>Note: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link\"><em>here</em></a><em>. </em></p>","descriptionPlainText":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership.\n\n\n🚀 WHAT YOU'LL BUILD AND WHO YOU'LL WORK WITH\n\nYou would join the team called “Claims Management”, in charge of refunding €350M+ of healthcare expenses every year to 1M+ members across France, Belgium, Spain, and Canada.\n\nOur mission is to refund each member as fast as we can and the right amount, while being cost-effective for Alan.\n\nWe have internalized all the critical parts to handle health claims, which makes this product division a technical, deep, and exciting place to work.\n\nClaims Management contains several product crews, notably:\n\n - Document processing https://medium.com/alan/working-on-document-processing-early-2023-88f642627ec0: 2M documents received every year. We automatically parse a good portion of them with LLMs but we want to go further.\n\n - Claims experience https://medium.com/alan/claim-engine-saving-60-k-year-by-avoiding-unnecessary-recompute-dbbbb9f52de7: Building the most memorable and straightforward experience for our members to understand their guarantees and get a claim refunded. Across 4 different countries, mobile and desktop.\n\n - Payments: Building a payment infra & source ingestion system to make sure our members get refunded super fast or better, they don’t need to advance the money.\n\n - Fraud fighting: 4M€ saved in 2024 with an internal stack combining Machine learning scoring, anomaly detections, and manual investigations\n\n\n\n\n\n⭐ IS IT YOU WE’RE LOOKING FOR?\n\nWe are looking for engineers with 3+ years of experience who get excited about building complex systems that need to work perfectly 24/7 every day of the year despite being on a high-growth trajectory.\n\nWe value:\n\n - Passionate about creating delightful products with exceptional user experiences, you understand what it takes to build delightful user experiences at scale.\n\n - Good experience building and shipping web applications\n\n - You're genuinely interested in the business side - understanding conversion funnels, marketing metrics, and what drives growth\n\n - Clear progression in your career - increasing responsibility, scope, and impact over time.\n\n - Open to working with TypeScript and Python in a cross-platform environment, familiar with modern web technologies, and proficient in Object-Oriented Programming (Python, Java, Swift, Kotlin, or C#).\n\n - Self-starting and entrepreneurial.\n\n - Humble and still willing to grow (no matter your seniority!).\n\n - Collaborative, enthusiastic about teamwork, learning, and teaching.\n\n - English working proficiency\n\nMission Alignment:\n\n - Healthcare technology excites you\n\n - Leveraging AI to redefine our roles and unlock scalability\n\n\n⭐ THE ENGINEERING TEAM ⭐\n\nIn our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!\n\nBeing an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.\n\nWe move fast, with a lot of ownership, and are proud to tackle big problems!\n\nOur process is very simple: those who make product decisions are the same ones who build them.\n\nOur stack is React, Python/Flask, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.\n\nWant to know more? Read this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan if you want to discover how life as an Engineer at Alan and this article https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c on our Engineering career path.\n\n\n\n🌍 HOW WE WORK\n\nLocation: You must be legally eligible to work in France, Belgium, or Spain.\n\nRemote work: We offer remote work flexibility, but we value in-person collaboration\n\n\n🎯 IMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.\n\nIf you're excited about this opportunity but don't check every box, we'd love to hear from you. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.\n\nIf you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?\n\nRemember, this is just a guide, not a checklist. We'll be thrilled to receive your application!\n\n🔖 Check out our About Alan and Career pages, as well as our Medium, blog and Glassdoor pages for more info.\n\n\nYOU WANT TO KNOW MORE ABOUT ALAN?\n\n - 🙌 Perks & Benefits https://alan.com/en/careers/a/salary-equity: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\n - 🤘 A strong culture https://alan.com/en/about/a/leadership-principles: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work\n\n🔄 A quick note about the process\nNote: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link.","descriptionParts":{"descriptionOpening":{"html":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul>","plain":"YOU. BETTER. WITH ALAN.\n\nAlan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.\n\nOur mission: Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.\n\nBy connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.\n\nWe partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.\n\n\nHOW WE WORK: OUR LEADERSHIP PRINCIPLES\n\n - Mission is the Boss — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.\n\n - Distributed Ownership — Accountable enlightened despots: everyone owns their decisions and results.\n\n - Radical Transparency — All information is accessible and written-first, so everyone can make the best decisions asynchronously.\n\n - Always Growing — Direct, positive, and caring feedback, combined with self-growth ownership."},"descriptionBody":{"html":"<h1><strong>🚀 What you'll build and who you'll work with</strong></h1><p style=\"min-height:1.5em\">You would join the team called “<strong>Claims Management</strong>”, in charge of refunding <strong>€350M+ of healthcare expenses</strong> every year to <strong>1M+ members</strong> across France, Belgium, Spain, and Canada.</p><p style=\"min-height:1.5em\">Our mission is to refund each member as fast as we can and the right amount, while being cost-effective for Alan.</p><p style=\"min-height:1.5em\">We have internalized all the critical parts to handle health claims, which makes this product division a technical, deep, and exciting place to work.</p><p style=\"min-height:1.5em\">Claims Management contains several product crews, notably:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/working-on-document-processing-early-2023-88f642627ec0\"><strong>Document processing</strong></a>: 2M documents received every year. We automatically parse a good portion of them with LLMs but we want to go further.</p></li><li><p style=\"min-height:1.5em\"><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/claim-engine-saving-60-k-year-by-avoiding-unnecessary-recompute-dbbbb9f52de7\"><strong>Claims experience</strong></a><strong>:</strong> Building the most memorable and straightforward experience for our members to understand their guarantees and get a claim refunded. Across 4 different countries, mobile and desktop.</p></li><li><p style=\"min-height:1.5em\"><strong>Payments:</strong> Building a payment infra &amp; source ingestion system to make sure our members get refunded super fast or better, they don’t need to advance the money.</p></li><li><p style=\"min-height:1.5em\"><strong>Fraud fighting:</strong> 4M€ saved in 2024 with an internal stack combining Machine learning scoring, anomaly detections, and manual investigations</p></li></ul><h1></h1><h1><strong>⭐ Is it you we’re looking for?</strong></h1><p style=\"min-height:1.5em\">We are looking for engineers with 3+ years of experience who get excited about <strong>building complex systems</strong> that need to work perfectly <strong>24/7 every day</strong> of the year despite being on a high-growth trajectory.</p><p style=\"min-height:1.5em\"><strong>We value:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Passionate about creating<strong> delightful products with exceptional user experiences,</strong> you understand what it takes to build delightful user experiences at scale<strong>.</strong></p></li><li><p style=\"min-height:1.5em\">Good experience building and shipping <strong>web applications</strong></p></li><li><p style=\"min-height:1.5em\">You're genuinely interested in the business side - understanding conversion funnels, marketing metrics, and what drives growth</p></li><li><p style=\"min-height:1.5em\"><strong>Clear progression in your career</strong> - increasing responsibility, scope, and impact over time.</p></li><li><p style=\"min-height:1.5em\">Open to working with TypeScript and Python in a cross-platform environment, familiar with modern web technologies, and proficient in Object-Oriented Programming (Python, Java, Swift, Kotlin, or C#).</p></li></ul><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Self-starting and entrepreneurial.</p></li><li><p style=\"min-height:1.5em\">Humble and still willing to grow (no matter your seniority!).</p></li><li><p style=\"min-height:1.5em\">Collaborative, enthusiastic about teamwork, learning, and teaching.</p></li><li><p style=\"min-height:1.5em\">English working proficiency</p></li></ul><p style=\"min-height:1.5em\"><strong>Mission Alignment:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Healthcare technology excites you</p></li><li><p style=\"min-height:1.5em\">Leveraging AI to redefine our roles and unlock scalability</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>⭐ The Engineering team ⭐</strong></h1><p style=\"min-height:1.5em\">In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!</p><p style=\"min-height:1.5em\">Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.</p><p style=\"min-height:1.5em\">We move fast, with a lot of ownership, and are proud to tackle big problems!</p><p style=\"min-height:1.5em\">Our process is very simple: those who make product decisions are the same ones who build them.</p><p style=\"min-height:1.5em\">Our stack is React, Python/Flask, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.</p><p style=\"min-height:1.5em\">Want to know more? Read <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a> if you want to discover how life as an Engineer at Alan and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c\">this article</a> on our Engineering career path.</p><h1><br /><strong>🌍 How we work</strong></h1><p style=\"min-height:1.5em\"><strong>Location</strong>: You must be legally eligible to work in France, Belgium, or Spain.</p><p style=\"min-height:1.5em\"><strong>Remote</strong> <strong>work</strong>: We offer remote work flexibility, but we value in-person collaboration</p><p style=\"min-height:1.5em\"></p><h1><strong>🎯 Important note: we hire people, not roles.</strong></h1><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you</strong>. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist. </strong>We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our About Alan and Career pages, as well as our Medium, blog and Glassdoor pages for more info.</p><p style=\"min-height:1.5em\"></p><h2><strong>You want to know more about Alan?</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">🙌 <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/salary-equity\"><u>Perks &amp; Benefits</u></a>: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.</p></li><li><p style=\"min-height:1.5em\">🤘 <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/about/a/leadership-principles\"><u>A strong culture</u></a>: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process</strong><br /><em>Note: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link\"><em>here</em></a><em>. </em></p>","plain":"🚀 WHAT YOU'LL BUILD AND WHO YOU'LL WORK WITH\n\nYou would join the team called “Claims Management”, in charge of refunding €350M+ of healthcare expenses every year to 1M+ members across France, Belgium, Spain, and Canada.\n\nOur mission is to refund each member as fast as we can and the right amount, while being cost-effective for Alan.\n\nWe have internalized all the critical parts to handle health claims, which makes this product division a technical, deep, and exciting place to work.\n\nClaims Management contains several product crews, notably:\n\n - Document processing https://medium.com/alan/working-on-document-processing-early-2023-88f642627ec0: 2M documents received every year. We automatically parse a good portion of them with LLMs but we want to go further.\n\n - Claims experience https://medium.com/alan/claim-engine-saving-60-k-year-by-avoiding-unnecessary-recompute-dbbbb9f52de7: Building the most memorable and straightforward experience for our members to understand their guarantees and get a claim refunded. Across 4 different countries, mobile and desktop.\n\n - Payments: Building a payment infra & source ingestion system to make sure our members get refunded super fast or better, they don’t need to advance the money.\n\n - Fraud fighting: 4M€ saved in 2024 with an internal stack combining Machine learning scoring, anomaly detections, and manual investigations\n\n\n\n\n\n⭐ IS IT YOU WE’RE LOOKING FOR?\n\nWe are looking for engineers with 3+ years of experience who get excited about building complex systems that need to work perfectly 24/7 every day of the year despite being on a high-growth trajectory.\n\nWe value:\n\n - Passionate about creating delightful products with exceptional user experiences, you understand what it takes to build delightful user experiences at scale.\n\n - Good experience building and shipping web applications\n\n - You're genuinely interested in the business side - understanding conversion funnels, marketing metrics, and what drives growth\n\n - Clear progression in your career - increasing responsibility, scope, and impact over time.\n\n - Open to working with TypeScript and Python in a cross-platform environment, familiar with modern web technologies, and proficient in Object-Oriented Programming (Python, Java, Swift, Kotlin, or C#).\n\n - Self-starting and entrepreneurial.\n\n - Humble and still willing to grow (no matter your seniority!).\n\n - Collaborative, enthusiastic about teamwork, learning, and teaching.\n\n - English working proficiency\n\nMission Alignment:\n\n - Healthcare technology excites you\n\n - Leveraging AI to redefine our roles and unlock scalability\n\n\n⭐ THE ENGINEERING TEAM ⭐\n\nIn our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!\n\nBeing an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.\n\nWe move fast, with a lot of ownership, and are proud to tackle big problems!\n\nOur process is very simple: those who make product decisions are the same ones who build them.\n\nOur stack is React, Python/Flask, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.\n\nWant to know more? Read this article https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan if you want to discover how life as an Engineer at Alan and this article https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c on our Engineering career path.\n\n\n\n🌍 HOW WE WORK\n\nLocation: You must be legally eligible to work in France, Belgium, or Spain.\n\nRemote work: We offer remote work flexibility, but we value in-person collaboration\n\n\n🎯 IMPORTANT NOTE: WE HIRE PEOPLE, NOT ROLES.\n\nIf you're excited about this opportunity but don't check every box, we'd love to hear from you. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.\n\nIf you identify yourself as a woman: Did you know that research shows women often apply only when meeting 100% of requirements?\n\nRemember, this is just a guide, not a checklist. We'll be thrilled to receive your application!\n\n🔖 Check out our About Alan and Career pages, as well as our Medium, blog and Glassdoor pages for more info.\n\n\nYOU WANT TO KNOW MORE ABOUT ALAN?\n\n - 🙌 Perks & Benefits https://alan.com/en/careers/a/salary-equity: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.\n\n - 🤘 A strong culture https://alan.com/en/about/a/leadership-principles: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work\n\n🔄 A quick note about the process\nNote: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas here https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link."},"descriptionClosing":null},"shortDescription":null,"applicationFormDefinitionId":"833a9e7d-d875-4bc2-bc44-43e7962632b9","surveyFormDefinitionIds":[],"linkedData":{"@context":"https://schema.org/","@type":"JobPosting","title":"Fullstack Software Engineer (x/f/m) - Claims Management","description":"<h2><strong>You. Better. With Alan.</strong></h2><p style=\"min-height:1.5em\">Alan is building a vertically integrated health partner that unites insurance and smart healthcare delivery into one seamless system. Our vision is to make prevention the new norm of care for all.</p><p style=\"min-height:1.5em\"><strong>Our mission:</strong> Help people live in good health to 100 while helping employers feel proud, turning health benefits from a cost centre into their most valuable investment.</p><p style=\"min-height:1.5em\">By connecting all aspects of care (private, public, and direct to consumer) we create the most member-centric healthcare experience, reducing claims costs while generating new monetization opportunities.</p><p style=\"min-height:1.5em\"><strong>We partner with tens of thousands of companies across France 🇫🇷, Spain 🇪🇸, Belgium 🇧🇪, and Canada 🇨🇦, serving over a million members.</strong></p><h2><strong>How we work: our Leadership Principles</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Mission is the Boss</strong> — We think long-term and are methodical optimists who take risks, seeking our mission's success above all else.</p></li><li><p style=\"min-height:1.5em\"><strong>Distributed Ownership</strong> — Accountable enlightened despots: everyone owns their decisions and results.</p></li><li><p style=\"min-height:1.5em\"><strong>Radical Transparency</strong> — All information is accessible and written-first, so everyone can make the best decisions asynchronously.</p></li><li><p style=\"min-height:1.5em\"><strong>Always Growing</strong> — Direct, positive, and caring feedback, combined with self-growth ownership.</p></li></ul><h1><strong>🚀 What you'll build and who you'll work with</strong></h1><p style=\"min-height:1.5em\">You would join the team called “<strong>Claims Management</strong>”, in charge of refunding <strong>€350M+ of healthcare expenses</strong> every year to <strong>1M+ members</strong> across France, Belgium, Spain, and Canada.</p><p style=\"min-height:1.5em\">Our mission is to refund each member as fast as we can and the right amount, while being cost-effective for Alan.</p><p style=\"min-height:1.5em\">We have internalized all the critical parts to handle health claims, which makes this product division a technical, deep, and exciting place to work.</p><p style=\"min-height:1.5em\">Claims Management contains several product crews, notably:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/working-on-document-processing-early-2023-88f642627ec0\"><strong>Document processing</strong></a>: 2M documents received every year. We automatically parse a good portion of them with LLMs but we want to go further.</p></li><li><p style=\"min-height:1.5em\"><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/claim-engine-saving-60-k-year-by-avoiding-unnecessary-recompute-dbbbb9f52de7\"><strong>Claims experience</strong></a><strong>:</strong> Building the most memorable and straightforward experience for our members to understand their guarantees and get a claim refunded. Across 4 different countries, mobile and desktop.</p></li><li><p style=\"min-height:1.5em\"><strong>Payments:</strong> Building a payment infra &amp; source ingestion system to make sure our members get refunded super fast or better, they don’t need to advance the money.</p></li><li><p style=\"min-height:1.5em\"><strong>Fraud fighting:</strong> 4M€ saved in 2024 with an internal stack combining Machine learning scoring, anomaly detections, and manual investigations</p></li></ul><h1></h1><h1><strong>⭐ Is it you we’re looking for?</strong></h1><p style=\"min-height:1.5em\">We are looking for engineers with 3+ years of experience who get excited about <strong>building complex systems</strong> that need to work perfectly <strong>24/7 every day</strong> of the year despite being on a high-growth trajectory.</p><p style=\"min-height:1.5em\"><strong>We value:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Passionate about creating<strong> delightful products with exceptional user experiences,</strong> you understand what it takes to build delightful user experiences at scale<strong>.</strong></p></li><li><p style=\"min-height:1.5em\">Good experience building and shipping <strong>web applications</strong></p></li><li><p style=\"min-height:1.5em\">You're genuinely interested in the business side - understanding conversion funnels, marketing metrics, and what drives growth</p></li><li><p style=\"min-height:1.5em\"><strong>Clear progression in your career</strong> - increasing responsibility, scope, and impact over time.</p></li><li><p style=\"min-height:1.5em\">Open to working with TypeScript and Python in a cross-platform environment, familiar with modern web technologies, and proficient in Object-Oriented Programming (Python, Java, Swift, Kotlin, or C#).</p></li></ul><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Self-starting and entrepreneurial.</p></li><li><p style=\"min-height:1.5em\">Humble and still willing to grow (no matter your seniority!).</p></li><li><p style=\"min-height:1.5em\">Collaborative, enthusiastic about teamwork, learning, and teaching.</p></li><li><p style=\"min-height:1.5em\">English working proficiency</p></li></ul><p style=\"min-height:1.5em\"><strong>Mission Alignment:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Healthcare technology excites you</p></li><li><p style=\"min-height:1.5em\">Leveraging AI to redefine our roles and unlock scalability</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>⭐ The Engineering team ⭐</strong></h1><p style=\"min-height:1.5em\">In our engineering team, we build the infrastructure, interfaces, and applications to provide first-class service to our members, health professionals, and even ourselves!</p><p style=\"min-height:1.5em\">Being an engineer at Alan means joining a team of talented, committed and passionate engineers, with a lot of product interaction.</p><p style=\"min-height:1.5em\">We move fast, with a lot of ownership, and are proud to tackle big problems!</p><p style=\"min-height:1.5em\">Our process is very simple: those who make product decisions are the same ones who build them.</p><p style=\"min-height:1.5em\">Our stack is React, Python/Flask, PostgreSQL in a monorepo. We deploy daily and believe in distributed ownership - you build it, you own it.</p><p style=\"min-height:1.5em\">Want to know more? Read <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://blog.alan.com/tech-et-produit/engineering-organisation-at-alan\">this article</a> if you want to discover how life as an Engineer at Alan and <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://medium.com/alan/engineering-career-path-at-alan-e5de5c2e740c\">this article</a> on our Engineering career path.</p><h1><br /><strong>🌍 How we work</strong></h1><p style=\"min-height:1.5em\"><strong>Location</strong>: You must be legally eligible to work in France, Belgium, or Spain.</p><p style=\"min-height:1.5em\"><strong>Remote</strong> <strong>work</strong>: We offer remote work flexibility, but we value in-person collaboration</p><p style=\"min-height:1.5em\"></p><h1><strong>🎯 Important note: we hire people, not roles.</strong></h1><p style=\"min-height:1.5em\">If you're excited about this opportunity but don't check every box, <strong>we'd love to hear from you</strong>. Everyone, no matter how underrepresented, should feel free to apply, as it can only bring learnings or success.</p><p style=\"min-height:1.5em\"><strong>If you identify yourself as a woman</strong>: Did you know that research shows women often apply only when meeting 100% of requirements?</p><p style=\"min-height:1.5em\"><strong>Remember, this is just a guide, not a checklist. </strong>We'll be thrilled to receive your application!</p><p style=\"min-height:1.5em\">🔖 Check out our About Alan and Career pages, as well as our Medium, blog and Glassdoor pages for more info.</p><p style=\"min-height:1.5em\"></p><h2><strong>You want to know more about Alan?</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">🙌 <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/careers/a/salary-equity\"><u>Perks &amp; Benefits</u></a>: Alaners are provided with a stimulating environment and perks ensuring they are happy, efficient and spend only high-quality time with co-workers.</p></li><li><p style=\"min-height:1.5em\">🤘 <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://alan.com/en/about/a/leadership-principles\"><u>A strong culture</u></a>: People joining Alan are often surprised and delighted by our innovative working method. We have a set of cultural values that guide our approach to work</p></li></ul><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>🔄 A quick note about the process</strong><br /><em>Note: While you're applying for a specific area,, you may join a different engineering team based on where we think you'll have the most impact. Check out descriptions of other areas </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/alaninsurance/Software-Engineering-Areas-Alan-2c61426e8be7805bacd2cdbc08c32640?source=copy_link\"><em>here</em></a><em>. </em></p>","directApply":true,"identifier":{"@type":"PropertyValue","name":"Alan","value":"729263fe-46f2-49be-bb88-d79a946494c1"},"datePosted":"2026-02-17","hiringOrganization":{"@type":"Organization","name":"Alan","sameAs":"https://alan.com/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/16fb5c4f-12a4-4e77-a698-3c881ea0c4f7/afa477a5-ddfc-4c59-b5e9-b926972e3e58/b8987509-72b3-449b-8d58-1af70771e1e8.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Europe","addressRegion":"Europe","addressCountry":"European Union"}},"employmentType":"FULL_TIME"},"publishedDate":"2026-02-17","applicationDeadline":null,"structuredMetadataOverride":null,"address":{"postalAddress":{"addressRegion":"Europe","addressCountry":"European Union","addressLocality":"Europe"}},"isRemote":null,"workplaceType":null,"employmentType":"FullTime","jobId":"38968646-3ae1-40db-98b1-bbde9db89373","jobRequisitionId":null,"organizationId":"16fb5c4f-12a4-4e77-a698-3c881ea0c4f7","isConfidential":false,"compensation
